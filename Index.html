    function getActiveSpeakerTarget() {
      if (!activeDialogueTarget) return null;

      if (typeof activeDialogueTarget.tileX === "number" && typeof activeDialogueTarget.tileY === "number") {
        return activeDialogueTarget;
      }

      const npcMatch = npcs.find(function (npc) {
        return npc.mapId === currentMap.id && npc.name === activeDialogueTarget.name;
      });

      if (npcMatch) return npcMatch;

      const objectMatch = interactiveObjects.find(function (object) {
        return object.mapId === currentMap.id && object.name === activeDialogueTarget.name;
      });

      return objectMatch || null;
    }

    function getActiveSpeakerScreenPosition() {
      const target = getActiveSpeakerTarget();

      if (!target) return null;

      return {
        x: target.tileX * TILE_SIZE - camera.x + TILE_SIZE / 2,
        y: target.tileY * TILE_SIZE - camera.y + TILE_SIZE / 2
      };
    }

    function drawActiveSpeakerHighlight() {
      if (!activeDialogueTarget && !activeChoices) return;

      const speakerPosition = getActiveSpeakerScreenPosition();
      if (!speakerPosition) return;

      if (
        speakerPosition.x < -TILE_SIZE ||
        speakerPosition.x > canvas.width + TILE_SIZE ||
        speakerPosition.y < -TILE_SIZE ||
        speakerPosition.y > canvas.height + TILE_SIZE
      ) {
        return;
      }

      ctx.strokeStyle = COLORS.highlight;
      ctx.lineWidth = 3;
      ctx.strokeRect(
        Math.floor(speakerPosition.x - 18),
        Math.floor(speakerPosition.y - 22),
        36,
        42
      );

      ctx.fillStyle = COLORS.highlight;
      ctx.font = "bold 18px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("▼", speakerPosition.x, speakerPosition.y - 28);
    }

    function drawSpeechPointer(boxX, boxY, boxWidth, speakerPosition) {
      if (!speakerPosition) return;

      const pointerBaseX = Math.max(boxX + 28, Math.min(speakerPosition.x, boxX + boxWidth - 28));

      ctx.fillStyle = "rgba(12, 18, 29, 0.98)";
      ctx.strokeStyle = COLORS.cream;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(pointerBaseX - 10, boxY);
      ctx.lineTo(pointerBaseX + 10, boxY);
      ctx.lineTo(pointerBaseX, boxY - 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawRPGDialoguePanel(boxX, boxY, boxWidth, boxHeight, title) {
      ctx.fillStyle = "rgba(12, 18, 29, 0.98)";
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.strokeStyle = COLORS.cream;
      ctx.lineWidth = 3;
      ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

      ctx.strokeStyle = COLORS.uiMid || "#2f3a4a";
      ctx.lineWidth = 2;
      ctx.strokeRect(boxX + 5, boxY + 5, boxWidth - 10, boxHeight - 10);

      ctx.fillStyle = "rgba(255, 235, 112, 0.12)";
      ctx.fillRect(boxX + 9, boxY + 9, boxWidth - 18, 25);

      ctx.fillStyle = COLORS.highlight;
      ctx.font = "bold 13px Courier New";
      ctx.textAlign = "left";
      ctx.fillText(title, boxX + 18, boxY + 27);
    }


    function normalizePortraitSpeakerName(speakerName) {
      return String(speakerName || "")
        .toLowerCase()
        .replace(/[^a-z]/g, "");
    }

    function getPortraitKeyForSpeaker(speakerName) {
      const key = normalizePortraitSpeakerName(speakerName);

      if (key === "managermira") return "mira";
      if (key === "kai") return "kai";
      if (key === "lina") return "lina";
      if (key === "bram") return "bram";
      if (key === "oldmandaro") return "daro";
      if (key === "officerselene") return "selene";
      if (key === "merchantrafi") return "rafi";
      if (key === "narrator") return "narrator";
      return "default";
    }

    function getDialoguePortraitSpeaker() {
      if (openingCutscene.active) {
        const cutsceneLine = openingCutscene.lines[openingCutscene.index] || openingCutscene.lines[openingCutscene.lines.length - 1];
        return cutsceneLine ? cutsceneLine.speaker : "Narrator";
      }

      if (activeDialogueTarget) {
        return activeDialogueTarget.portraitSpeaker || activeDialogueTarget.name || "Message";
      }

      return "Message";
    }

    function getDialoguePortraitLayout(boxX, boxY, boxWidth, boxHeight, speakerName, preferredSize) {
      const outerPadding = 16;
      const gap = 18;
      const portraitPanelWidth = 92;
      const portraitPanelX = boxX + outerPadding;
      const portraitPanelY = boxY + 42;
      const portraitPanelHeight = Math.max(74, boxHeight - 62);
      const size = Math.max(58, Math.min(preferredSize || 72, portraitPanelWidth - 14, portraitPanelHeight - 14));
      const portraitX = portraitPanelX + Math.floor((portraitPanelWidth - size) / 2);
      const portraitY = portraitPanelY + Math.floor((portraitPanelHeight - size) / 2);
      const contentX = portraitPanelX + portraitPanelWidth + gap;
      const contentY = boxY + 16;
      const contentRight = boxX + boxWidth - outerPadding;
      const contentW = Math.max(160, contentRight - contentX);
      const contentBottom = boxY + boxHeight - 18;

      return {
        showPortrait: true,
        size,
        portraitX,
        portraitY,
        portraitPanelX,
        portraitPanelY,
        portraitPanelWidth,
        portraitPanelHeight,
        contentX,
        contentY,
        contentW,
        contentBottom,
        speakerY: boxY + 28,
        textY: boxY + 58
      };
    }

    function drawDialoguePortraitPanel(layout) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
      ctx.fillRect(layout.portraitPanelX, layout.portraitPanelY, layout.portraitPanelWidth, layout.portraitPanelHeight);
      ctx.strokeStyle = "rgba(255, 244, 204, 0.36)";
      ctx.lineWidth = 2;
      ctx.strokeRect(layout.portraitPanelX, layout.portraitPanelY, layout.portraitPanelWidth, layout.portraitPanelHeight);
    }

    function drawDialogueSpeakerName(speakerName, layout) {
      ctx.fillStyle = COLORS.highlight;
      ctx.font = "bold 13px Courier New";
      ctx.textAlign = "left";
      ctx.fillText(String(speakerName || "MESSAGE").toUpperCase(), layout.contentX, layout.speakerY);
    }

    function drawPortraitPixelRect(baseX, baseY, unit, px, py, pw, ph, color) {
      ctx.fillStyle = color;
      ctx.fillRect(
        Math.floor(baseX + px * unit),
        Math.floor(baseY + py * unit),
        Math.ceil(pw * unit),
        Math.ceil(ph * unit)
      );
    }

    function drawPortraitOutline(baseX, baseY, unit, px, py, pw, ph, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1, Math.floor(unit));
      ctx.strokeRect(
        Math.floor(baseX + px * unit),
        Math.floor(baseY + py * unit),
        Math.ceil(pw * unit),
        Math.ceil(ph * unit)
      );
    }

    function drawRPGPortrait(speakerName, x, y, size) {
      const portraitKey = getPortraitKeyForSpeaker(speakerName);
      const unit = size / 32;
      const paletteMap = {
        mira: {
          bg: "#314454", frame: "#fff4cc", skin: "#f0c7a4", hair: "#4e3326", cloth: "#506c8f", accent: "#e3bc65", eye: "#1c1c24"
        },
        kai: {
          bg: "#3d304d", frame: "#fff4cc", skin: "#efc19c", hair: "#2b243d", cloth: "#c4635f", accent: "#7dc6f2", eye: "#14141a"
        },
        lina: {
          bg: "#354b56", frame: "#fff4cc", skin: "#f0ccae", hair: "#3b2e35", cloth: "#7db2a8", accent: "#dce8f0", eye: "#1b1d24"
        },
        bram: {
          bg: "#4a4136", frame: "#fff4cc", skin: "#d3ab87", hair: "#6c7a8b", cloth: "#7d5b43", accent: "#d6b56d", eye: "#17181c"
        },
        daro: {
          bg: "#425042", frame: "#fff4cc", skin: "#d8b898", hair: "#c7c7c7", cloth: "#788b66", accent: "#d9c987", eye: "#18191f"
        },
        selene: {
          bg: "#233c59", frame: "#fff4cc", skin: "#edc4a0", hair: "#243447", cloth: "#425d85", accent: "#f0de77", eye: "#101520"
        },
        rafi: {
          bg: "#5a4034", frame: "#fff4cc", skin: "#e0b083", hair: "#5d3024", cloth: "#6b8a4a", accent: "#d98f4e", eye: "#171514"
        },
        narrator: {
          bg: "#22313f", frame: "#fff4cc", skin: "#d8d8d8", hair: "#8fb7ca", cloth: "#4c6581", accent: "#ffeb70", eye: "#101520"
        },
        default: {
          bg: "#344455", frame: "#fff4cc", skin: "#d9be9a", hair: "#5b6571", cloth: "#586b80", accent: "#ffeb70", eye: "#101520"
        }
      };

      const palette = paletteMap[portraitKey] || paletteMap.default;

      ctx.save();
      ctx.imageSmoothingEnabled = false;

      drawPixelRect(x, y, size, size, palette.bg, palette.frame);
      drawPixelRect(x + 4, y + 4, size - 8, size - 8, "rgba(255,255,255,0.05)", null);

      const px = function (gx, gy, gw, gh, color) {
        drawPortraitPixelRect(x, y, unit, gx, gy, gw, gh, color);
      };
      const outline = function (gx, gy, gw, gh, color) {
        drawPortraitOutline(x, y, unit, gx, gy, gw, gh, color);
      };

      // Background motif.
      px(2, 2, 28, 28, palette.bg);
      px(3, 21, 26, 7, "rgba(255,255,255,0.05)");

      // Body and neck.
      px(9, 21, 14, 2, palette.skin);
      px(7, 22, 18, 8, palette.cloth);
      px(11, 24, 10, 6, palette.cloth);
      px(13, 22, 6, 3, palette.accent);

      // Face.
      px(9, 8, 14, 13, palette.skin);
      px(10, 9, 12, 11, palette.skin);

      // Generic facial features.
      px(12, 13, 2, 2, palette.eye);
      px(18, 13, 2, 2, palette.eye);
      px(15, 15, 2, 2, "rgba(140,90,70,0.45)");
      px(13, 18, 6, 1, "#8b564d");
      px(12, 12, 1, 1, "#ffffff");
      px(18, 12, 1, 1, "#ffffff");

      if (portraitKey === "mira") {
        px(8, 7, 16, 4, palette.hair);
        px(7, 9, 4, 7, palette.hair);
        px(21, 9, 3, 7, palette.hair);
        px(20, 5, 5, 4, palette.hair);
        px(14, 17, 5, 1, "#5a2c2b");
        px(21, 23, 5, 5, palette.accent);
        px(22, 24, 3, 3, "#f5e7bc");
        px(23, 25, 1, 1, "#92703b");
      } else if (portraitKey === "kai") {
        px(8, 6, 4, 3, palette.hair);
        px(11, 5, 4, 4, palette.hair);
        px(15, 4, 4, 5, palette.hair);
        px(19, 5, 4, 4, palette.hair);
        px(22, 7, 2, 3, palette.hair);
        px(11, 22, 10, 6, palette.cloth);
        px(8, 22, 4, 6, palette.accent);
        px(20, 22, 4, 6, palette.accent);
        px(13, 18, 6, 1, "#b03b42");
      } else if (portraitKey === "lina") {
        px(8, 7, 16, 4, palette.hair);
        px(8, 9, 3, 9, palette.hair);
        px(21, 9, 3, 9, palette.hair);
        px(10, 12, 5, 4, "#dce8f0");
        px(17, 12, 5, 4, "#dce8f0");
        px(15, 13, 2, 1, "#dce8f0");
        outline(10, 12, 5, 4, palette.eye);
        outline(17, 12, 5, 4, palette.eye);
        px(21, 22, 5, 5, "#f0f0e6");
        px(22, 23, 3, 3, "#d9d9cd");
      } else if (portraitKey === "bram") {
        px(8, 7, 16, 4, palette.hair);
        px(9, 5, 14, 4, palette.hair);
        px(7, 8, 3, 3, palette.accent);
        px(10, 17, 12, 3, "#8b6a57");
        px(12, 13, 2, 1, palette.eye);
        px(18, 14, 2, 1, palette.eye);
        px(14, 19, 5, 1, "#5d3c31");
      } else if (portraitKey === "daro") {
        px(9, 7, 14, 3, palette.hair);
        px(8, 9, 4, 5, palette.hair);
        px(20, 9, 4, 5, palette.hair);
        px(12, 11, 1, 1, palette.hair);
        px(19, 11, 1, 1, palette.hair);
        px(13, 17, 6, 2, palette.hair);
        px(13, 19, 6, 1, "#7b5b48");
        px(10, 22, 12, 6, palette.cloth);
      } else if (portraitKey === "selene") {
        px(7, 7, 18, 4, palette.hair);
        px(9, 5, 14, 3, palette.cloth);
        px(8, 8, 16, 2, palette.accent);
        px(7, 9, 3, 5, palette.hair);
        px(22, 9, 2, 5, palette.hair);
        px(18, 23, 3, 3, palette.accent);
        px(19, 24, 1, 1, "#ffffff");
        px(13, 18, 6, 1, "#77413c");
      } else if (portraitKey === "rafi") {
        px(8, 6, 16, 4, palette.accent);
        px(9, 5, 14, 3, palette.accent);
        px(7, 9, 3, 5, palette.hair);
        px(21, 9, 3, 5, palette.hair);
        px(13, 17, 6, 2, palette.hair);
        px(13, 19, 6, 1, "#7f4a30");
        px(9, 22, 14, 6, palette.cloth);
        px(13, 23, 6, 2, palette.accent);
      } else if (portraitKey === "narrator") {
        px(8, 7, 16, 4, palette.hair);
        px(8, 9, 3, 6, palette.hair);
        px(21, 9, 3, 6, palette.hair);
        px(10, 22, 12, 6, palette.cloth);
        px(12, 24, 8, 2, palette.accent);
      } else {

        px(21, 9, 3, 6, palette.hair);
        px(10, 22, 12, 6, palette.cloth);

      outline(2, 2, 28, 28, "rgba(255,255,255,0.06)");

      ctx.restore();
      return true;

    function measureWrappedTextHeight(text, maxWidth, lineHeight) {
      const words = String(text || "").split(" ");
      let line = "";
      let lineCount = 1;

      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + " ";
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && i > 0) {
          line = words[i] + " ";
          lineCount++;
        } else {
          line = testLine;
        }
      }

      return Math.max(lineHeight, lineCount * lineHeight);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";

      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + " ";
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && i > 0) {
          ctx.fillText(line, x, y);
          line = words[i] + " ";
          y += lineHeight;
        } else {
          line = testLine;
        }
      }

      ctx.fillText(line, x, y);
      return y;
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeDialogueLines(lines) {
      if (Array.isArray(lines)) return lines;
      if (lines && typeof lines.prompt === "string") return [lines.prompt];
      if (typeof lines === "string") return [lines];
      return ["There is nothing unusual here."];
    }

    function getNearbyAreaTextForPanel() {
      if (typeof buildingLabels === "undefined") return "";

      for (const label of buildingLabels) {
        if (label.mapId !== currentMap.id) continue;

        const distance = getTileDistance(label.tileX, label.tileY);
        if (distance <= (label.nearDistance || 3)) {
          return label.nearText || label.text;
        }
      }

      return "";
    }

    // Wrong goods reach the customer only if they entered the flow and were
    // never caught at the picking-list checkpoint. Correcting the picking list
    // means the error was found before final delivery.
    function wrongGoodsWereDelivered() {
      return scmPerformance.wrongGoodsLoaded && !scmPerformance.pickingListCorrected;
    }

    // Rank quality order, worst to best. Used to apply caps that can only lower
    // a rank, never raise it.
    const RANK_ORDER = ["Failed SCM Ending", "C Rank", "B Rank", "A Rank", "S Rank"];

    function capRankAt(currentRank, capRank) {
      return RANK_ORDER.indexOf(currentRank) <= RANK_ORDER.indexOf(capRank)
        ? currentRank
        : capRank;
    }

    function getFinalRank() {
      const sideQuestCompletionBonus = getCompletedSideQuestCount() >= 3 ? 1 : 0;
      const scmScore = scmPerformance.scmScore + sideQuestCompletionBonus;
      const cargoCondition = scmPerformance.cargoCondition;
      const reputation = playerStats.Reputation + sideQuestCompletionBonus;
      const timeLost = scmPerformance.timeLost;
      const deadlineFailed = scmPerformance.deadlineFailed;
      const wrongGoodsLoaded = scmPerformance.wrongGoodsLoaded;
      const damagedGoodsMixed = scmPerformance.damagedGoodsMixed;
      const correctContainerReleased = scmPerformance.correctContainerReleased;
      const wrongGoodsDelivered = wrongGoodsWereDelivered();

      // --- Critical logistics failures: the process broke before delivery ---
      if (wrongGoodsDelivered) return "Failed SCM Ending";
      if (!correctContainerReleased) return "Failed SCM Ending";
      if (damagedGoodsMixed && cargoCondition < 60) return "Failed SCM Ending";
      if (cargoCondition < 50) return "Failed SCM Ending";
      if (scmScore < 2) return "Failed SCM Ending";
      if (reputation <= -2 && (wrongGoodsLoaded || damagedGoodsMixed || deadlineFailed)) {
        return "Failed SCM Ending";
      }

      // --- Base rank from positive performance ---
      let rank;
      if (scmScore >= 8 && cargoCondition >= 90 && reputation >= 5 && timeLost <= 2 &&
          !deadlineFailed && !wrongGoodsLoaded && !damagedGoodsMixed) {
        rank = "S Rank";
      } else if (scmScore >= 6 && cargoCondition >= 75 && reputation >= 3 && timeLost <= 4 &&
          !deadlineFailed && !wrongGoodsLoaded && !damagedGoodsMixed) {
        rank = "A Rank";
      } else if (scmScore >= 4 && cargoCondition >= 60 && reputation >= 1) {
        rank = "B Rank";
      } else {
        rank = "C Rank";
      }

      // --- Caps for serious issues. A cap can only lower the rank. ---
      if (wrongGoodsLoaded || damagedGoodsMixed || reputation <= 0 || timeLost >= 10) {
        rank = capRankAt(rank, "C Rank");
      }
      if (deadlineFailed || timeLost >= 7) {
        rank = capRankAt(rank, "B Rank");
      }

      return rank;
    }

      ctx.font = "bold 14px Courier New";
      ctx.fillText("The Warehouse Trial", canvas.width / 2, panelY + 66);

      const briefingText = "You have been entrusted with the coordination of a critical supply chain operation.\n\nEvery item must be processed correctly, checked carefully, loaded safely, and delivered to its final destination.\n\nA festival depends on this shipment.\n\nMove with care. Verify before acting. A delivery is only successful if the right goods reach the right place, in the right condition, at the right time.";

      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Courier New";
      ctx.textAlign = "left";

      const paragraphs = briefingText.split("\n\n");
      let y = panelY + 102;

      for (let i = 0; i < paragraphs.length; i++) {
        y = wrapText(paragraphs[i], panelX + 26, y, panelWidth - 52, 18) + 13;
      }

      ctx.fillStyle = "#e8dfb5";
      ctx.font = "bold 13px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("Press Enter to Start Operation", canvas.width / 2, panelY + panelHeight - 22);
    }

    function drawIntroSequence(now) {
      if (!introSequence.active) return;

      if (introSequence.phase === "loading") {
        drawLoadingScreen(now);
        return;
      }

      if (introSequence.phase === "title") {
        drawTitleCard();
        return;
      }

      drawMissionBriefing();
    }


    // ===============================
    // DRAWING: OPENING CUTSCENE
    // ===============================

    function drawOpeningCutscene() {
      if (!openingCutscene.active) return;

      // Draw the Ravenford map behind the cutscene, but do not draw the normal player.
      // The player is drawn as part of the bus scene below instead.
      drawMap();
      drawInteractiveObjects();
      drawNPCs();

      // Cinematic dark overlay.
      ctx.fillStyle = "rgba(8, 12, 20, 0.38)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Smaller bus arrival illustration placed on Ravenford's road.
      // The visible Ravenford road is around screen Y 224, so the bus wheels sit on that road.
      const busX = 100;
      const busY = 186;
      const busWidth = 116;
      const busHeight = 42;

      // Road highlight directly under the bus, aligned with the actual road row.
      ctx.fillStyle = "#d6b56d";
      ctx.fillRect(busX - 20, 224, busWidth + 52, 32);

      ctx.fillStyle = "#a98244";
      ctx.fillRect(busX - 20, 252, busWidth + 52, 4);

      // Bus shadow on the road.
      ctx.fillStyle = "rgba(0, 0, 0, 0.30)";
      ctx.fillRect(busX + 7, 229, busWidth - 4, 8);

      // Bus body.
      ctx.fillStyle = "#f6c453";
      ctx.fillRect(busX, busY, busWidth, busHeight);

      ctx.strokeStyle = COLORS.outline;
      ctx.lineWidth = 3;
      ctx.strokeRect(busX, busY, busWidth, busHeight);

      // Windows.
      ctx.fillStyle = "#4d96d8";
      ctx.fillRect(busX + 10, busY + 9, 21, 14);
      ctx.fillRect(busX + 38, busY + 9, 21, 14);
      ctx.fillRect(busX + 66, busY + 9, 21, 14);

      // Door.
      ctx.fillStyle = "#7a4a23";
      ctx.fillRect(busX + 92, busY + 8, 17, 31);

      // Wheels, now visibly touching the road.
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(busX + 16, busY + 36, 14, 14);
      ctx.fillRect(busX + 82, busY + 36, 14, 14);

      ctx.fillStyle = "#e8e8e8";
      ctx.fillRect(busX + 20, busY + 40, 6, 6);
      ctx.fillRect(busX + 86, busY + 40, 6, 6);

      // Bus label.
      ctx.fillStyle = COLORS.cream;
      ctx.font = "bold 10px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("RAVENFORD", busX + busWidth / 2, busY + 33);

      // Cutscene player position:
      // First line: player is still inside the bus window.
      // After that: player has stepped down beside the door onto the road.
      if (openingCutscene.index === 0) {
        ctx.fillStyle = "#2f5eff";
        ctx.fillRect(busX + 44, busY + 13, 9, 10);

        ctx.fillStyle = "#f0c7a0";
        ctx.fillRect(busX + 45, busY + 8, 7, 6);

        ctx.fillStyle = "#202020";
        ctx.fillRect(busX + 44, busY + 6, 9, 3);
      } else {
        const cutPlayerX = busX + 104;
        const cutPlayerY = 228;

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(cutPlayerX - 1, cutPlayerY + 18, 15, 3);

        ctx.fillStyle = "#1f2937";
        ctx.fillRect(cutPlayerX + 1, cutPlayerY + 13, 4, 7);
        ctx.fillRect(cutPlayerX + 8, cutPlayerY + 13, 4, 7);

        ctx.fillStyle = "#2f5eff";
        ctx.fillRect(cutPlayerX, cutPlayerY + 4, 13, 12);

        ctx.fillStyle = "#f0c7a0";
        ctx.fillRect(cutPlayerX + 2, cutPlayerY - 4, 9, 8);

        ctx.fillStyle = "#202020";
        ctx.fillRect(cutPlayerX + 1, cutPlayerY - 6, 11, 4);

        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 1;
        ctx.strokeRect(cutPlayerX, cutPlayerY + 4, 13, 12);
        ctx.strokeRect(cutPlayerX + 2, cutPlayerY - 4, 9, 8);
      }

      // Cutscene speaker and text box.
      const line = openingCutscene.lines[openingCutscene.index];

      const boxX = 34;
      const boxY = canvas.height - 142;
      const boxWidth = canvas.width - 68;
      const boxHeight = 116;

      drawUIPanel(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = COLORS.highlight;
      ctx.font = "bold 13px Courier New";
      ctx.textAlign = "left";
      ctx.fillText(line.speaker.toUpperCase(), boxX + 18, boxY + 25);

      ctx.fillStyle = "#ffffff";
      ctx.font = "15px Courier New";
      wrapText(line.text, boxX + 18, boxY + 52, boxWidth - 36, 20);

      ctx.fillStyle = "#cbd5e1";
      ctx.font = "11px Courier New";
      ctx.fillText("E / ENTER / SPACE: CONTINUE", boxX + 18, boxY + boxHeight - 16);

      ctx.textAlign = "right";
      ctx.fillText(
        (openingCutscene.index + 1) + "/" + openingCutscene.lines.length,
        boxX + boxWidth - 18,
        boxY + boxHeight - 16
      );
    }



    // ===============================
    // GAME LOOP
    // ===============================

    function gameLoop() {
      const now = performance.now();

      if (introSequence.active) {
        updateIntroSequence(now);
        syncViewForGameState();
        renderIntroScreen(now);
        requestAnimationFrame(gameLoop);
        return;
      }

      if (isEndGameState()) {
        syncViewForGameState();
        requestAnimationFrame(gameLoop);
        return;
      }

      if (openingCutscene.active) {
        updateCamera();
        drawOpeningCutscene();
        drawDialogueBox();
        renderGuiPanel();
        requestAnimationFrame(gameLoop);
        return;
      }

      if (!minimapOpen) {
        handleMovement();
        updatePlayerPosition();
        checkMapTransition();
      }

      updateNPCs(now);
      updateEnvironmentalAnimations(now);
      updateCamera();

      drawMap();
      drawEnvironmentalAnimations();
      drawInteractiveObjects();
      drawNPCs();
      drawPlayer();

      drawActiveSpeakerHighlight();
      drawDialogueBox();
      drawMinimapOverlay();

      renderGuiPanel();

      requestAnimationFrame(gameLoop);
    }



    gameLoop();
  
  </script>
</body>
</html>
