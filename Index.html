    function handleChoiceSelection(choiceIndex) {
      if (!activeChoices) return;

      if (!canSelectVisibleChoice(choiceIndex)) {
        return;
      }

      const selectedChoice = activeChoices.choices[choiceIndex];
      if (!selectedChoice) return;

      playSound("choiceSelect");

      if (!hasRequiredStat(selectedChoice)) {
        playSound("wrongDecision");
        applyStatChanges(selectedChoice.failureStatChanges || { Reputation: -1 });
        const failureDeadlineLines = adjustTime(selectedChoice.failureTimeChange || -3);

        const failureSCMLines = applySCMChanges(selectedChoice.failureSCMChanges || {
          scmScore: -1,
          timeLost: Math.max(1, Math.abs(selectedChoice.failureTimeChange || -3))
        });

        const failedSideQuestLines = applySideQuestOutcome(selectedChoice);
        recordQuestLogForChoice(selectedChoice, true);

        if (selectedChoice.advanceStep) {
          advanceCurrentQuestStep();
        }

        if (selectedChoice.completeRavenford) {
          completeRavenfordVillage();
          advanceCurrentQuestStep();
        }

        if (selectedChoice.completePortAzure) {
          completePortAzureQuests();
        }

        recordDecision(selectedChoice, false);
        saveGame({ showMessage: true });
        showChoiceResult(getChoiceFailureResultLines(selectedChoice).concat(failedSideQuestLines, failureSCMLines, failureDeadlineLines));
        return;
      }

      applyStatChanges(selectedChoice.statChanges);
      const deadlineLines = adjustTime(selectedChoice.timeChange || 0);
      const scmResultLines = applySCMChanges(selectedChoice.scmChanges);
      const sideQuestLines = applySideQuestOutcome(selectedChoice);
      recordQuestLogForChoice(selectedChoice, false);

      if (selectedChoice.itemReward) {
        addItem(selectedChoice.itemReward);
      }

      if (selectedChoice.itemRewards) {
        selectedChoice.itemRewards.forEach(function (itemName) {
          addItem(itemName);
        });
      }

      if (selectedChoice.setFlag && rivalState[selectedChoice.setFlag] !== undefined) {
        rivalState[selectedChoice.setFlag] = true;
      }

      let earnedCertificate = false;

      if (selectedChoice.advanceStep) {
        advanceCurrentQuestStep();
      }

      if (selectedChoice.completeRavenford) {
        completeRavenfordVillage();
        advanceCurrentQuestStep();
        earnedCertificate = true;
      }

      if (selectedChoice.completePortAzure) {
        completePortAzureQuests();
        earnedCertificate = true;
      }

      if (!earnedCertificate) {
        const decisionSound = getDecisionSoundForChoice(selectedChoice);

        if (decisionSound === "wrongDecision") {
          playSound("wrongDecision");
        } else if (selectedChoice.advanceStep && decisionSound === "correctDecision") {
          playSound("questComplete");
        } else {
          playSound(decisionSound);
        }
      }

      recordDecision(selectedChoice, true);
      saveGame({ showMessage: true });
      showChoiceResult((selectedChoice.resultLines || []).concat(sideQuestLines, scmResultLines, deadlineLines));
    }



    function handleInteraction(key) {
      if (gameState !== "playing") return;
      if (activeChoices) return;

      if (activeDialogueTarget) {
        if (handleRollingTextContinue()) {
          return;
        }

        playSound("interaction");
        dialogueLineIndex++;

        if (dialogueLineIndex >= activeDialogueTarget.dialogueLines.length) {
          if (dialogueIsChoiceResult) {
            closeDialogue();
            return;
          }

          const choiceSet = getChoiceSetForTarget(activeDialogueTarget);

          if (choiceSet) {
            activeChoices = prepareChoiceSet(choiceSet);
            dialogueLineIndex = normalizeDialogueLines(activeDialogueTarget.dialogueLines).length - 1;
            return;
          }

          closeDialogue();
        }

        return;
      }

      if (key !== "e" && key !== "enter") return;

      triggerNearbyDoorAnimation();

      const nearbyObject = getNearbyObject();
      const nearbyNPC = getNearbyNPC();

      // Prioritize the current quest target when nearby.
      if (nearbyObject && isCurrentTarget(nearbyObject.name)) {
        playSound("interaction");
        recordObjectDiscovery(nearbyObject.name);
        activeDialogueTarget = {
          ...nearbyObject,
          dialogueLines: normalizeDialogueLines(getDialogueLinesForTarget(nearbyObject))
        };
        activeObject = nearbyObject;
        dialogueLineIndex = 0;
        dialogueIsChoiceResult = false;
        return;
      }

      if (nearbyNPC && isCurrentTarget(nearbyNPC.name)) {
        playSound("interaction");
        activeDialogueTarget = {
          ...nearbyNPC,
          dialogueLines: normalizeDialogueLines(getDialogueLinesForTarget(nearbyNPC))
        };
        activeObject = null;
        dialogueLineIndex = 0;
        dialogueIsChoiceResult = false;
        return;
      }

      // Normal inspection and NPC talk.
      if (nearbyNPC) {
        playSound("interaction");
        activeDialogueTarget = {
          ...nearbyNPC,
          dialogueLines: normalizeDialogueLines(getDialogueLinesForTarget(nearbyNPC))
        };
        activeObject = null;
        dialogueLineIndex = 0;
        dialogueIsChoiceResult = false;
        return;
      }

      if (nearbyObject) {
        playSound("interaction");
        recordObjectDiscovery(nearbyObject.name);
        activeDialogueTarget = {
          ...nearbyObject,
          dialogueLines: normalizeDialogueLines(getDialogueLinesForTarget(nearbyObject))

        dialogueLineIndex = 0;
        dialogueIsChoiceResult = false;
      }
    }

    function handleMovement() {
      if (introSequence.active) return;
      if (openingCutscene.active) return;
      if (endingScreenActive) return;
      if (minimapOpen) return;
      if (activeDialogueTarget || activeChoices) return;
      if (player.moving) return;

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp || keys.w) {
        dy = -TILE_SIZE;
        player.facing = "up";
      } else if (keys.ArrowDown || keys.s) {
        dy = TILE_SIZE;
        player.facing = "down";
      } else if (keys.ArrowLeft || keys.a) {
        dx = -TILE_SIZE;
        player.facing = "left";
      } else if (keys.ArrowRight || keys.d) {
        dx = TILE_SIZE;
        player.facing = "right";
      }

      if (dx !== 0 || dy !== 0) {
        const nextX = player.x + dx;
        const nextY = player.y + dy;

        if (isWalkableTile(nextX, nextY)) {
          player.targetX = nextX;
          player.targetY = nextY;
          player.moving = true;
        }
      }
    }


    function updatePlayerPosition() {
      if (!player.moving) return;

      if (player.x < player.targetX) {
        player.x += player.speed;
        if (player.x > player.targetX) player.x = player.targetX;
      } else if (player.x > player.targetX) {
        player.x -= player.speed;
        if (player.x < player.targetX) player.x = player.targetX;
      }

      if (player.y < player.targetY) {
        player.y += player.speed;
        if (player.y > player.targetY) player.y = player.targetY;
      } else if (player.y > player.targetY) {
        player.y -= player.speed;
        if (player.y < player.targetY) player.y = player.targetY;
      }

      if (player.x === player.targetX && player.y === player.targetY) {
        player.moving = false;
      }
    }

    function isEnvironmentalAnimationActive() {
      return gameState === "playing" && !introSequence.active && !openingCutscene.active && !isEndGameState();
    }

    function getAnimationNow() {
      return performance.now ? performance.now() : Date.now();
    }

    function getVisualObjectByName(mapId, objectName) {
      return interactiveObjects.find(function (object) {
        return object.mapId === mapId && object.name === objectName;
      });
    }

    function isWorldPointVisible(worldX, worldY, padding = 96) {
      return worldX >= camera.x - padding &&
        worldX <= camera.x + canvas.width + padding &&
        worldY >= camera.y - padding &&
        worldY <= camera.y + canvas.height + padding;
    }

    function updateEnvironmentalAnimations(now) {
      if (!isEnvironmentalAnimationActive()) {
        environmentalFX.lastUpdateAt = now;
        return;
      }

      const dt = Math.min(80, Math.max(0, now - environmentalFX.lastUpdateAt));
      environmentalFX.lastUpdateAt = now;

      updateTruckExhaust(now, dt);
      updateBirds(now, dt);
      updateDoorAnimations(now);
    }

    function updateTruckExhaust(now, dt) {
      for (let i = environmentalFX.exhaustPuffs.length - 1; i >= 0; i--) {
        const puff = environmentalFX.exhaustPuffs[i];
        puff.age += dt;
        puff.x += puff.dx * dt;
        puff.y += puff.dy * dt;
        if (puff.age >= puff.life) {
          environmentalFX.exhaustPuffs.splice(i, 1);
        }
      }

      if (currentMap.id !== "ravenford") return;

      const truck = getVisualObjectByName("ravenford", "Truck");
      if (!truck) return;

      const nearTruck = getTileDistance(truck.tileX, truck.tileY) <= 8;
      const exhaustX = truck.tileX * TILE_SIZE + 5;
      const exhaustY = truck.tileY * TILE_SIZE + 20;
      if (!nearTruck || !isWorldPointVisible(exhaustX, exhaustY, 64)) return;
      if (now - environmentalFX.lastExhaustAt < 720) return;
      if (environmentalFX.exhaustPuffs.length >= 8) return;

      environmentalFX.lastExhaustAt = now;
      environmentalFX.exhaustPuffs.push({
        mapId: "ravenford",
        x: exhaustX,
        y: exhaustY,
        age: 0,
        life: 1250,
        size: 4 + Math.random() * 3,
        dx: -0.010 - Math.random() * 0.010,
        dy: -0.006 - Math.random() * 0.012
      });
    }

    function updateBirds(now, dt) {
      for (let i = environmentalFX.birds.length - 1; i >= 0; i--) {
        const bird = environmentalFX.birds[i];
        bird.age += dt;
        bird.x += bird.dx * dt;
        bird.y = bird.baseY + Math.sin((bird.age + bird.seed) / 260) * 5;

        if (bird.age >= bird.life || !isWorldPointVisible(bird.x, bird.y, 160)) {
          environmentalFX.birds.splice(i, 1);
        }
      }

      if (now - environmentalFX.lastBirdAt < environmentalFX.nextBirdDelay) return;
      if (environmentalFX.birds.length >= 3) return;

      environmentalFX.lastBirdAt = now;
      environmentalFX.nextBirdDelay = 5200 + Math.random() * 5200;
      spawnBird(now);
    }

    function spawnBird(now) {
      const direction = Math.random() < 0.5 ? 1 : -1;
      const startX = camera.x + (direction > 0 ? -34 : canvas.width + 34);
      const baseY = camera.y + 42 + Math.random() * 120;
      const speed = direction * (0.030 + Math.random() * 0.026);
      const travelDistance = canvas.width + 110;
      const life = travelDistance / Math.max(0.01, Math.abs(speed));

      environmentalFX.birds.push({
        mapId: currentMap.id,
        x: startX,
        y: baseY,
        baseY,
        dx: speed,
        age: 0,
        life,
        seed: now + Math.random() * 500,
        direction
      });
    }

    function updateDoorAnimations(now) {
      for (let i = environmentalFX.doorAnimations.length - 1; i >= 0; i--) {
        const door = environmentalFX.doorAnimations[i];
        if (now - door.startedAt > door.duration) {
          environmentalFX.doorAnimations.splice(i, 1);
        }
      }
    }

    function findNearbyDoorTile() {
      const playerTileX = getPlayerTileX();
      const playerTileY = getPlayerTileY();

      for (let radius = 0; radius <= 1; radius++) {
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            if (Math.abs(dx) + Math.abs(dy) > 1) continue;
            const tileX = playerTileX + dx;
            const tileY = playerTileY + dy;
            if (tileY < 0 || tileY >= gameMap.length || tileX < 0 || tileX >= gameMap[0].length) continue;
            if (gameMap[tileY][tileX] === 5) {
              return { mapId: currentMap.id, tileX, tileY };
            }
          }
        }
      }

      return null;
    }

    function triggerNearbyDoorAnimation() {
      if (!isEnvironmentalAnimationActive()) return;
      const nearbyDoor = findNearbyDoorTile();
      if (!nearbyDoor) return;

      const now = getAnimationNow();
      const alreadyAnimating = environmentalFX.doorAnimations.some(function (door) {
        return door.mapId === nearbyDoor.mapId &&
          door.tileX === nearbyDoor.tileX &&
          door.tileY === nearbyDoor.tileY &&
          now - door.startedAt < door.duration;
      });

      if (alreadyAnimating) return;

      environmentalFX.doorAnimations.push({
        mapId: nearbyDoor.mapId,
        tileX: nearbyDoor.tileX,
        tileY: nearbyDoor.tileY,
        startedAt: now,
        duration: 720
      });

      if (environmentalFX.doorAnimations.length > 6) {
        environmentalFX.doorAnimations.shift();
      }
    }

    function drawEnvironmentalAnimations() {
      if (!isEnvironmentalAnimationActive()) return;

    function drawClouds() {
      const now = getAnimationNow();
      const mapWidth = getMapWidth();
      const wrapWidth = mapWidth + 260;

      for (const cloud of ENVIRONMENT_CLOUDS) {
        if (cloud.mapId !== currentMap.id) continue;
        const worldX = ((cloud.x + now * cloud.speed) % wrapWidth) - 130;
        const worldY = cloud.y;
        const sx = Math.floor(worldX - camera.x);
        const sy = Math.floor(worldY - camera.y);
        const scale = cloud.scale || 1;

        if (sx < -120 || sx > canvas.width + 120 || sy < -40 || sy > canvas.height + 80) continue;

        ctx.fillStyle = "rgba(248, 250, 252, 0.13)";
        ctx.fillRect(sx, sy + Math.floor(8 * scale), Math.floor(42 * scale), Math.floor(8 * scale));
        ctx.fillRect(sx + Math.floor(9 * scale), sy + Math.floor(3 * scale), Math.floor(18 * scale), Math.floor(8 * scale));
        ctx.fillRect(sx + Math.floor(27 * scale), sy + Math.floor(5 * scale), Math.floor(20 * scale), Math.floor(7 * scale));
        ctx.fillStyle = "rgba(203, 213, 225, 0.08)";
        ctx.fillRect(sx + Math.floor(4 * scale), sy + Math.floor(16 * scale), Math.floor(34 * scale), Math.floor(3 * scale));
      }
    }

    function drawBirds() {
      const now = getAnimationNow();
      for (const bird of environmentalFX.birds) {
        if (bird.mapId !== currentMap.id) continue;
        const sx = Math.floor(bird.x - camera.x);
        const sy = Math.floor(bird.y - camera.y);
        const wingUp = Math.floor((now + bird.seed) / 170) % 2 === 0;
        const flip = bird.direction > 0 ? 1 : -1;

        if (sx < -24 || sx > canvas.width + 24 || sy < -24 || sy > canvas.height + 24) continue;

        ctx.fillStyle = "rgba(23, 32, 42, 0.62)";
        ctx.fillRect(sx, sy, 3, 2);
        if (wingUp) {
          ctx.fillRect(sx - 4 * flip, sy - 3, 4, 2);
          ctx.fillRect(sx + 3 * flip, sy - 2, 4, 2);
        } else {
          ctx.fillRect(sx - 4 * flip, sy + 2, 4, 2);
          ctx.fillRect(sx + 3 * flip, sy + 1, 4, 2);
        }
      }
    }

    function drawExhaustPuffs() {
      for (const puff of environmentalFX.exhaustPuffs) {
        if (puff.mapId !== currentMap.id) continue;
        const alpha = Math.max(0, 1 - puff.age / puff.life);
        const size = Math.floor(puff.size + puff.age / 240);
        const sx = Math.floor(puff.x - camera.x);
        const sy = Math.floor(puff.y - camera.y);

        if (sx < -24 || sx > canvas.width + 24 || sy < -24 || sy > canvas.height + 24) continue;

        ctx.fillStyle = "rgba(226, 232, 240, " + (0.22 * alpha).toFixed(3) + ")";
        ctx.fillRect(sx, sy, size, size);
        ctx.fillStyle = "rgba(148, 163, 184, " + (0.12 * alpha).toFixed(3) + ")";
        ctx.fillRect(sx + Math.max(1, Math.floor(size / 2)), sy + 1, Math.max(2, size - 2), Math.max(2, size - 2));
      }
    }

    function drawConveyorBelts() {
      if (currentMap.id === "ravenford") {
        drawConveyorBeltAtTile(25.2, 21.78, 4.6, "warehouse");
      }

      if (currentMap.id === "portAzure") {
        drawConveyorBeltAtTile(16.4, 12.76, 4.7, "port");
      }
    }

    function drawConveyorBeltAtTile(tileX, tileY, tileWidth, variant) {
      const x = Math.floor(tileX * TILE_SIZE - camera.x);
      const y = Math.floor(tileY * TILE_SIZE - camera.y);
      const w = Math.floor(tileWidth * TILE_SIZE);
      const h = 18;

      if (x < -w || x > canvas.width + 20 || y < -h || y > canvas.height + 20) return;

      const now = getAnimationNow();
      const offset = Math.floor(now / 120) % 16;
      const beltColor = variant === "port" ? "rgba(31, 41, 55, 0.76)" : "rgba(45, 55, 72, 0.78)";

      ctx.fillStyle = "rgba(0, 0, 0, 0.20)";
      ctx.fillRect(x + 3, y + h - 1, w - 6, 5);
      ctx.fillStyle = beltColor;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "rgba(232, 223, 181, 0.62)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "rgba(255, 235, 112, 0.48)";
      for (let stripeX = x - 18 + offset; stripeX < x + w; stripeX += 16) {
        ctx.fillRect(Math.floor(stripeX), y + 4, 8, 3);
        ctx.fillRect(Math.floor(stripeX + 3), y + 11, 8, 3);
      }

      ctx.fillStyle = "rgba(203, 213, 225, 0.40)";
      for (let rollerX = x + 9; rollerX < x + w - 6; rollerX += 24) {
        ctx.fillRect(rollerX, y + h - 4, 8, 2);
      }
    }

    function drawDoorAnimations() {
      const now = getAnimationNow();
      for (const door of environmentalFX.doorAnimations) {
        if (door.mapId !== currentMap.id) continue;
        const progress = Math.min(1, Math.max(0, (now - door.startedAt) / door.duration));
        const openAmount = Math.sin(progress * Math.PI);
        const sx = Math.floor(door.tileX * TILE_SIZE - camera.x);
        const sy = Math.floor(door.tileY * TILE_SIZE - camera.y);

        if (sx < -TILE_SIZE || sx > canvas.width || sy < -TILE_SIZE || sy > canvas.height) continue;

        ctx.fillStyle = "rgba(10, 15, 22, 0.92)";
        ctx.fillRect(sx + 8, sy + 11, 16, 21);
        ctx.fillStyle = COLORS.door;
        ctx.fillRect(sx + 10 + Math.floor(openAmount * 8), sy + 13, Math.max(4, Math.floor(12 - openAmount * 7)), 19);
        ctx.fillStyle = "rgba(255, 235, 112, " + (0.28 * openAmount).toFixed(3) + ")";
        ctx.fillRect(sx + 9, sy + 12, 14, 3);
      }
    }

    function drawSoftLight(x, y, seed, color) {
      const now = getAnimationNow();
      const pulse = 0.50 + Math.sin(now / 820 + seed) * 0.22;
      ctx.fillStyle = "rgba(255, 235, 112, " + (0.12 + pulse * 0.10).toFixed(3) + ")";
      ctx.fillRect(Math.floor(x - 4), Math.floor(y - 3), 10, 8);
      ctx.fillStyle = color || "#ffeb70";
      ctx.globalAlpha = 0.62 + pulse * 0.22;
      ctx.fillRect(Math.floor(x), Math.floor(y), 4, 3);
      ctx.globalAlpha = 1;
    }

    function drawComputerScreen(x, y, seed) {
      const now = getAnimationNow();
      const frame = Math.floor(now / 230 + seed) % 4;
      ctx.fillStyle = "#18212f";
      ctx.fillRect(Math.floor(x), Math.floor(y), 14, 10);
      ctx.strokeStyle = "#2b2d42";
      ctx.lineWidth = 1;
      ctx.strokeRect(Math.floor(x), Math.floor(y), 14, 10);

      const alpha = 0.42 + Math.sin(now / 330 + seed) * 0.10;
      ctx.fillStyle = "rgba(143, 211, 255, " + alpha.toFixed(3) + ")";
      ctx.fillRect(Math.floor(x + 2), Math.floor(y + 2), 10, 6);

      ctx.fillStyle = frame % 2 === 0 ? "rgba(155, 226, 143, 0.66)" : "rgba(255, 235, 112, 0.58)";
      ctx.fillRect(Math.floor(x + 3 + frame), Math.floor(y + 4), 2, 1);
      ctx.fillRect(Math.floor(x + 8 - frame % 2), Math.floor(y + 6), 3, 1);
      ctx.fillStyle = "#2b2d42";
      ctx.fillRect(Math.floor(x + 6), Math.floor(y + 10), 3, 3);
      ctx.fillRect(Math.floor(x + 3), Math.floor(y + 13), 9, 1);
    }

    function drawBuildingActivityDetails(px, py, w, h, type, building) {
      if (!isEnvironmentalAnimationActive()) return;
      const seed = building ? building.tileX * 0.7 + building.tileY * 1.3 : 1;

      if (["warehouse", "market", "loading", "customs", "office", "routeHub"].includes(type)) {
        drawSoftLight(px + 11, py + 18, seed, "#ffeb70");
        drawSoftLight(px + w - 15, py + 18, seed + 1.7, type === "customs" ? "#8fd3ff" : "#ffeb70");
      }

      if (type === "office" || type === "customs" || type === "routeHub") {
        drawComputerScreen(px + Math.floor(w / 2) - 22, py + h - 18, seed + 2.2);
        drawComputerScreen(px + Math.floor(w / 2) + 8, py + h - 18, seed + 4.4);
      }

      if (type === "warehouse" || type === "loading") {
        const now = getAnimationNow();
        const blink = Math.floor(now / 900 + seed) % 3 !== 0;
        if (blink) {
          ctx.fillStyle = "rgba(155, 226, 143, 0.52)";
          ctx.fillRect(px + Math.floor(w / 2) - 3, py + 19, 6, 3);
        }
      }
    }

    function drawPixelLine(x1, y1, x2, y2, color, width = 2) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(Math.floor(x1), Math.floor(y1));
      ctx.lineTo(Math.floor(x2), Math.floor(y2));
      ctx.stroke();
    }

    function drawExclamationMark(x, y, color = "#ffeb70") {
      ctx.fillStyle = color;
      ctx.font = "bold 18px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("!", x, y);
    }

    function drawMiniWarningMark(x, y) {
      ctx.fillStyle = "#ffeb70";
      ctx.fillRect(x, y, 10, 9);
      ctx.fillStyle = "#3a1f1f";
      ctx.fillRect(x + 4, y + 2, 2, 4);
      ctx.fillRect(x + 4, y + 7, 2, 1);
    }

    function drawTinyDocument(x, y, type = "paper") {
      const fill = type === "manual" ? "#d9e6f2" : type === "report" ? "#bde7ff" : "#fffdf4";
      drawPixelRect(x, y, 14, 17, fill, "#2b2d42");
      ctx.fillStyle = "#4aa3ff";
      ctx.fillRect(x + 3, y + 4, 8, 2);
      ctx.fillStyle = "#7f8c8d";
      ctx.fillRect(x + 3, y + 8, 7, 1);
      ctx.fillRect(x + 3, y + 11, 6, 1);
      if (type === "report") {
        ctx.fillStyle = "#20a39e";
        ctx.fillRect(x + 10, y + 13, 2, 2);
      }
    }

    function drawRiceSack(x, y, scale = 1) {
      const w = Math.floor(17 * scale);
      const h = Math.floor(18 * scale);
      drawPixelRect(x, y + 2, w, h, "#ead79a", "#6b5b35");
      ctx.fillStyle = "#fff4cc";
      ctx.fillRect(x + Math.floor(3 * scale), y + Math.floor(5 * scale), Math.floor(9 * scale), Math.floor(4 * scale));
      ctx.fillStyle = "#8a743d";
      ctx.fillRect(x + Math.floor(4 * scale), y + Math.floor(12 * scale), Math.floor(2 * scale), Math.floor(2 * scale));
      ctx.fillRect(x + Math.floor(9 * scale), y + Math.floor(13 * scale), Math.floor(2 * scale), Math.floor(2 * scale));
    }

    function drawSpiceJar(x, y, color = "#e85d2a") {
      drawPixelRect(x + 2, y + 5, 14, 15, color, "#6e2f22");
      ctx.fillStyle = "#ffe0a3";
      ctx.fillRect(x + 4, y + 8, 10, 5);
      ctx.fillStyle = "#4a2f22";
      ctx.fillRect(x + 5, y + 2, 8, 4);
      ctx.fillStyle = "#ffbe55";
      ctx.fillRect(x + 5, y + 14, 7, 2);
    }

    function drawOilCarton(x, y, damaged = false) {
      const base = damaged ? "#7b4f2d" : "#f0c13b";
      drawPixelRect(x, y + 2, 16, 18, base, damaged ? "#3a1f1f" : "#7a5a12");
      ctx.fillStyle = damaged ? "#332017" : "#fff0a6";
      ctx.fillRect(x + 3, y + 6, 10, 5);
      ctx.fillStyle = damaged ? "#ff7777" : "#9b7a13";
      ctx.fillRect(x + 6, y + 12, 4, 5);
      if (damaged) {
        drawMiniWarningMark(x + 8, y);
        ctx.fillStyle = "#2b1b14";
        ctx.fillRect(x + 2, y + 15, 12, 3);
      }
    }

    function drawProductIcon(kind, x, y) {
      if (kind === "rice") {
        drawRiceSack(x + 1, y, 0.82);
      } else if (kind === "spice") {
        drawSpiceJar(x + 1, y, "#df4a25");
      } else if (kind === "oil") {
        drawOilCarton(x + 1, y, false);
      } else if (kind === "damaged") {
        drawOilCarton(x + 1, y, true);
      } else if (kind === "document") {
        drawTinyDocument(x + 2, y + 1, "paper");
      }
    }

    function getObjectVisualKind(object) {
      const name = object.name;
      if (name.includes("Rice")) return "riceShelf";
      if (name.includes("Spice")) return "spiceShelf";
      if (name.includes("Picking List")) return "pickingTable";
      if (name.includes("Truck")) return "truck";
      if (name.includes("Container")) return "container";
      if (name.includes("Damaged Goods")) return "damagedPallet";
      if (name.includes("Cargo Release")) return "releaseDesk";
      if (name.includes("Route Planning")) return "routeBoard";
      if (name.includes("Product Handling Manual")) return "manual";
      if (name.includes("Customer Order Sheet")) return "orderSheet";
      if (name.includes("Warehouse Safety Notice")) return "safetyNotice";
      if (name.includes("Cargo Condition Report")) return "cargoReport";
      if (name.includes("Road to Port Azure")) return "roadSign";
      if (name.includes("Sign")) return "roadSign";
      if (name.includes("Box")) return "plainBox";
      return "genericObject";
    }

    function drawWarehouseBuilding(screenX, screenY, tileW, tileH, type, building = null) {
      const px = Math.floor(screenX);
      const py = Math.floor(screenY);
      const w = tileW * TILE_SIZE;
      const h = tileH * TILE_SIZE;

      const palette = {
        warehouse: { wall: "#78838d", roof: "#9b4d3f", roofDark: "#6e3028", trim: "#e8dfb5" },
        office: { wall: "#8ca6b8", roof: "#355070", roofDark: "#1f334d", trim: "#d9e6f2" },
        customs: { wall: "#596d86", roof: "#1f3a5f", roofDark: "#12243a", trim: "#8fd3ff" },
        market: { wall: "#c7904a", roof: "#bf3434", roofDark: "#7a2222", trim: "#ffeb70" },
        loading: { wall: "#6f777d", roof: "#d06b2b", roofDark: "#8e3d17", trim: "#ffcf5f" },
        routeHub: { wall: "#6a5c8a", roof: "#45315f", roofDark: "#2d1f40", trim: "#ffeb70" }
      }[type] || { wall: COLORS.wall, roof: COLORS.roof, roofDark: COLORS.roofDark, trim: COLORS.cream };

      ctx.fillStyle = palette.wall;
      ctx.fillRect(px, py + 10, w, h - 8);
      ctx.fillStyle = palette.roof;
      ctx.fillRect(px - 3, py, w + 6, 16);
      ctx.fillStyle = palette.roofDark;
      ctx.fillRect(px - 3, py + 12, w + 6, 4);
      ctx.strokeStyle = COLORS.outline;
      ctx.lineWidth = 2;
      ctx.strokeRect(px, py + 10, w, h - 8);

      if (type === "warehouse") {
        ctx.fillStyle = "#43505a";
        ctx.fillRect(px + w / 2 - 18, py + 26, 36, h - 24);
        ctx.fillStyle = "#9aa7b0";
        for (let i = 0; i < 4; i++) ctx.fillRect(px + w / 2 - 15, py + 31 + i * 8, 30, 2);
        ctx.fillStyle = palette.trim;
        ctx.fillRect(px + 10, py + 22, 22, 12);
        ctx.fillRect(px + w - 32, py + 22, 22, 12);
      } else if (type === "office" || type === "customs") {
        ctx.fillStyle = "#d9f1ff";
        ctx.fillRect(px + 14, py + 22, 18, 12);
        ctx.fillRect(px + w - 32, py + 22, 18, 12);
        ctx.fillStyle = type === "customs" ? "#10243d" : "#4a2f22";
        ctx.fillRect(px + w / 2 - 8, py + h - 20, 16, 20);
        if (type === "customs") {
          ctx.fillStyle = "#8fd3ff";
          ctx.fillRect(px + w / 2 - 3, py + h - 11, 3, 3);
        }
      } else if (type === "market") {
        ctx.fillStyle = "#ffeb70";
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(px + 8 + i * 21, py + 16, 12, 9);
        }
        drawSpiceJar(px + 11, py + h - 25, "#df4a25");
        drawRiceSack(px + 34, py + h - 25, 0.7);
        drawOilCarton(px + 58, py + h - 25, false);
      } else if (type === "loading") {
        ctx.fillStyle = "#343d46";
        ctx.fillRect(px + 12, py + 25, w - 24, h - 26);
        ctx.fillStyle = "#ffcf5f";
        ctx.fillRect(px + 16, py + 28, w - 32, 3);
        drawProductIcon("rice", px + 22, py + h - 24);
        drawProductIcon("oil", px + 49, py + h - 24);
      } else if (type === "routeHub") {
        ctx.fillStyle = "#ffeb70";
        ctx.fillRect(px + w / 2 - 2, py + 20, 4, 22);
        ctx.fillRect(px + w / 2 - 12, py + 25, 24, 4);
        ctx.fillStyle = "#d9f1ff";
        ctx.fillRect(px + 12, py + h - 22, 18, 12);
        ctx.fillRect(px + w - 30, py + h - 22, 18, 12);
      }

      drawBuildingActivityDetails(px, py, w, h, type, building);
    }

      ctx.fillRect(screenX + 20, screenY + 23, 3, 7);

    function drawDecorativeLoadingMarkings(screenX, screenY, width = 4, variant = 0) {
      const color = variant === 1 ? "rgba(248,250,252,0.28)" : "rgba(255,235,112,0.30)";

      for (let i = 0; i < width; i++) {
        const x = screenX + i * TILE_SIZE;
        ctx.fillRect(x + 5, screenY + 7, 22, 2);
        ctx.fillRect(x + 5, screenY + 21, 22, 2);
        if (i % 2 === 0) ctx.fillRect(x + 14, screenY + 11, 4, 8);
      }
    }

      ctx.fillStyle = "rgba(203,213,225,0.40)";
      for (let x = screenX + 10; x < screenX + w; x += 18) {

    function drawDecorativeGatePost(screenX, screenY, variant = 0) {

      ctx.fillRect(screenX + 12, screenY + 7, 5, 3);
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillRect(screenX + 19, screenY + 8, 5, 18);

      for (let i = 0; i < width * 3; i++) {
        drawTinyFlower(screenX + 8 + i * 9, screenY + 14 + (i % 2), colors[i % colors.length]);

    }

    function drawDecorativePathEdging(screenX, screenY, width = 4, variant = 0) {
      for (let i = 0; i < width; i++) {

        ctx.fillStyle = "rgba(255,244,204,0.32)";
        ctx.fillRect(x + 3, screenY + 27, 8, 2);
        ctx.fillRect(x + 20, screenY + 27, 7, 2);

    function drawDecorativeMailbox(screenX, screenY, variant = 0) {
      ctx.fillStyle = "#7a4a23";
      ctx.fillRect(screenX + 15, screenY + 17, 3, 12);
      drawPixelRect(screenX + 9, screenY + 10, 16, 9, variant === 1 ? "#4aa3ff" : "#d9e6f2", "#2b2d42");

      ctx.fillRect(screenX + 22, screenY + 7, 3, 7);
      ctx.fillStyle = "#2b2d42";
      ctx.fillRect(screenX + 12, screenY + 14, 8, 1);

    function drawDecorativeWindowGlow(screenX, screenY, variant = 0) {
      const alpha = isEnvironmentalAnimationActive()
        ? 0.28 + Math.sin(getAnimationNow() / 600 + variant) * 0.08
        : 0.25;
      ctx.fillStyle = "rgba(143,211,255," + alpha.toFixed(3) + ")";
      ctx.fillRect(screenX + 13, screenY + 18, 19, 11);
      ctx.fillRect(screenX + 62, screenY + 18, 19, 11);
      ctx.fillStyle = "rgba(255,235,112," + (alpha * 0.7).toFixed(3) + ")";
      ctx.fillRect(screenX + 17, screenY + 21, 5, 2);
      ctx.fillRect(screenX + 66, screenY + 23, 6, 2);

    function drawDecorativeMarketStall(screenX, screenY, variant = 0) {
      drawPixelRect(screenX + 3, screenY + 13, 26, 15, "#9b6b3d", "#2b2d42");
      const colors = variant === 1 ? ["#4aa3ff", "#fff4cc"] : ["#ff7777", "#fff4cc"];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = colors[i % 2];
        ctx.fillRect(screenX + 3 + i * 7, screenY + 7, 7, 7);

        ctx.fillStyle = "rgba(255,255,255,0.14)";
        ctx.fillRect(x + 2, y + 2, 7, 1);

      basket(screenX + 5, screenY + 18, "#b98545");

    function drawDecorativeMilestone(screenX, screenY, text = "5km") {

    function drawDecorativeTireTracks(screenX, screenY, width = 3, variant = 0) {

      ctx.fillRect(screenX + 6, screenY + 5, 3, 24);

      ctx.moveTo(screenX + 7, screenY + 8);

    function drawDecorativeReeds(screenX, screenY, width = 1, variant = 0) {
      for (let i = 0; i < width * 4; i++) {
        const x = screenX + 4 + i * 7;
        const y = screenY + 17 + (i % 2) * 3;
        ctx.fillStyle = "#3f7d3a";

    function drawDecorativeLilyPads(screenX, screenY, variant = 0) {
      const pads = [
        [7, 12, 10, 6],
        [18, 18, 8, 5],
        [14, 7, 7, 5]
      ];
      for (let i = 0; i < pads.length; i++) {
        const p = pads[i];
        ctx.fillStyle = i === variant % 3 ? "#65ad57" : "#4f9d57";
        ctx.fillRect(screenX + p[0], screenY + p[1], p[2], p[3]);
        ctx.fillStyle = "#ff9fcb";

      }
    }

    function drawDecorativeDuckPair(screenX, screenY, variant = 0) {
      const duck = function (x, y, flip) {
        ctx.fillStyle = "#f8e16c";
        ctx.fillRect(x, y + 4, 12, 7);
        ctx.fillRect(x + (flip ? -3 : 9), y + 1, 6, 6);
        ctx.fillStyle = "#ff9f43";
        ctx.fillRect(x + (flip ? -6 : 15), y + 4, 4, 2);
        ctx.fillStyle = "#17202a";
        ctx.fillRect(x + (flip ? 0 : 13), y + 3, 1, 1);
      };
      duck(screenX + 6, screenY + 10, false);
      duck(screenX + 18, screenY + 17, true);
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(screenX + 5, screenY + 23, 18, 2);
    }

    function drawDecorativeFloatingLeaves(screenX, screenY, variant = 0) {
      const colors = ["#65ad57", "#8fbc62", "#d9c987"];
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = colors[i % colors.length];
        ctx.fillRect(screenX + 5 + i * 5, screenY + 7 + (i % 3) * 6, 4, 2);
      }
    }

    function drawDecorativeRopePost(screenX, screenY, variant = 0) {
      drawPixelRect(screenX + 12, screenY + 9, 8, 19, "#6d4c2f", "#2b2d42");
      ctx.strokeStyle = "#d8bc86";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(screenX + 15, screenY + 14);
      ctx.bezierCurveTo(screenX + 23, screenY + 20, screenX + 29, screenY + 13, screenX + 34, screenY + 18);
      ctx.stroke();
    }

    function drawDecorativeMooringPole(screenX, screenY, variant = 0) {
      drawPixelRect(screenX + 11, screenY + 6, 11, 22, "#5d4632", "#2b2d42");
      ctx.fillStyle = "#8b6b4a";
      ctx.fillRect(screenX + 9, screenY + 4, 15, 4);
      ctx.strokeStyle = "#d8bc86";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(screenX + 16, screenY + 17, 8, 0, Math.PI * 1.5);
      ctx.stroke();
    }

    function drawDecorativeCargoNet(screenX, screenY, variant = 0) {
      ctx.strokeStyle = "rgba(216,188,134,0.70)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(screenX + 5 + i * 5, screenY + 9);
        ctx.lineTo(screenX + 11 + i * 5, screenY + 26);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(screenX + 8, screenY + 9 + i * 4);
        ctx.lineTo(screenX + 28, screenY + 9 + i * 4);
        ctx.stroke();
      }
      ctx.strokeStyle = "#6d4c2f";
      ctx.strokeRect(screenX + 6, screenY + 8, 24, 19);
    }

    function drawDecorativeLifebuoy(screenX, screenY, variant = 0) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(screenX + 9, screenY + 9, 16, 16);
      ctx.fillStyle = "#ff595e";
      ctx.fillRect(screenX + 10, screenY + 9, 4, 16);
      ctx.fillRect(screenX + 20, screenY + 9, 4, 16);
      ctx.fillRect(screenX + 9, screenY + 10, 16, 4);
      ctx.fillRect(screenX + 9, screenY + 20, 16, 4);
      ctx.fillStyle = "#2f70aa";
      ctx.fillRect(screenX + 14, screenY + 14, 7, 7);
    }

    function drawDecorativeWarningSign(screenX, screenY, text = "LOAD") {
      ctx.fillStyle = "#6d4c2f";
      ctx.fillRect(screenX + 15, screenY + 16, 3, 13);
      drawPixelRect(screenX + 5, screenY + 6, 24, 11, "#ffeb70", "#2b2d42");
      ctx.fillStyle = "#2b2d42";
      ctx.font = "bold 7px Courier New";
      ctx.textAlign = "center";
      ctx.fillText(String(text).slice(0, 5), screenX + 17, screenY + 14);
    }


    function drawMapDecoration(decoration) {
      if (decoration.mapId !== currentMap.id) return;

      const screenX = Math.floor(decoration.tileX * TILE_SIZE - camera.x);
      const screenY = Math.floor(decoration.tileY * TILE_SIZE - camera.y);
      const width = decoration.width || 1;
      const height = decoration.height || 1;

      if (screenX < -width * TILE_SIZE - 48 || screenX > canvas.width + 48 || screenY < -height * TILE_SIZE - 48 || screenY > canvas.height + 48) {
        return;
      }

      if (decoration.kind === "flowerPatch") drawDecorativeFlowerPatch(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "gardenPatch") drawDecorativeGardenPatch(screenX, screenY, width, height, decoration.variant || 0);
      else if (decoration.kind === "bushCluster") drawDecorativeBushCluster(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "fenceH") drawDecorativeFenceH(screenX, screenY, width);
      else if (decoration.kind === "fenceV") drawDecorativeFenceV(screenX, screenY, height);
      else if (decoration.kind === "bench") drawDecorativeBench(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "lampPost") drawDecorativeLampPost(screenX, screenY);
      else if (decoration.kind === "signBoard") drawDecorativeSignBoard(screenX, screenY, decoration.text || "INFO");
      else if (decoration.kind === "smallTree") drawDecorativeSmallTree(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "crateStack") drawDecorativeCrateStack(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "palletStack") drawDecorativePalletStack(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "bannerLine") drawDecorativeBannerLine(screenX, screenY, width);
      else if (decoration.kind === "roadEdge") drawDecorativeRoadEdge(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "dockPosts") drawDecorativeDockPosts(screenX, screenY, width);
      else if (decoration.kind === "dockRope") drawDecorativeDockRope(screenX, screenY, width);
      else if (decoration.kind === "waterEdge") drawDecorativeWaterEdge(screenX, screenY, width, height, Boolean(decoration.vertical));
      else if (decoration.kind === "barrelStack") drawDecorativeBarrelStack(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "cargoStack") drawDecorativeCargoStack(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "containerMark") drawDecorativeContainerMark(screenX, screenY, width);
      else if (decoration.kind === "portFenceH") drawDecorativePortFenceH(screenX, screenY, width);
      else if (decoration.kind === "portFenceV") drawDecorativePortFenceV(screenX, screenY, height);
      else if (decoration.kind === "pottedPlant") drawDecorativePottedPlant(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "dockSign") drawDecorativeDockSign(screenX, screenY, decoration.text || "DOCK");
      else if (decoration.kind === "seagullMark") drawDecorativeSeagullMark(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "groundStripe") drawDecorativeGroundStripe(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "handTruck") drawDecorativeHandTruck(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "cautionStripes") drawDecorativeCautionStripes(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "noticeBoard") drawDecorativeNoticeBoard(screenX, screenY, decoration.text || "NOTICE");
      else if (decoration.kind === "loadingMarkings") drawDecorativeLoadingMarkings(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "conveyorDetail") drawDecorativeConveyorDetail(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "gatePost") drawDecorativeGatePost(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "flowerBedLine") drawDecorativeFlowerBedLine(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "pathEdging") drawDecorativePathEdging(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "mailbox") drawDecorativeMailbox(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "windowGlow") drawDecorativeWindowGlow(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "marketStall") drawDecorativeMarketStall(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "basketStack") drawDecorativeBasketStack(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "lanternPost") drawDecorativeLanternPost(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "roadSign") drawDecorativeRoadSign(screenX, screenY, decoration.text || "PORT");
      else if (decoration.kind === "milestone") drawDecorativeMilestone(screenX, screenY, decoration.text || "5km");
      else if (decoration.kind === "tireTracks") drawDecorativeTireTracks(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "checkpointBanner") drawDecorativeCheckpointBanner(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "reeds") drawDecorativeReeds(screenX, screenY, width, decoration.variant || 0);
      else if (decoration.kind === "lilyPads") drawDecorativeLilyPads(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "duckPair") drawDecorativeDuckPair(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "floatingLeaves") drawDecorativeFloatingLeaves(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "ropePost") drawDecorativeRopePost(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "mooringPole") drawDecorativeMooringPole(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "cargoNet") drawDecorativeCargoNet(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "lifebuoy") drawDecorativeLifebuoy(screenX, screenY, decoration.variant || 0);
      else if (decoration.kind === "warningSign") drawDecorativeWarningSign(screenX, screenY, decoration.text || "LOAD");
    }

    function drawDecorativeSceneryLayer() {
      for (const decoration of MAP_DECORATIONS) {
        drawMapDecoration(decoration);
      }
    }

    function drawBuildingOverlays() {
      for (const building of BUILDING_VISUALS) {
        if (building.mapId !== currentMap.id) continue;
        const screenX = building.tileX * TILE_SIZE - camera.x;
        const screenY = building.tileY * TILE_SIZE - camera.y;
        if (screenX < -building.width * TILE_SIZE || screenX > canvas.width + TILE_SIZE || screenY < -building.height * TILE_SIZE || screenY > canvas.height + TILE_SIZE) {
          continue;
        }
        drawWarehouseBuilding(screenX, screenY, building.width, building.height, building.type, building);
      }

      if (currentMap.id === "portAzure") {
        // Visual-only dock/readability layer drawn over existing walkable dock tiles.
        const dockX = 8 * TILE_SIZE - camera.x;
        const dockY = 24 * TILE_SIZE - camera.y;
        ctx.fillStyle = "rgba(86, 96, 107, 0.55)";
        ctx.fillRect(dockX, dockY, 21 * TILE_SIZE, 2 * TILE_SIZE);
        ctx.strokeStyle = "rgba(255, 235, 112, 0.55)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(dockX + 12, dockY + 31);
        ctx.lineTo(dockX + 21 * TILE_SIZE - 12, dockY + 31);
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 4; i++) {
          drawPixelRect(dockX + 28 + i * 52, dockY + 10, 22, 18, "#9b6b3d", "#4a2f22");
        }
      }
    }

    function drawTile(tile, screenX, screenY, row, col) {
      if (tile === 0) {
        if (currentMap.id === "festivalGrounds") {
          ctx.fillStyle = "#83bd64";
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "#9fd36d";
          if ((row + col) % 4 === 0) ctx.fillRect(screenX + 6, screenY + 8, 5, 2);
          if ((row * 2 + col) % 5 === 0) ctx.fillRect(screenX + 22, screenY + 22, 4, 2);
          ctx.fillStyle = "rgba(255, 235, 112, 0.35)";
          if ((row + col * 2) % 9 === 0) ctx.fillRect(screenX + 14, screenY + 13, 3, 3);
        } else if (currentMap.id === "portAzure") {
          ctx.fillStyle = "#cdbb82";
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "#b8a76f";
          if ((row + col) % 2 === 0) {
            ctx.fillRect(screenX + 4, screenY + 7, 9, 2);
            ctx.fillRect(screenX + 19, screenY + 21, 7, 2);
          }
          ctx.fillStyle = "rgba(86, 96, 107, 0.32)";
          ctx.fillRect(screenX, screenY + 30, TILE_SIZE, 2);
          if ((row * 3 + col) % 8 === 0) {
            ctx.fillStyle = "rgba(255, 244, 204, 0.22)";
            ctx.fillRect(screenX + 6, screenY + 12, 12, 2);
          }
          if ((row + col * 5) % 14 === 0) {
            ctx.fillStyle = "rgba(75, 86, 97, 0.28)";
            ctx.fillRect(screenX + 20, screenY + 6, 5, 4);
          }
        } else {
          ctx.fillStyle = COLORS.grass;
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = COLORS.grassLight;
          if ((row + col) % 4 === 0) ctx.fillRect(screenX + 6, screenY + 8, 5, 2);
          if ((row * 2 + col) % 5 === 0) ctx.fillRect(screenX + 22, screenY + 22, 4, 2);
          ctx.fillStyle = COLORS.grassDark;
          if ((row + col) % 3 === 0) {
            ctx.fillRect(screenX + 9, screenY + 19, 2, 4);
            ctx.fillRect(screenX + 20, screenY + 10, 2, 3);
          }
          // Extra non-interactive village texture: clover dots, tiny stones, and soft dirt flecks.
          if ((row * 7 + col * 3) % 11 === 0) {
            ctx.fillStyle = "#b7d77a";
            ctx.fillRect(screenX + 14, screenY + 6, 2, 2);
            ctx.fillRect(screenX + 17, screenY + 7, 2, 2);
          }
          if ((row * 5 + col) % 13 === 0) {
            ctx.fillStyle = "rgba(104, 78, 42, 0.24)";
            ctx.fillRect(screenX + 5, screenY + 25, 5, 2);
          }
          if ((row + col * 2) % 17 === 0) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
            ctx.fillRect(screenX + 24, screenY + 6, 2, 2);
          }
        }
      } else if (tile === 1) {
        if (currentMap.id === "festivalGrounds") {
          ctx.fillStyle = "#d9b66f";
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "#ba8f52";
          ctx.fillRect(screenX, screenY + 28, TILE_SIZE, 4);
          ctx.fillStyle = "rgba(255,244,204,0.30)";
          if ((row + col) % 3 === 0) ctx.fillRect(screenX + 9, screenY + 14, 13, 2);
        } else if (currentMap.id === "portAzure") {
          ctx.fillStyle = "#76818a";
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "#606b74";
          ctx.fillRect(screenX, screenY + 28, TILE_SIZE, 4);
          ctx.fillStyle = "rgba(255, 235, 112, 0.36)";
          if (row % 2 === 0) ctx.fillRect(screenX + 13, screenY + 4, 4, 20);
          ctx.fillStyle = "#8d99a4";
          if ((row + col) % 2 === 0) ctx.fillRect(screenX + 4, screenY + 9, 8, 3);
        } else {
          ctx.fillStyle = COLORS.path;
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = COLORS.pathDark;
          ctx.fillRect(screenX, screenY + 28, TILE_SIZE, 4);
          ctx.fillStyle = "#e7ca82";
          if ((row + col) % 2 === 0) {
            ctx.fillRect(screenX + 5, screenY + 8, 5, 3);
            ctx.fillRect(screenX + 20, screenY + 19, 7, 3);
          }
          ctx.fillStyle = "rgba(114, 87, 48, 0.24)";
          if ((row * 2 + col) % 5 === 0) ctx.fillRect(screenX + 2, screenY + 4, 3, 24);
          if ((row + col * 3) % 7 === 0) ctx.fillRect(screenX + 27, screenY + 6, 3, 20);
          ctx.fillStyle = "rgba(255,244,204,0.24)";
          if ((row + col) % 3 === 0) ctx.fillRect(screenX + 10, screenY + 15, 12, 2);
        }
      } else if (tile === 2) {
        // Base building tile. A richer role-specific building overlay is drawn after the map.
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(screenX, screenY + 7, TILE_SIZE, 25);
        ctx.fillStyle = COLORS.wallDark;
        ctx.fillRect(screenX, screenY + 25, TILE_SIZE, 7);
        ctx.fillStyle = COLORS.roof;
        ctx.fillRect(screenX - 1, screenY, TILE_SIZE + 2, 11);
        ctx.fillStyle = COLORS.roofDark;
        ctx.fillRect(screenX - 1, screenY + 8, TILE_SIZE + 2, 3);
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 2;
        ctx.strokeRect(screenX, screenY + 7, TILE_SIZE, 25);
      } else if (tile === 3) {
        ctx.fillStyle = currentMap.id === "portAzure" ? "#4f8b54" : COLORS.grass;
        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        const treeVariant = Math.abs(row * 3 + col * 5) % 3;
        ctx.fillStyle = "rgba(0,0,0,0.16)";
        ctx.fillRect(screenX + 6, screenY + 27, 21, 4);
        ctx.fillStyle = "#7b4f28";
        ctx.fillRect(screenX + 13, screenY + 18, 6, 11);

        if (treeVariant === 0) {
          ctx.fillStyle = COLORS.treeDark;
          ctx.fillRect(screenX + 7, screenY + 10, 18, 13);
          ctx.fillStyle = COLORS.tree;
          ctx.fillRect(screenX + 8, screenY + 5, 16, 16);
          ctx.fillRect(screenX + 5, screenY + 12, 22, 9);
          ctx.fillStyle = "#3f9c4e";
          ctx.fillRect(screenX + 11, screenY + 2, 10, 9);
          ctx.strokeStyle = COLORS.outline;
          ctx.lineWidth = 2;
          ctx.strokeRect(screenX + 8, screenY + 5, 16, 16);
        } else if (treeVariant === 1) {
          ctx.fillStyle = "#1f5c2a";
          ctx.fillRect(screenX + 11, screenY + 3, 10, 8);
          ctx.fillRect(screenX + 8, screenY + 10, 16, 8);
          ctx.fillRect(screenX + 5, screenY + 17, 22, 7);
          ctx.fillStyle = "#4ba34d";
          ctx.fillRect(screenX + 12, screenY + 6, 8, 5);
          ctx.fillRect(screenX + 10, screenY + 13, 11, 4);
        } else {
          ctx.fillStyle = currentMap.id === "portAzure" ? "#6fbf7b" : "#4f9d57";
          ctx.fillRect(screenX + 7, screenY + 6, 18, 16);
          ctx.fillStyle = currentMap.id === "portAzure" ? "#e7f6ff" : "#f4a3c3";
          ctx.fillRect(screenX + 10, screenY + 8, 2, 2);
          ctx.fillRect(screenX + 20, screenY + 12, 2, 2);
          ctx.fillStyle = "#2f7d3a";
          ctx.fillRect(screenX + 9, screenY + 14, 15, 7);
        }
      } else if (tile === 4) {
        const waterFrame = gameState === "playing" ? Math.floor(getAnimationNow() / 260) : 0;
        const waveOffset = (row + col + waterFrame) % 4;
        ctx.fillStyle = currentMap.id === "portAzure" ? "#3f8dcc" : COLORS.water;
        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = currentMap.id === "portAzure" ? "#276aa4" : COLORS.waterDark;
        ctx.fillRect(screenX, screenY + 28, TILE_SIZE, 4);
        ctx.fillStyle = "rgba(125, 198, 242, 0.68)";
        ctx.fillRect(screenX + 4 + waveOffset, screenY + 7, 9, 2);
        ctx.fillRect(screenX + 17 - waveOffset, screenY + 19, 8, 2);
        if ((row + col + waterFrame) % 3 === 0) {
          ctx.fillStyle = "rgba(248, 250, 252, 0.25)";
          ctx.fillRect(screenX + 11 + (waterFrame % 3), screenY + 13, 7, 1);
        }
      } else if (tile === 5) {
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(screenX, screenY + 7, TILE_SIZE, 25);
        ctx.fillStyle = COLORS.roof;
        ctx.fillRect(screenX - 1, screenY, TILE_SIZE + 2, 10);
        ctx.fillStyle = "#4a2f22";
        ctx.fillRect(screenX + 8, screenY + 11, 16, 21);
        ctx.fillStyle = COLORS.door;
        ctx.fillRect(screenX + 10, screenY + 13, 12, 19);
        ctx.fillStyle = "#d2a55f";
        ctx.fillRect(screenX + 19, screenY + 22, 3, 3);
        ctx.strokeStyle = COLORS.outline;
        ctx.lineWidth = 2;
        ctx.strokeRect(screenX + 8, screenY + 11, 16, 21);
        ctx.fillStyle = "#ffeb70";
        ctx.fillRect(screenX + 10, screenY + 8, 12, 2);
      } else if (tile === 6) {
        ctx.fillStyle = "#252525";
        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "#5a2a2a";
        ctx.fillRect(screenX, screenY + 10, TILE_SIZE, 12);
        ctx.strokeStyle = "#ff6b6b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(screenX + 6, screenY + 6);
        ctx.lineTo(screenX + 26, screenY + 26);
        ctx.moveTo(screenX + 26, screenY + 6);
        ctx.lineTo(screenX + 6, screenY + 26);
        ctx.stroke();
      }
    }

    function drawBuildingLabels() {
      for (const label of buildingLabels) {
        if (label.mapId !== currentMap.id) continue;

        const screenX = label.tileX * TILE_SIZE - camera.x + TILE_SIZE / 2;
        const screenY = label.tileY * TILE_SIZE - camera.y;

        if (screenX < -80 || screenX > canvas.width + 80 || screenY < -30 || screenY > canvas.height + 30) {
          continue;
        }

        drawSmallLabel(label.text, screenX, screenY, Math.max(78, label.text.length * 8 + 14));
      }
    }

    function drawUIPanel(x, y, w, h, title = "") {
      ctx.fillStyle = "rgba(18, 26, 38, 0.95)";
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = COLORS.cream;
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      ctx.strokeStyle = COLORS.uiMid;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);

      if (title) {
        ctx.fillStyle = COLORS.cream;
        ctx.font = "16px Courier New";
        ctx.textAlign = "left";
        ctx.fillText(title, x + 16, y + 24);
      }
    }

    // ===============================
    // DRAWING: MAP
    // ===============================

    function getTileColor(tile) {
      if (tile === 0) return currentMap.id === "portAzure" ? "#d7c48a" : COLORS.grass;
      if (tile === 1) return COLORS.path;
      if (tile === 2) return COLORS.wall;
      if (tile === 3) return COLORS.tree;
      if (tile === 4) return COLORS.water;
      if (tile === 5) return COLORS.door;
      if (tile === 6) return "#222222";
      return "#000000";
    }


    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const startCol = Math.floor(camera.x / TILE_SIZE);
      const endCol = Math.ceil((camera.x + canvas.width) / TILE_SIZE);
      const startRow = Math.floor(camera.y / TILE_SIZE);
      const endRow = Math.ceil((camera.y + canvas.height) / TILE_SIZE);

      for (let row = startRow; row < endRow; row++) {
        for (let col = startCol; col < endCol; col++) {
          if (row < 0 || row >= gameMap.length || col < 0 || col >= gameMap[0].length) {
            continue;
          }

          const tile = gameMap[row][col];
          const screenX = Math.floor(col * TILE_SIZE - camera.x);
          const screenY = Math.floor(row * TILE_SIZE - camera.y);

          drawTile(tile, screenX, screenY, row, col);

          ctx.strokeStyle = "rgba(31, 41, 55, 0.10)";
          ctx.lineWidth = 1;
          ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }
      }

      drawBuildingOverlays();
      drawDecorativeSceneryLayer();
      drawBuildingLabels();
    }


    // ===============================
    // DRAWING: ENTITIES
    // ===============================

    function drawInteractiveObjects() {
      for (const object of interactiveObjects) {
        if (object.mapId !== currentMap.id) continue;

        const screenX = Math.floor(object.tileX * TILE_SIZE - camera.x);
        const screenY = Math.floor(object.tileY * TILE_SIZE - camera.y);

        if (screenX < -TILE_SIZE || screenX > canvas.width || screenY < -TILE_SIZE || screenY > canvas.height) {
          continue;
        }

        const isTarget = isCurrentTarget(object.name);
        const baseColor = object.name === "Road to Port Azure" && ravenford.portRoadUnlocked
          ? "#4aa3ff"
          : object.color;
        const kind = getObjectVisualKind(object);

        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.fillRect(screenX + 6, screenY + 26, 22, 5);

        if (kind === "riceShelf") {
          drawPixelRect(screenX + 3, screenY + 7, 26, 20, "#8b5a2b", "#4a2f22");
          ctx.fillStyle = "#5e3c1d";
          ctx.fillRect(screenX + 5, screenY + 16, 22, 2);
          drawRiceSack(screenX + 7, screenY + 9, 0.68);
          drawRiceSack(screenX + 17, screenY + 16, 0.58);
          ctx.fillStyle = "#fff4cc";
          ctx.fillRect(screenX + 5, screenY + 5, 18, 3);
        } else if (kind === "spiceShelf") {
          drawPixelRect(screenX + 3, screenY + 7, 26, 20, "#7a3a25", "#3a1f1f");
          ctx.fillStyle = "#4a2518";
          ctx.fillRect(screenX + 5, screenY + 16, 22, 2);
          drawSpiceJar(screenX + 6, screenY + 8, "#df4a25");
          drawSpiceJar(screenX + 17, screenY + 14, "#f07b2f");
        } else if (kind === "pickingTable") {
          drawPixelRect(screenX + 4, screenY + 11, 24, 13, "#b9834a", "#4a2f22");
          ctx.fillStyle = "#6d4725";
          ctx.fillRect(screenX + 7, screenY + 24, 4, 5);
          ctx.fillRect(screenX + 22, screenY + 24, 4, 5);
          drawTinyDocument(screenX + 8, screenY + 5, "paper");
          drawProductIcon("spice", screenX + 19, screenY + 9);
        } else if (kind === "releaseDesk") {
          drawPixelRect(screenX + 4, screenY + 10, 24, 14, "#d9e6f2", "#2b2d42");
          ctx.fillStyle = "#1f3a5f";
          ctx.fillRect(screenX + 4, screenY + 20, 24, 4);
          drawTinyDocument(screenX + 9, screenY + 4, "report");
          ctx.fillStyle = "#8fd3ff";
          ctx.fillRect(screenX + 22, screenY + 7, 4, 4);
        } else if (kind === "manual") {
          drawPixelRect(screenX + 7, screenY + 6, 18, 21, "#d9e6f2", "#2b2d42");
          ctx.fillStyle = "#4aa3ff";
          ctx.fillRect(screenX + 10, screenY + 10, 12, 3);
          ctx.fillStyle = "#263447";
          ctx.fillRect(screenX + 10, screenY + 15, 9, 1);
          ctx.fillRect(screenX + 10, screenY + 18, 10, 1);
          ctx.fillRect(screenX + 10, screenY + 21, 7, 1);
        } else if (kind === "orderSheet") {
          drawPixelRect(screenX + 8, screenY + 5, 16, 22, "#fffdf4", "#2b2d42");
          ctx.fillStyle = "#ffcf5f";
          ctx.fillRect(screenX + 11, screenY + 8, 10, 3);
          drawProductIcon("rice", screenX + 3, screenY + 13);
          ctx.fillStyle = "#263447";
          ctx.fillRect(screenX + 12, screenY + 15, 8, 1);
          ctx.fillRect(screenX + 12, screenY + 19, 6, 1);
        } else if (kind === "safetyNotice") {
          drawPixelRect(screenX + 7, screenY + 6, 18, 21, "#ffb0a8", "#7a2222");
          drawMiniWarningMark(screenX + 11, screenY + 9);
          ctx.fillStyle = "#7a2222";
          ctx.fillRect(screenX + 10, screenY + 21, 12, 2);
        } else if (kind === "cargoReport") {
          drawPixelRect(screenX + 7, screenY + 5, 18, 22, "#bde7ff", "#1f3a5f");
          ctx.fillStyle = "#20a39e";
          ctx.fillRect(screenX + 10, screenY + 10, 11, 5);
          drawOilCarton(screenX + 12, screenY + 15, true);
        } else if (kind === "truck") {
          drawPixelRect(screenX + 2, screenY + 10, 20, 13, "#6c5ce7", "#2b2d42");
          ctx.fillStyle = "#4aa3ff";
          ctx.fillRect(screenX + 21, screenY + 14, 8, 9);
          ctx.fillStyle = "#d9f1ff";
          ctx.fillRect(screenX + 23, screenY + 15, 4, 4);
          ctx.fillStyle = "#1f2937";
          ctx.fillRect(screenX + 6, screenY + 24, 6, 6);
          ctx.fillRect(screenX + 22, screenY + 24, 6, 6);
          ctx.fillStyle = "#cbd5e1";
          ctx.fillRect(screenX + 8, screenY + 26, 2, 2);
          ctx.fillRect(screenX + 24, screenY + 26, 2, 2);
        } else if (kind === "container") {
          drawPixelRect(screenX + 2, screenY + 7, 28, 20, baseColor, "#1f2937");
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          for (let i = 0; i < 4; i++) ctx.fillRect(screenX + 6 + i * 6, screenY + 8, 2, 18);
          ctx.fillStyle = "#e8dfb5";
          ctx.fillRect(screenX + 5, screenY + 11, 8, 3);
          ctx.fillStyle = object.name.includes("A") ? "#9be28f" : "#ff7777";
          ctx.fillRect(screenX + 20, screenY + 20, 5, 4);
        } else if (kind === "damagedPallet") {
          drawPixelRect(screenX + 4, screenY + 19, 24, 8, "#7a4a23", "#3a2417");
          drawOilCarton(screenX + 5, screenY + 7, true);
          drawOilCarton(screenX + 17, screenY + 9, false);
        } else if (kind === "routeBoard") {
          drawPixelRect(screenX + 5, screenY + 5, 22, 18, "#ffd166", "#5f4217");
          ctx.fillStyle = "#5f4217";
          ctx.fillRect(screenX + 8, screenY + 23, 4, 6);
          ctx.fillRect(screenX + 21, screenY + 23, 4, 6);
          drawPixelLine(screenX + 9, screenY + 18, screenX + 22, screenY + 9, "#4aa3ff", 2);
          ctx.fillStyle = "#ff595e";
          ctx.fillRect(screenX + 8, screenY + 17, 4, 4);
          ctx.fillStyle = "#20a39e";
          ctx.fillRect(screenX + 21, screenY + 8, 4, 4);
        } else if (kind === "roadSign") {
          drawPixelRect(screenX + 8, screenY + 8, 16, 12, "#4aa3ff", "#1f3a5f");
          ctx.fillStyle = "#1f3a5f";
          ctx.fillRect(screenX + 15, screenY + 20, 3, 9);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(screenX + 11, screenY + 12, 9, 2);
        } else if (kind === "plainBox") {
          drawPixelRect(screenX + 6, screenY + 9, 20, 17, "#9b6b3d", "#4a2f22");
          ctx.fillStyle = "#c08a4a";
          ctx.fillRect(screenX + 9, screenY + 12, 6, 5);
          ctx.fillRect(screenX + 17, screenY + 18, 6, 5);
        } else {
          drawPixelRect(screenX + 5, screenY + 5, 22, 22, baseColor, COLORS.outline);
        }

        if (isTarget) {
          drawExclamationMark(screenX + TILE_SIZE / 2, screenY - 7);
        }

        if (isPlayerNear(object.tileX, object.tileY)) {
          drawSmallLabel(object.name + "  E", screenX + TILE_SIZE / 2, screenY - 35, 170);
        }
      }
    }


    function drawNPCSprite(npc, screenX, screenY) {
      const profile = NPC_VISUAL_PROFILES[npc.name] || NPC_VISUAL_PROFILES[Object.keys(NPC_VISUAL_PROFILES).find(function (name) { return npc.name.includes(name); })] || {
        skin: "#f2c49b",
        hair: "#2b2d42",
        hairStyle: "short",
        top: npc.color || "#6c5ce7",
        vest: "#263447",
        accent: "#ffffff",
        pants: "#1f2937",
        accessory: "none"
      };

      const idlePulse = Math.floor((performance.now() / 520 + (npc.idleSeed || 0)) % 2);
      const moveFrame = npc.moving ? Math.floor(performance.now() / 170) % 2 : idlePulse;
      const facing = isNPCBeingInteractedWith(npc) ? getNPCFacingTowardPlayer(npc) : (npc.facing || "down");
      const idleYOffset = npc.moving ? 0 : (idlePulse === 0 ? 0 : -1);
      const stepOffset = npc.moving && moveFrame === 1 ? 1 : 0;
      const blink = !npc.moving && Math.floor((performance.now() / 180 + (npc.idleSeed || 0)) % 28) === 0;
      const x = screenX;
      const y = screenY + idleYOffset;

      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fillRect(x + 7, y + 27, 19, 4);

      // Legs/boots: tiny 2-frame patrol step, subtle enough to stay readable.
      ctx.fillStyle = profile.pants;
      if (facing === "left" || facing === "right") {
        ctx.fillRect(x + 9, y + 23 + stepOffset, 5, 6);
        ctx.fillRect(x + 19, y + 23 - stepOffset, 5, 6);
      } else {
        ctx.fillRect(x + 9, y + 23 - stepOffset, 5, 6);
        ctx.fillRect(x + 19, y + 23 + stepOffset, 5, 6);
      }
      ctx.fillStyle = "#151923";
      ctx.fillRect(x + 8, y + 28, 7, 2);
      ctx.fillRect(x + 18, y + 28, 7, 2);

      // Body silhouette varies by role.
      if (profile.role === "manager" || profile.role === "clerk" || profile.role === "officer") {
        ctx.fillStyle = profile.top;
        ctx.fillRect(x + 9, y + 12, 15, 13);
        ctx.fillStyle = profile.vest;
        ctx.fillRect(x + 12, y + 13, 9, 12);
      } else if (profile.role === "warehouse" || profile.role === "dock") {
        ctx.fillStyle = profile.top;
        ctx.fillRect(x + 7, y + 12, 19, 13);
        ctx.fillStyle = profile.vest;
        ctx.fillRect(x + 9, y + 13, 15, 10);
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 10, y + 15, 12, 2);
      } else if (profile.role === "elder") {
        ctx.fillStyle = profile.top;
        ctx.fillRect(x + 10, y + 13, 13, 13);
        ctx.fillStyle = profile.vest;
        ctx.fillRect(x + 9, y + 16, 15, 9);
      } else if (profile.role === "merchant") {
        ctx.fillStyle = profile.top;
        ctx.fillRect(x + 8, y + 12, 18, 13);
        ctx.fillStyle = profile.vest;
        ctx.fillRect(x + 11, y + 13, 12, 8);
      } else {
        ctx.fillStyle = profile.top;
        ctx.fillRect(x + 8, y + 12, 17, 13);
      }

      // Face
      ctx.fillStyle = profile.skin;
      ctx.fillRect(x + 10, y + 5, 13, 9);

      // Hair/headgear silhouettes.
      ctx.fillStyle = profile.hair;
      if (profile.hairStyle === "bob") {
        ctx.fillRect(x + 8, y + 3, 17, 6);
        ctx.fillRect(x + 8, y + 8, 3, 7);
        ctx.fillRect(x + 22, y + 8, 3, 7);
      } else if (profile.hairStyle === "spiky") {
        ctx.fillRect(x + 9, y + 4, 15, 4);
        ctx.fillRect(x + 10, y + 1, 3, 4);
        ctx.fillRect(x + 16, y + 0, 3, 5);
        ctx.fillRect(x + 22, y + 2, 3, 4);
      } else if (profile.hairStyle === "longSide") {
        ctx.fillRect(x + 8, y + 3, 17, 5);
        ctx.fillRect(x + 7, y + 7, 4, 12);
        ctx.fillRect(x + 21, y + 7, 4, 8);
      } else if (profile.hairStyle === "baldCrown") {
        ctx.fillRect(x + 8, y + 4, 4, 6);
        ctx.fillRect(x + 21, y + 4, 4, 6);
        ctx.fillStyle = "#f3e5d0";
        ctx.fillRect(x + 12, y + 3, 9, 3);
        ctx.fillStyle = profile.hair;
        ctx.fillRect(x + 12, y + 12, 10, 2);
      } else if (profile.hairStyle === "cap") {
        ctx.fillRect(x + 8, y + 3, 17, 5);
        ctx.fillRect(x + 13, y + 1, 10, 3);
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 20, y + 5, 6, 2);
      } else if (profile.hairStyle === "ponytailCap") {
        ctx.fillRect(x + 8, y + 3, 17, 5);
        ctx.fillRect(x + 22, y + 8, 5, 8);
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 12, y + 2, 9, 2);
      } else if (profile.hairStyle === "turban") {
        ctx.fillRect(x + 8, y + 2, 17, 7);
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 11, y + 4, 11, 2);
      } else {
        ctx.fillRect(x + 9, y + 3, 15, 5);
      }

      // Eyes / small face details. NPCs blink and face the player during interaction.
      ctx.fillStyle = "#17202a";
      if (blink) {
        ctx.fillRect(x + 13, y + 10, 3, 1);
        ctx.fillRect(x + 19, y + 10, 3, 1);
      } else if (facing === "left") {
        ctx.fillRect(x + 12, y + 9, 2, 2);
        ctx.fillRect(x + 17, y + 9, 2, 2);
      } else if (facing === "right") {
        ctx.fillRect(x + 15, y + 9, 2, 2);
        ctx.fillRect(x + 20, y + 9, 2, 2);
      } else if (facing === "up") {
        ctx.fillRect(x + 13, y + 8, 2, 1);
        ctx.fillRect(x + 19, y + 8, 2, 1);
      } else {
        ctx.fillRect(x + 13, y + 9, 2, 2);
        ctx.fillRect(x + 19, y + 9, 2, 2);
      }

      // Role accessories.
      if (profile.accessory === "clipboard") {
        drawTinyDocument(x + 4, y + 14, "paper");
      } else if (profile.accessory === "headband") {
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 9, y + 7, 15, 2);
      } else if (profile.accessory === "scanner") {
        ctx.fillStyle = "#4aa3ff";
        ctx.fillRect(x + 24, y + 16, 5, 4);
        ctx.fillStyle = "#ffeb70";
        ctx.fillRect(x + 28, y + 17, 2, 1);
      } else if (profile.accessory === "cane") {
        drawPixelLine(x + 25, y + 17, x + 28, y + 30, "#6b4a2d", 2);
      } else if (profile.accessory === "gloves") {
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 5, y + 18, 4, 4);
        ctx.fillRect(x + 25, y + 18, 4, 4);
      } else if (profile.accessory === "badge") {
        ctx.fillStyle = "#ffeb70";
        ctx.fillRect(x + 18, y + 15, 4, 4);
      } else if (profile.accessory === "coinBelt") {
        ctx.fillStyle = profile.accent;
        ctx.fillRect(x + 10, y + 23, 14, 2);
        ctx.fillStyle = "#ffeb70";
        ctx.fillRect(x + 15, y + 22, 3, 3);
      } else if (profile.accessory === "map") {
        drawTinyDocument(x + 23, y + 14, "report");
      }

      ctx.strokeStyle = COLORS.outline;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 8, y + 12, 18, 13);
      ctx.strokeRect(x + 10, y + 5, 13, 9);
    }

    function drawNPCs() {
      for (const npc of npcs) {
        if (npc.mapId !== currentMap.id) continue;

        const drawPixelX = Number.isFinite(npc.pixelX) ? npc.pixelX : npc.tileX * TILE_SIZE;
        const drawPixelY = Number.isFinite(npc.pixelY) ? npc.pixelY : npc.tileY * TILE_SIZE;
        const screenX = Math.floor(drawPixelX - camera.x);
        const screenY = Math.floor(drawPixelY - camera.y);

        if (screenX < -TILE_SIZE || screenX > canvas.width || screenY < -TILE_SIZE || screenY > canvas.height) {
          continue;
        }

        const isTarget = isCurrentTarget(npc.name);
        drawNPCSprite(npc, screenX, screenY);

        if (isTarget) {
          drawExclamationMark(screenX + TILE_SIZE / 2, screenY - 7);
        }

        if (isPlayerNear(npc.tileX, npc.tileY)) {
          drawSmallLabel(npc.name + "  E", screenX + TILE_SIZE / 2, screenY - 35, 130);
        }
      }
    }


    function drawPlayer() {
      const screenX = Math.floor(player.x - camera.x);
      const screenY = Math.floor(player.y - camera.y);
      const walkFrame = player.moving ? Math.floor(performance.now() / 130) % 2 : 0;
      const stepOffset = walkFrame === 0 ? 0 : 1;
      const facing = player.facing || "down";

      ctx.fillStyle = "rgba(0, 0, 0, 0.30)";
      ctx.fillRect(screenX + 7, screenY + 27, 18, 4);

      // Animated two-frame legs.
      ctx.fillStyle = "#1f2937";
      if (facing === "left" || facing === "right") {
        ctx.fillRect(screenX + 9 + stepOffset, screenY + 23, 5, 6);
        ctx.fillRect(screenX + 18 - stepOffset, screenY + 23, 5, 6);
      } else {
        ctx.fillRect(screenX + 9, screenY + 23 - stepOffset, 5, 6 + stepOffset);
        ctx.fillRect(screenX + 18, screenY + 23 + stepOffset, 5, 6 - stepOffset);
      }
      ctx.fillStyle = "#111827";
      ctx.fillRect(screenX + 8, screenY + 28, 7, 2);
      ctx.fillRect(screenX + 18, screenY + 28, 7, 2);

      // Trainee jacket/backpack silhouette.
      ctx.fillStyle = "#2f5eff";
      ctx.fillRect(screenX + 7, screenY + 12, 18, 13);
      ctx.fillStyle = "#ffeb70";
      ctx.fillRect(screenX + 11, screenY + 14, 10, 2);
      ctx.fillStyle = "#20304f";
      ctx.fillRect(screenX + 6, screenY + 14, 3, 9);

      ctx.fillStyle = "#f0c7a0";
      ctx.fillRect(screenX + 9, screenY + 4, 14, 10);

      ctx.fillStyle = "#202020";
      ctx.fillRect(screenX + 8, screenY + 2, 16, 5);
      ctx.fillRect(screenX + 8, screenY + 6, 3, 4);

      ctx.fillStyle = "#111";
      if (facing === "up") {
        ctx.fillRect(screenX + 11, screenY + 4, 10, 2);
      } else if (facing === "left") {
        ctx.fillRect(screenX + 11, screenY + 8, 2, 2);
      } else if (facing === "right") {
        ctx.fillRect(screenX + 20, screenY + 8, 2, 2);
      } else {
        ctx.fillRect(screenX + 12, screenY + 8, 2, 2);
        ctx.fillRect(screenX + 19, screenY + 8, 2, 2);
      }

      // Small trainee badge to separate player from NPCs.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(screenX + 20, screenY + 15, 3, 4);

      ctx.strokeStyle = COLORS.outline;
      ctx.lineWidth = 2;
      ctx.strokeRect(screenX + 7, screenY + 12, 18, 13);
      ctx.strokeRect(screenX + 9, screenY + 4, 14, 10);
    }

      const logHeight = canvas.height - 84;
