    function saveGame(options) {
      const settings = options || {};
      const storage = getStorageSafe();
      if (!storage) return false;

      try {
        storage.setItem(SAVE_KEY, JSON.stringify(createSavePayload()));
        if (settings.showMessage !== false) {
          showSaveMessage(settings.message || "Game Saved");
        }
        return true;
      } catch (error) {
        console.warn("Routebound save failed:", error);
        return false;
      }
    }

    function isValidSaveData(savedData) {
      if (!savedData || typeof savedData !== "object") return false;
      if (savedData.saveVersion !== SAVE_VERSION) return false;
      if (!savedData.runData || typeof savedData.runData !== "object") return false;
      if (!savedData.player || !Number.isFinite(savedData.player.x) || !Number.isFinite(savedData.player.y)) return false;
      if (!savedData.currentMapId || !maps[savedData.currentMapId]) return false;
      if (!savedData.playerStats || typeof savedData.playerStats !== "object") return false;
      if (!savedData.ravenford || typeof savedData.ravenford !== "object") return false;
      if (!savedData.portAzureQuest || typeof savedData.portAzureQuest !== "object") return false;
      if (!savedData.scmPerformance || typeof savedData.scmPerformance !== "object") return false;
      return true;
    }

    function readRawSaveData(options) {
      const settings = options || {};
      const storage = getStorageSafe();
      if (!storage) return null;

      try {
        const rawSave = storage.getItem(SAVE_KEY);
        if (!rawSave) return null;

        const parsedSave = JSON.parse(rawSave);
        if (!isValidSaveData(parsedSave)) {
          if (settings.removeInvalid !== false) {
            storage.removeItem(SAVE_KEY);
          }
          return null;
        }

        return parsedSave;
      } catch (error) {
        console.warn("Routebound save data is unreadable:", error);
        if (settings.removeInvalid !== false) {
          try {
            storage.removeItem(SAVE_KEY);
          } catch (removeError) {
            console.warn("Could not remove unreadable Routebound save:", removeError);
          }
        }
        return null;
      }
    }

    function hasSaveGame() {
      return Boolean(readRawSaveData({ removeInvalid: true }));
    }

    function getSavedGameData() {
      return readRawSaveData({ removeInvalid: true });
    }

    function deleteSaveGame() {
      const storage = getStorageSafe();
      if (!storage) return false;
      storage.removeItem(SAVE_KEY);
      return true;
    }

      if (ravenford.portRoadUnlocked) {

        maps.ravenford.tiles[12][39] = 1;
      } else {
        maps.ravenford.tiles[12][38] = 6;
        maps.ravenford.tiles[12][39] = 6;

    function loadGame(options) {
      const settings = options || {};
      const savedData = getSavedGameData();
      if (!savedData) {
        if (settings.showMessage !== false) showSaveMessage("No valid save found.");
        return false;
      }

      try {
        runData = clonePlainObject(savedData.runData);

    function getMajorMistakesText(record) {
      const mistakes = [];
      if (record.wrongGoodsDelivered) mistakes.push("wrong goods delivered");
      else if (record.wrongGoodsLoaded) mistakes.push("wrong goods loaded");
      if (record.damagedGoodsMixed) mistakes.push("damaged goods mixed");
      if (!record.correctContainerReleased) mistakes.push("wrong container release");
      if (record.deadlineFailed) mistakes.push("deadline missed");
      return mistakes.length ? mistakes.join(", ") : "None";
    }

        cargoAccepted: festivalRecord.cargoAccepted,
        vendorSatisfaction: festivalRecord.vendorSatisfaction,
        inspectionResult: festivalRecord.inspectionResult,

        reputation: playerStats.Reputation,
        timeLost: scmPerformance.timeLost,
        wrongGoodsDelivered: wrongGoodsWereDelivered(),

        correctContainerReleased: Boolean(scmPerformance.correctContainerReleased),
        deadlineFailed: Boolean(scmPerformance.deadlineFailed),
        sideQuestsCompleted: getCompletedSideQuestCount(),
        completedAt: new Date().toISOString()
      };
      record.majorMistakes = getMajorMistakesText(record);
      return record;
    }

    function getRankHistory() {
      const storage = getStorageSafe();
      if (!storage) return [];

      try {
        const rawHistory = storage.getItem(RANK_HISTORY_KEY);
        const parsedHistory = rawHistory ? JSON.parse(rawHistory) : [];
        return Array.isArray(parsedHistory) ? parsedHistory : [];
      } catch (error) {
        console.warn("Rank history is unreadable:", error);
        return [];
      }
    }

    function saveRankHistory(history) {
      const storage = getStorageSafe();
      if (!storage) return false;

      try {
        storage.setItem(RANK_HISTORY_KEY, JSON.stringify(history.slice(0, 5)));
        return true;
      } catch (error) {
        console.warn("Rank history save failed:", error);
        return false;
      }
    }

    function saveFinalRankHistory() {
      if (finalRankHistorySaved) return false;
      const history = getRankHistory();
      history.unshift(buildFinalResultRecord());
      saveRankHistory(history);
      finalRankHistorySaved = true;
      return true;

    function applyStatChanges(changes) {
      if (!changes) return;

      for (const statName in changes) {
        if (playerStats[statName] !== undefined) {
          playerStats[statName] += changes[statName];

          // Reputation may go below 0. Other stats stay at 0 minimum.
          if (statName !== "Reputation") {
            playerStats[statName] = Math.max(0, playerStats[statName]);
          }
        }
      }
    }

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatYesNo(value) {
      return value ? "Yes" : "No";
    }

    function applySCMChanges(changes) {
      if (!changes) return [];

      for (const key in changes) {
        if (scmPerformance[key] === undefined) continue;

        const changeValue = changes[key];

        if (typeof scmPerformance[key] === "number") {
          scmPerformance[key] += changeValue;

          if (key === "cargoCondition") {
            scmPerformance[key] = clampNumber(scmPerformance[key], 0, 100);
          }

          if (key === "timeLost") {
            scmPerformance[key] = Math.max(0, scmPerformance[key]);
          }
        } else if (typeof scmPerformance[key] === "boolean") {
          scmPerformance[key] = Boolean(changeValue);
        }
      }

      // Keep SCM performance hidden during play. Choice result dialogue handles the story consequence.
      return [];
    }

    // Original deadline windows per stage. Positive time savings cannot push
    // a stage above its starting deadline.
    const STAGE_START_TIME = { ravenford: 45, portAzure: 40, festivalGrounds: 20 };

    function getStageStartTime() {
      return STAGE_START_TIME[currentMap.id] || 45;
    }

    // Applies a time change to the active stage. Returns any natural story
    // lines that should be appended to the current choice result (empty array
    // if the deadline was not just missed). No debug text is ever returned.
    function adjustTime(minutes) {
      const quest = getActiveQuest();
      const before = quest.timeRemaining;

      quest.timeRemaining += minutes;

      // Cap time savings at the stage's original deadline window.
      const stageMax = getStageStartTime();
      if (quest.timeRemaining > stageMax) {
        quest.timeRemaining = stageMax;
      }

      quest.timeRemaining = Math.max(0, quest.timeRemaining);

      // The deadline is missed only on the first crossing to 0 for this stage.
      if (before > 0 && quest.timeRemaining <= 0) {
        return triggerDeadlineMissed();
      }

      maybePlayLowTimeWarning();

      return [];
    }

    // Real consequence for letting the delivery window run out. The shipment
    // still moves, but rushed and damaged. Returns in-world dialogue only.
    function triggerDeadlineMissed() {
      scmPerformance.deadlineFailed = true;

      addMistake("Missed delivery time window.");

    function getNPCMovementKey(npc) {
      return npc.mapId + "|" + npc.name;
    }

    function getNPCMovementProfile(npc) {
      return NPC_MOVEMENT_PROFILES[getNPCMovementKey(npc)] || NPC_DEFAULT_MOVEMENT_PROFILE;
    }

    function getRandomNPCPause(npc) {
      const profile = getNPCMovementProfile(npc);
      const minPause = profile.pauseMin || 1000;
      const maxPause = profile.pauseMax || 2200;
      return minPause + Math.random() * Math.max(1, maxPause - minPause);
    }

    function initializeNPCMovementState() {
      const now = performance.now ? performance.now() : Date.now();

      for (const npc of npcs) {
        const profile = getNPCMovementProfile(npc);
        const homeTileX = Number.isFinite(profile.homeTileX) ? profile.homeTileX : npc.tileX;
        const homeTileY = Number.isFinite(profile.homeTileY) ? profile.homeTileY : npc.tileY;

        npc.homeTileX = homeTileX;
        npc.homeTileY = homeTileY;
        npc.tileX = homeTileX;
        npc.tileY = homeTileY;
        npc.pixelX = homeTileX * TILE_SIZE;
        npc.pixelY = homeTileY * TILE_SIZE;
        npc.targetTileX = homeTileX;
        npc.targetTileY = homeTileY;
        npc.targetPixelX = npc.pixelX;
        npc.targetPixelY = npc.pixelY;
        npc.moving = false;
        npc.facing = profile.facing || "down";
        npc.patrolDirection = 1;
        npc.pauseUntil = now + getRandomNPCPause(npc) + Math.random() * 900;
        npc.walkSpeed = profile.speed || 1.25;
        npc.idleSeed = Math.random() * 1000;
        npc.lastIdleTurnAt = now;
      }
    }

    function isDoorOrExitTileForNPC(mapId, tileX, tileY) {
      const mapData = maps[mapId];
      if (!mapData || !mapData.tiles[tileY] || mapData.tiles[tileY][tileX] === undefined) return true;

      const tile = mapData.tiles[tileY][tileX];

      // NPCs should not idle or patrol on door tiles, map exits, or locked/unlocked border transitions.
      if (tile === 5 || tile === 6) return true;
      if (mapId === "ravenford" && tileX >= maps.ravenford.portExit.x - 1 && tileY === maps.ravenford.portExit.y) return true;
      if (mapId === "portAzure" && tileX <= maps.portAzure.ravenfordExit.x + 1 && tileY === maps.portAzure.ravenfordExit.y) return true;
      if (mapId === "portAzure" && tileX >= maps.portAzure.festivalExit.x - 1 && tileY === maps.portAzure.festivalExit.y) return true;
      if (mapId === "festivalGrounds" && tileX <= maps.festivalGrounds.portAzureExit.x + 1 && tileY === maps.festivalGrounds.portAzureExit.y) return true;

      return false;
    }

    function isInteractiveObjectTile(tileX, tileY, mapId) {
      return interactiveObjects.some(function (object) {
        return object.mapId === mapId && object.tileX === tileX && object.tileY === tileY;
      });
    }

    function isOccupiedByOtherNPC(tileX, tileY, mapId, currentNPC) {
      return npcs.some(function (npc) {
        if (npc === currentNPC || npc.mapId !== mapId) return false;
        return npc.tileX === tileX && npc.tileY === tileY;
      });
    }

    function isSafeNPCTile(npc, tileX, tileY) {
      const mapData = maps[npc.mapId];
      if (!mapData || !mapData.tiles[tileY] || mapData.tiles[tileY][tileX] === undefined) return false;

      const tile = mapData.tiles[tileY][tileX];
      if (!(tile === 0 || tile === 1)) return false;
      if (isDoorOrExitTileForNPC(npc.mapId, tileX, tileY)) return false;
      if (isInteractiveObjectTile(tileX, tileY, npc.mapId)) return false;
      if (isOccupiedByOtherNPC(tileX, tileY, npc.mapId, npc)) return false;

      if (currentMap.id === npc.mapId && getPlayerTileX() === tileX && getPlayerTileY() === tileY) {
        return false;
      }

      return true;
    }

    function getNPCFacingToward(fromTileX, fromTileY, toTileX, toTileY) {
      const dx = toTileX - fromTileX;
      const dy = toTileY - fromTileY;

      if (Math.abs(dx) > Math.abs(dy)) {
        return dx < 0 ? "left" : "right";
      }

      if (dy < 0) return "up";
      if (dy > 0) return "down";
      return "down";
    }

    function getNPCFacingTowardPlayer(npc) {
      return getNPCFacingToward(npc.tileX, npc.tileY, getPlayerTileX(), getPlayerTileY());
    }

    function isNPCBeingInteractedWith(npc) {
      return Boolean(
        activeDialogueTarget &&
        activeDialogueTarget.name === npc.name &&
        activeDialogueTarget.mapId === npc.mapId
      );
    }

    function setNPCMoveTarget(npc, tileX, tileY) {
      if (!isSafeNPCTile(npc, tileX, tileY)) return false;

      npc.targetTileX = tileX;
      npc.targetTileY = tileY;
      npc.targetPixelX = tileX * TILE_SIZE;
      npc.targetPixelY = tileY * TILE_SIZE;
      npc.facing = getNPCFacingToward(npc.tileX, npc.tileY, tileX, tileY);
      npc.moving = true;
      return true;
    }

    function getNPCMoveCandidates(npc) {
      const profile = getNPCMovementProfile(npc);
      const radius = profile.radius || 1;
      const candidates = [];

      if (profile.type === "smallPatrolHorizontal") {
        candidates.push({ x: npc.homeTileX + npc.patrolDirection * radius, y: npc.homeTileY });
        candidates.push({ x: npc.homeTileX - npc.patrolDirection * radius, y: npc.homeTileY });
      } else if (profile.type === "smallPatrolVertical") {
        candidates.push({ x: npc.homeTileX, y: npc.homeTileY + npc.patrolDirection * radius });
        candidates.push({ x: npc.homeTileX, y: npc.homeTileY - npc.patrolDirection * radius });
      } else if (profile.type === "wanderInSmallRadius") {
        const steps = [
          { x: npc.tileX + 1, y: npc.tileY },
          { x: npc.tileX - 1, y: npc.tileY },
          { x: npc.tileX, y: npc.tileY + 1 },
          { x: npc.tileX, y: npc.tileY - 1 },
          { x: npc.homeTileX, y: npc.homeTileY }
        ];

        for (const step of steps) {
          if (Math.abs(step.x - npc.homeTileX) + Math.abs(step.y - npc.homeTileY) <= radius) {
            candidates.push(step);
          }
        }

        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = candidates[i];
          candidates[i] = candidates[j];
          candidates[j] = temp;
        }
      } else if (profile.type === "stationaryIdle" && profile.allowSmallStep) {
        candidates.push({ x: npc.homeTileX + 1, y: npc.homeTileY });
        candidates.push({ x: npc.homeTileX - 1, y: npc.homeTileY });
        candidates.push({ x: npc.homeTileX, y: npc.homeTileY });
      }

      return candidates;
    }

    function chooseNextNPCMove(npc, now) {
      const profile = getNPCMovementProfile(npc);

      if (profile.type === "stationaryIdle" && !profile.allowSmallStep) {
        // Stationary NPCs still turn occasionally so they do not look frozen.
        if (now - (npc.lastIdleTurnAt || 0) > 2200) {
          const directions = ["down", "left", "right", "up"];
          npc.facing = directions[Math.floor(Math.random() * directions.length)];
          npc.lastIdleTurnAt = now;
        }
        npc.pauseUntil = now + getRandomNPCPause(npc);
        return;
      }

      const candidates = getNPCMoveCandidates(npc);

      for (const candidate of candidates) {
        if (setNPCMoveTarget(npc, candidate.x, candidate.y)) {
          return;
        }
      }

      npc.patrolDirection *= -1;
      npc.pauseUntil = now + getRandomNPCPause(npc);
    }

    function updateNPCPosition(npc, now) {
      if (npc.mapId !== currentMap.id) return;

      if (isNPCBeingInteractedWith(npc)) {
        npc.facing = getNPCFacingTowardPlayer(npc);
        return;
      }

      if (npc.moving) {
        const speed = npc.walkSpeed || 1.25;

        if (npc.pixelX < npc.targetPixelX) {
          npc.pixelX = Math.min(npc.targetPixelX, npc.pixelX + speed);
        } else if (npc.pixelX > npc.targetPixelX) {
          npc.pixelX = Math.max(npc.targetPixelX, npc.pixelX - speed);
        }

        if (npc.pixelY < npc.targetPixelY) {
          npc.pixelY = Math.min(npc.targetPixelY, npc.pixelY + speed);
        } else if (npc.pixelY > npc.targetPixelY) {
          npc.pixelY = Math.max(npc.targetPixelY, npc.pixelY - speed);
        }

        if (npc.pixelX === npc.targetPixelX && npc.pixelY === npc.targetPixelY) {
          npc.tileX = npc.targetTileX;
          npc.tileY = npc.targetTileY;
          npc.moving = false;
          npc.patrolDirection *= -1;
          npc.pauseUntil = now + getRandomNPCPause(npc);
        }

        return;
      }

      if (now >= (npc.pauseUntil || 0)) {
        chooseNextNPCMove(npc, now);
      }
    }

      s: false,
      d: false
    };

    window.addEventListener("keydown", function (event) {
      const pressedKey = event.key.toLowerCase();

      if (!event.repeat) {
        initializeAudioFromUserGesture();
      }

      if (pressedKey === "v" && !event.repeat) {
        event.preventDefault();
        toggleSoundMute();
        return;
      }

      if (introSequence.active) {
        event.preventDefault();

        if (!event.repeat) {
          if (introSequence.phase === "title" && (event.key === "ArrowUp" || pressedKey === "w")) {
            moveTitleMenuSelection(-1);
            return;
          }

          if (introSequence.phase === "title" && (event.key === "ArrowDown" || pressedKey === "s")) {
            moveTitleMenuSelection(1);
            return;
          }

          if (introSequence.phase === "newGameConfirm" && (event.key === "ArrowUp" || pressedKey === "w")) {
            moveNewGameConfirmSelection(-1);
            return;
          }

          if (introSequence.phase === "newGameConfirm" && (event.key === "ArrowDown" || pressedKey === "s")) {
            moveNewGameConfirmSelection(1);
            return;
          }

          if (introSequence.phase === "rankHistory" && event.key === "Escape") {
            returnFromRankHistoryToTitle();
            return;
          }

          if (introSequence.phase === "newGameConfirm" && event.key === "Escape") {
            returnFromNewGameConfirmToTitle();
            return;
          }

          if (introSequence.phase === "newGameConfirm" && (event.key === "1" || event.key === "2")) {
            newGameConfirmSelectedIndex = event.key === "1" ? 0 : 1;
            confirmNewGameSelection();
            return;
          }
        }

        if ((event.key === "Enter" || pressedKey === "e" || pressedKey === " ") && !event.repeat) {
          advanceIntroSequence();
        }

        return;
      }

      if (gameState === "finalScore") {
        event.preventDefault();

        if (pressedKey === "r" && !event.repeat) {
          returnToTitleScreen();
          return;
        }

        if (pressedKey === "n" && !event.repeat) {
          openNewGameConfirmation();
          return;
        }

        if ((pressedKey === "e" || event.key === "Enter") && !event.repeat) {
          playSound("menuConfirm");
          endingScreenActive = false;
          learningSummaryScreenActive = true;
          setGameState("learningSummary");
          renderEndScreen();
        }

        return;
      }

      if (gameState === "learningSummary") {
        event.preventDefault();

        if (pressedKey === "r" && !event.repeat) {
          returnToTitleScreen();
          return;
        }

        if (pressedKey === "n" && !event.repeat) {
          openNewGameConfirmation();
          return;
        }

        if ((pressedKey === "e" || event.key === "Enter") && !event.repeat) {
          playSound("menuConfirm");
          learningSummaryScreenActive = false;
          endingScreenActive = true;
          setGameState("finalScore");
          renderEndScreen();
        }

        return;
      }

      if (gameState === "playing" && !openingCutscene.active && minimapOpen) {
        event.preventDefault();

        if ((pressedKey === "m" || event.key === "Escape") && !event.repeat) {
          closeMinimap();
        }

        return;
      }

      if (gameState === "playing" && !openingCutscene.active && pressedKey === "m" && !event.repeat) {
        event.preventDefault();
        toggleMinimap();
        return;
      }

      if (openingCutscene.active) {
        if ((pressedKey === "e" || event.key === "Enter" || event.key === " ") && !event.repeat) {
          event.preventDefault();

          if (handleRollingTextContinue()) {
            return;
          }

          advanceOpeningCutscene();
        }
        return;
      }

      const moveKey = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (moveKey in keys) {
        keys[moveKey] = true;
      }

      if (pressedKey === "q" && !event.repeat) {
        playSound("menuConfirm");
        getActiveQuest().logOpen = !getActiveQuest().logOpen;
        renderQuestLog();
      }

      if (event.key === "Tab" && !event.repeat) {
        event.preventDefault();
        playSound("menuConfirm");
        statsMenuOpen = !statsMenuOpen;
      }

      if (activeChoices && (pressedKey === "e" || event.key === "Enter") && !event.repeat) {
        if (handleRollingTextContinue()) {
          event.preventDefault();
        }
        return;
      }

      if (["1", "2", "3", "4"].includes(event.key) && activeChoices && !event.repeat) {
        const choiceIndex = Number(event.key) - 1;

        if (!canSelectVisibleChoice(choiceIndex)) {
          event.preventDefault();
          return;
        }

        handleChoiceSelection(choiceIndex);
        return;
      }

      if ((pressedKey === "e" || event.key === "Enter") && !event.repeat) {
        if (handleRollingTextContinue()) {
          event.preventDefault();
          return;
        }

        handleInteraction(pressedKey);
      }
    });

    window.addEventListener("keyup", function (event) {
      const releasedKey = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (releasedKey in keys) {
        keys[releasedKey] = false;
      }
    });

    window.addEventListener("pointerdown", function () {
      initializeAudioFromUserGesture();
    }, { once: true });

    if (soundToggleButton) {
      soundToggleButton.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleSoundMute();
      });
      updateSoundToggleButton();
    }

    // ===============================
    // COLLISION / DISTANCE
    // ===============================

    function isWalkableTile(x, y) {
      const tileX = Math.floor(x / TILE_SIZE);
      const tileY = Math.floor(y / TILE_SIZE);

      if (
        tileY < 0 ||
        tileY >= gameMap.length ||
        tileX < 0 ||
        tileX >= gameMap[0].length
      ) {
        return false;
      }

      const tile = gameMap[tileY][tileX];

      return tile === 0 || tile === 1 || tile === 5;
    }

    function getPlayerTileX() {
      return Math.floor(player.x / TILE_SIZE);
    }

    function getPlayerTileY() {
      return Math.floor(player.y / TILE_SIZE);
    }

    function getTileDistance(tileX, tileY) {
      return Math.abs(getPlayerTileX() - tileX) + Math.abs(getPlayerTileY() - tileY);
    }

    function isPlayerNear(tileX, tileY) {
      return getTileDistance(tileX, tileY) <= 1;
    }

    function getNearbyNPC() {
      for (const npc of npcs) {
        if (npc.mapId === currentMap.id && isPlayerNear(npc.tileX, npc.tileY)) {
          return npc;
        }
      }
      return null;
    }

    function getNearbyObject() {
      for (const object of interactiveObjects) {
        if (object.mapId === currentMap.id && isPlayerNear(object.tileX, object.tileY)) {
          return object;
        }
      }
      return null;
    }

    // ===============================
    // MINIMAP / NAVIGATION UI
    // ===============================

    function clearMovementKeys() {
      for (const key in keys) {
        keys[key] = false;
      }
    }

    function canOpenMinimap() {
      return gameState === "playing" &&
        !introSequence.active &&
        !openingCutscene.active &&
        !isEndGameState() &&
        !activeDialogueTarget &&
        !activeChoices;
    }

    function openMinimap() {
      if (!canOpenMinimap()) return false;
      minimapOpen = true;
      clearMovementKeys();
      playSound("menuConfirm");
      renderGuiPanel();
      return true;
    }

    function closeMinimap() {
      if (!minimapOpen) return false;
      minimapOpen = false;
      clearMovementKeys();
      playSound("menuCancel");
      renderGuiPanel();
      return true;
    }

    function toggleMinimap() {
      if (minimapOpen) {
        return closeMinimap();
      }
      return openMinimap();
    }

    function getEntityMiniTile(entity) {
      if (!entity) return null;
      const pixelX = Number.isFinite(entity.pixelX) ? entity.pixelX : entity.tileX * TILE_SIZE;
      const pixelY = Number.isFinite(entity.pixelY) ? entity.pixelY : entity.tileY * TILE_SIZE;
      return {
        x: Math.max(0, Math.min(gameMap[0].length - 1, Math.round(pixelX / TILE_SIZE))),
        y: Math.max(0, Math.min(gameMap.length - 1, Math.round(pixelY / TILE_SIZE)))
      };
    }

    function findMinimapTargetByName(targetName) {
      if (!targetName) return null;

      if (targetName === "Road to Port Azure" && currentMap.id === "ravenford") {
        return { tileX: maps.ravenford.portExit.x, tileY: maps.ravenford.portExit.y, name: targetName };
      }

      if ((targetName === "Return to Ravenford" || targetName === "Road to Ravenford") && currentMap.id === "portAzure") {
        return { tileX: maps.portAzure.ravenfordExit.x, tileY: maps.portAzure.ravenfordExit.y, name: targetName };
      }

      if (targetName === "Road to Festival Grounds" && currentMap.id === "portAzure") {
        return { tileX: maps.portAzure.festivalExit.x, tileY: maps.portAzure.festivalExit.y, name: targetName };
      }

      if ((targetName === "Return to Port Azure" || targetName === "Road to Port Azure") && currentMap.id === "festivalGrounds") {
        return { tileX: maps.festivalGrounds.portAzureExit.x, tileY: maps.festivalGrounds.portAzureExit.y, name: targetName };
      }

      const npc = npcs.find(function (candidate) {
        return candidate.mapId === currentMap.id && candidate.name === targetName;
      });

      if (npc) return npc;

      const object = interactiveObjects.find(function (candidate) {
        return candidate.mapId === currentMap.id && candidate.name === targetName;
      });

      return object || null;
    }

    function getCurrentObjectiveMinimapTarget() {
      if (currentMap.id === "portAzure" && portAzureQuest.completed && festivalGrounds.unlocked && !festivalGrounds.inspectionCompleted) {
        return findMinimapTargetByName("Road to Festival Grounds");
      }
      const step = getCurrentStep();
      if (!step || !step.target) return null;
      return findMinimapTargetByName(step.target);
    }

    function getImportantNPCForMinimap() {
      const step = getCurrentStep();
      const currentTargetNPC = step && npcs.find(function (npc) {
        return npc.mapId === currentMap.id && npc.name === step.target;
      });

      if (currentTargetNPC) return currentTargetNPC;

      const importantNames = currentMap.id === "festivalGrounds"
        ? ["Festival Organizer", "Vendor Leader", "Merchant Rafi", "Kai"]
        : (currentMap.id === "portAzure"
          ? ["Officer Selene", "Port Clerk Sera", "Kai", "Dock Worker Jae"]
          : ["Manager Mira", "Lina", "Bram", "Kai", "Merchant Rafi", "Old Man Daro"]);

      const candidates = npcs.filter(function (npc) {
        return npc.mapId === currentMap.id && importantNames.includes(npc.name);
      });

      if (!candidates.length) return null;

      return candidates.reduce(function (best, npc) {
        const npcTile = getEntityMiniTile(npc);
        const bestTile = getEntityMiniTile(best);
        const npcDistance = Math.abs(getPlayerTileX() - npcTile.x) + Math.abs(getPlayerTileY() - npcTile.y);
        const bestDistance = Math.abs(getPlayerTileX() - bestTile.x) + Math.abs(getPlayerTileY() - bestTile.y);
        return npcDistance < bestDistance ? npc : best;
      }, candidates[0]);
    }

    function getMiniMapTileColor(tile) {
      if (tile === 1) return currentMap.id === "portAzure" ? "#8e9aa3" : (currentMap.id === "festivalGrounds" ? "#d9b66f" : "#cda766");
      if (tile === 2) return currentMap.id === "festivalGrounds" ? "#a65f48" : "#48525c";
      if (tile === 3) return currentMap.id === "festivalGrounds" ? "#3a8f4a" : "#2f7d3a";
      if (tile === 4) return "#3f8dcc";
      if (tile === 5) return "#7a4a23";
      if (tile === 6) return "#5b2b35";
      return currentMap.id === "portAzure" ? "#cdbb82" : (currentMap.id === "festivalGrounds" ? "#83bd64" : "#79a95b");
    }

    function drawMiniMapMarker(tileX, tileY, mapX, mapY, scale, color, shape) {
      const x = Math.floor(mapX + tileX * scale + scale / 2);
      const y = Math.floor(mapY + tileY * scale + scale / 2);
      const r = Math.max(3, Math.floor(scale * 0.75));

      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = "#101827";
      ctx.lineWidth = 2;

      if (shape === "star") {
        ctx.beginPath();
        ctx.moveTo(x, y - r - 2);
        ctx.lineTo(x + 2, y - 2);
        ctx.lineTo(x + r + 2, y - 2);
        ctx.lineTo(x + 3, y + 2);
        ctx.lineTo(x + 5, y + r + 2);
        ctx.lineTo(x, y + 4);
        ctx.lineTo(x - 5, y + r + 2);
        ctx.lineTo(x - 3, y + 2);
        ctx.lineTo(x - r - 2, y - 2);
        ctx.lineTo(x - 2, y - 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (shape === "arrow") {
        ctx.beginPath();
        ctx.moveTo(x - r, y - r);
        ctx.lineTo(x + r, y);
        ctx.lineTo(x - r, y + r);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (shape === "lock") {
        ctx.fillRect(x - r, y - 1, r * 2, r + 3);
        ctx.strokeRect(x - r, y - 1, r * 2, r + 3);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y - 1, r - 1, Math.PI, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMinimapOverlay() {
      if (!minimapOpen || gameState !== "playing") return;

      const panelW = 500;
      const panelH = 376;
      const panelX = Math.floor((canvas.width - panelW) / 2);
      const panelY = Math.floor((canvas.height - panelH) / 2);

      ctx.save();
      ctx.fillStyle = "rgba(5, 8, 14, 0.62)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawUIPanel(panelX, panelY, panelW, panelH, "AREA MAP");

      const cols = gameMap[0].length;
      const rows = gameMap.length;
      const mapMaxW = panelW - 72;
      const mapMaxH = panelH - 116;
      const scale = Math.max(5, Math.floor(Math.min(mapMaxW / cols, mapMaxH / rows)));
      const mapW = cols * scale;
      const mapH = rows * scale;
      const mapX = panelX + Math.floor((panelW - mapW) / 2);
      const mapY = panelY + 48;

      ctx.fillStyle = "#101827";
      ctx.fillRect(mapX - 5, mapY - 5, mapW + 10, mapH + 10);
      ctx.strokeStyle = COLORS.cream;
      ctx.lineWidth = 2;
      ctx.strokeRect(mapX - 5, mapY - 5, mapW + 10, mapH + 10);

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          ctx.fillStyle = getMiniMapTileColor(gameMap[row][col]);
          ctx.fillRect(mapX + col * scale, mapY + row * scale, scale, scale);
        }
      }

      const playerTile = {
        x: Math.max(0, Math.min(cols - 1, Math.floor(player.x / TILE_SIZE))),
        y: Math.max(0, Math.min(rows - 1, Math.floor(player.y / TILE_SIZE)))
      };

      const objectiveTarget = getCurrentObjectiveMinimapTarget();
      if (objectiveTarget) {
        const targetTile = objectiveTarget.tileX !== undefined
          ? { x: objectiveTarget.tileX, y: objectiveTarget.tileY }
          : getEntityMiniTile(objectiveTarget);
        if (targetTile) {
          drawMiniMapMarker(targetTile.x, targetTile.y, mapX, mapY, scale, "#ffeb70", "star");
        }
      }

      const objectiveNPCName = (objectiveTarget && objectiveTarget.name) ? objectiveTarget.name : "";

      // Draw all important NPCs on the current map as green dots.
      // Skip any NPC that is already marked by the yellow objective star.
      const minimapNPCNames = currentMap.id === "festivalGrounds"
        ? ["Festival Organizer", "Vendor Leader", "Merchant Rafi", "Kai"]
        : (currentMap.id === "portAzure"
          ? ["Officer Selene", "Port Clerk Sera", "Kai", "Dock Worker Jae", "Route Captain Nori"]
          : ["Manager Mira", "Kai", "Lina", "Bram", "Old Man Daro", "Merchant Rafi"]);

      for (const npc of npcs) {
        if (npc.mapId !== currentMap.id) continue;
        if (!minimapNPCNames.includes(npc.name)) continue;
        if (npc.name === objectiveNPCName) continue;
        const npcTile = getEntityMiniTile(npc);
        if (npcTile) {
          drawMiniMapMarker(npcTile.x, npcTile.y, mapX, mapY, scale, "#9be28f", "circle");
        }
      }

      if (currentMap.id === "ravenford") {
        drawMiniMapMarker(
          maps.ravenford.portExit.x,
          maps.ravenford.portExit.y,
          mapX,
          mapY,
          scale,
          ravenford.portRoadUnlocked ? "#48d8e8" : "#a8a8a8",
          ravenford.portRoadUnlocked ? "arrow" : "lock"
        );
      } else if (currentMap.id === "portAzure") {
        drawMiniMapMarker(maps.portAzure.ravenfordExit.x, maps.portAzure.ravenfordExit.y, mapX, mapY, scale, "#48d8e8", "arrow");
        if (festivalGrounds.unlocked) {
          drawMiniMapMarker(maps.portAzure.festivalExit.x, maps.portAzure.festivalExit.y, mapX, mapY, scale, "#ffeb70", "arrow");
        }
      } else if (currentMap.id === "festivalGrounds") {
        drawMiniMapMarker(maps.festivalGrounds.portAzureExit.x, maps.festivalGrounds.portAzureExit.y, mapX, mapY, scale, "#48d8e8", "arrow");
        drawMiniMapMarker(maps.festivalGrounds.finalDeliveryZone.x, maps.festivalGrounds.finalDeliveryZone.y, mapX, mapY, scale, "#ffeb70", "star");
      }

      drawMiniMapMarker(playerTile.x, playerTile.y, mapX, mapY, scale, "#4aa3ff", "circle");

      const legendY = mapY + mapH + 22;
      ctx.font = "11px Courier New";
      ctx.textAlign = "left";
      ctx.fillStyle = "#4aa3ff";
      ctx.fillText("● Player", panelX + 34, legendY);
      ctx.fillStyle = "#ffeb70";
      ctx.fillText("★ Objective", panelX + 128, legendY);
      ctx.fillStyle = "#9be28f";
      ctx.fillText("● NPC", panelX + 242, legendY);
      ctx.fillStyle = "#48d8e8";
      ctx.fillText("▶ Route", panelX + 326, legendY);
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("M / Esc: close map", panelX + 34, legendY + 24);

      ctx.restore();
    }

    // ===============================
    // DIALOGUE AND CHOICES
    // ===============================

    function getDialogueLinesForTarget(target) {
      const step = getCurrentStep();
      const d = getRunData();

      // Inspecting a research object records that it was read (Stage 0 prep).
      if (RESEARCH_FLAG_BY_OBJECT[target.name]) {
        markResearchRead(target.name);
        return target.defaultDialogue;
      }

      if (currentMap.id === "ravenford") {
        if (target.name === "Lina" && sideQuests.linaMislabeledProducts.completed) return ["Lina: Good catch. That box would have gone to the wrong shelf.", "Lina: Product codes are safer than shelf labels when boxes move around."];
        if (target.name === "Lina" && sideQuests.linaMislabeledProducts.failed) return ["Lina: That label problem is out of our hands now.", "Lina: Next time, compare the shelf label with the product code before choosing."];
        if (target.name === "Bram" && sideQuests.bramPalletInspection.completed) return ["Bram: Those pallets are safer now.", "Bram: Good loading begins before the first box touches the truck."];
        if (target.name === "Bram" && sideQuests.bramPalletInspection.failed) return ["Bram: The loaders already moved on from those pallets.", "Bram: Remember, safe cargo should move; unsafe cargo should be secured or rejected."];
        if (target.name === "Merchant Rafi" && sideQuests.rafiAngryCustomer.completed) return ["Merchant Rafi: You handled that better than I expected.", "Merchant Rafi: The customer is still impatient, but at least they understand the delay."];
        if (target.name === "Merchant Rafi" && sideQuests.rafiAngryCustomer.failed) return ["Merchant Rafi: The customer is still unhappy, but the main shipment must continue.", "Merchant Rafi: False promises and blame do not solve delivery problems."];
        if (target.name === "Old Man Daro" && sideQuests.daroOldRecords.completed) return ["Old Man Daro: You found the movement log.", "Old Man Daro: Systems are useful, but only when people record physical movement properly."];
        if (target.name === "Old Man Daro" && sideQuests.daroOldRecords.failed) return ["Old Man Daro: Those old records have said all they can for now.", "Old Man Daro: Look for movement records when stock and shelves disagree."];

        if (target.name === "Manager Mira" && step.title === "Festival Supply Panic") {
          return [
            "Manager Mira: Ravenford has four problems before the festival shipment can leave.",
            "Manager Mira: Rice count, spice verification, picking list correction, and truck capacity.",
            "Manager Mira: Choose one starter tool before you begin. The right tool will shape how you handle the first problem.",
            "Manager Mira: But first, study the product documents near the office. Know your goods before you move them."
          ];
        }

        if (target.name === "Manager Mira" && step.title === "Product Research") {
          return [
            "Manager Mira: Before the warehouse checks, review the product handling information.",
            "Manager Mira: Read the Handling Manual, Customer Order Sheet, Safety Notice, and Cargo Condition Report nearby.",
            "Manager Mira: When you understand the goods, tell me you are ready."
          ];
        }

        if (target.name === "Kai" && step.title === "Rival Challenge 1") {
          return [
            "Kai: Done. I pulled the " + formatRunDataItemLower(d.wrongPickedItem) + " from the mixed spice area and loaded everything in one run.",
            "Kai: Biggest pile first, fastest truck out. That is how you finish before anyone else.",
            "Bram: Fast, maybe. Correct, not necessarily.",
            "Manager Mira: Check his loading plan before this truck leaves.",
            "Narrator: Kai folds his arms beside the truck, impatient for the review to end."
          ];
        }

        if (target.name === "Kai" && rivalState.ravenfordKaiDefeated) {
          return [
            "Kai: Tch. Fine. You caught it this time.",
            "Kai: I moved too fast through the product codes and the truck limit.",
            "Kai: Maybe speed is not enough if the shipment is wrong."
          ];
        }

        if (target.name === "Manager Mira" && step.title === "Ravenford Completion") {
          return [
            "Manager Mira: You handled the village logistics problems and corrected Kai's loading mistake.",
            "Manager Mira: Report what you solved so I can certify your work."
          ];
        }

        if (target.name === "Road to Port Azure") {
          if (ravenford.portRoadUnlocked) {
            return [
              "Narrator: The road to Port Azure is now open.",
              "Narrator: Step onto the blue road tile when you are ready to travel to Port Azure."
            ];
          }

          return [
            "Narrator: The road to Port Azure is still locked.",
            "Manager Mira: Ravenford must be cleared before I open the road."
          ];
        }

        // Context-aware NPC dialogue for the current quest stage.
        const ravenfordCtx = getContextAwareDialogue(target);
        if (ravenfordCtx) return ravenfordCtx;
      }

      if (currentMap.id === "portAzure") {
        if (target.name === "Officer Selene" && sideQuests.seleneSuspiciousContainer.completed) return ["Officer Selene: That container number looked close, but close is not enough at the port.", "Officer Selene: Exact numbers prevent wrong shipment release."];
        if (target.name === "Officer Selene" && sideQuests.seleneSuspiciousContainer.failed) return ["Officer Selene: The container hold has already been handled.", "Officer Selene: Do not trust similar-looking container numbers without exact document matching."];

        if (target.name === "Cargo Release Desk" && step.title === "Missing Documents") {
          return [
            "Cargo Release Desk: The cargo release form is incomplete.",
            "The correct container is " + d.correctContainerCode + ". The wrong similar container is " + d.wrongContainerCode + ".",
            "You must verify both the document and the container number."
          ];
        }

        if (target.name === "Kai" && step.title === "Rival Challenge 2") {
          return [
            "Kai: This container is close enough. The number looks almost the same.",
            "Kai: " + d.wrongContainerCode + " is right beside " + d.correctContainerCode + ". We do not have all day to stare at labels.",
            "Officer Selene: Almost the same is not acceptable at a port.",
            "Officer Selene: Inspect the release document before anyone moves that container.",
            "Narrator: Kai taps the container label impatiently."
          ];
        }

        if (target.name === "Kai" && rivalState.portAzureKaiDefeated) {
          return [
            "Kai: Fine. I saw the numbers too quickly.",
            "Kai: One digit off is still the wrong cargo.",
            "Narrator: Kai looks away from the container, frustrated."
          ];
        }

    function hasRequiredStat(choice) {
      if (!choice.requirement) return true;
      return playerStats[choice.requirement.stat] >= choice.requirement.level;
    }

    function getCurrentRequirementValue(choice) {
      if (!choice.requirement) return 0;
      return playerStats[choice.requirement.stat] || 0;
    }

    function getRequirementStatusText(choice) {
      if (!choice.requirement) return "";
      const statName = choice.requirement.stat;
      const requiredLevel = choice.requirement.level;
      const currentLevel = getCurrentRequirementValue(choice);
      return "Requires " + statName + " " + requiredLevel + " — You have " + statName + " " + currentLevel;
    }

    function getRequirementText(choice) {
      if (!choice.requirement) return "";
      return " [" + getRequirementStatusText(choice) + "]";
    }

    function getChoiceFailureResultLines(choice) {
      const defaultLines = [
        "You lose time and need a different approach."
      ];

      const customLines = choice.failureResultLines || defaultLines;
      const cleanedLines = customLines.filter(function (line) {
        return !line.startsWith("Requirement failed:") && !line.includes("You need ");
      });

      return [getRequirementStatusText(choice)].concat(cleanedLines);
    }

    function formatChoiceText(choice) {
      const lockPrefix = choice.requirement && !hasRequiredStat(choice) ? "LOCKED: " : "";
      return lockPrefix + choice.text + getRequirementText(choice);
    }

    // ===============================
    // TYPEWRITER / ROLLING TEXT HELPERS
    // ===============================

    function playTypingTick(now) {
      if (now - typewriterState.typingBeepTime < 95) return;
      if (typewriterState.visibleChars % 3 !== 0) return;

      typewriterState.typingBeepTime = now;
      playSound("typing");
    }

    function beginTypewriterText(key, text) {
      if (typewriterState.key === key && typewriterState.text === text) return;

      typewriterState.key = key;
      typewriterState.text = text || "";
      typewriterState.visibleChars = 0;
      typewriterState.lastUpdateTime = performance.now();
      typewriterState.choicesVisible = 0;
      typewriterState.lastChoiceRevealTime = typewriterState.lastUpdateTime;
      typewriterState.typingBeepTime = 0;
    }

    function updateTypewriterText(now) {
      if (!typewriterState.text) return;

      if (typewriterState.visibleChars >= typewriterState.text.length) return;

      const elapsed = now - typewriterState.lastUpdateTime;
      if (elapsed < TYPEWRITER_CHAR_DELAY) return;

      const charsToAdd = Math.max(1, Math.floor(elapsed / TYPEWRITER_CHAR_DELAY));
      const previousVisibleChars = typewriterState.visibleChars;

      typewriterState.visibleChars = Math.min(
        typewriterState.text.length,
        typewriterState.visibleChars + charsToAdd
      );

      typewriterState.lastUpdateTime = now;

      if (typewriterState.visibleChars > previousVisibleChars) {
        playTypingTick(now);
      }
    }

    function getVisibleTypewriterText() {
      return typewriterState.text.slice(0, typewriterState.visibleChars);
    }

    function isTypewriterLineComplete() {
      return typewriterState.visibleChars >= typewriterState.text.length;
    }

    function finishTypewriterLine() {
      typewriterState.visibleChars = typewriterState.text.length;
    }

    function updateChoiceReveal(now) {
      if (!activeChoices || !isTypewriterLineComplete()) return;

      if (typewriterState.choicesVisible >= activeChoices.choices.length) return;

      if (now - typewriterState.lastChoiceRevealTime >= CHOICE_REVEAL_DELAY) {
        typewriterState.choicesVisible++;
        typewriterState.lastChoiceRevealTime = now;
        playSound("typing");
      }
    }

    function areAllChoicesVisible() {
      return !activeChoices || typewriterState.choicesVisible >= activeChoices.choices.length;
    }

    function finishChoiceReveal() {
      if (!activeChoices) return;

      finishTypewriterLine();
      typewriterState.choicesVisible = activeChoices.choices.length;
    }

    function canSelectVisibleChoice(choiceIndex) {
      if (!activeChoices) return false;
      return areAllChoicesVisible() && choiceIndex >= 0 && choiceIndex < activeChoices.choices.length;
    }

    function getCurrentDialogueTypingText() {
      if (openingCutscene.active) {
        const cutsceneLine = openingCutscene.lines[openingCutscene.index] || openingCutscene.lines[openingCutscene.lines.length - 1];
        return cutsceneLine ? cutsceneLine.text : "";
      }

      if (activeChoices) {
        return activeChoices.prompt || "";
      }

      if (!activeDialogueTarget) return "";

      const lines = normalizeDialogueLines(activeDialogueTarget.dialogueLines);
      return lines[dialogueLineIndex] || lines[lines.length - 1] || "";
    }

    function getCurrentDialogueTypingKey() {
      if (openingCutscene.active) {
        return "cutscene|" + openingCutscene.index;
      }

      if (activeChoices) {
        const choiceSignature = activeChoices.choices.map(function (choice) {
          return choice.internalChoiceId || choice.text;
        }).join("|");

        return "choices|" + (activeChoices.prompt || "") + "|" + choiceSignature;
      }

      if (activeDialogueTarget) {
        return "dialogue|" + (activeDialogueTarget.name || "Message") + "|" + dialogueLineIndex + "|" + getCurrentDialogueTypingText();
      }

      return "none";
    }

    function updateTypewriterForCurrentFrame(now) {
      const text = getCurrentDialogueTypingText();
      const key = getCurrentDialogueTypingKey();

      beginTypewriterText(key, text);
      updateTypewriterText(now);
      updateChoiceReveal(now);
    }

    function handleRollingTextContinue() {
      if (activeChoices) {
        if (!areAllChoicesVisible()) {
          finishChoiceReveal();
          return true;
        }

        return false;
      }

      if ((openingCutscene.active || activeDialogueTarget) && !isTypewriterLineComplete()) {
        finishTypewriterLine();
        return true;
      }

      return false;
    }

    // ===============================
    // CHOICE RANDOMIZATION HELPERS
    // ===============================

    function shuffleArrayCopy(array) {
      const copy = array.slice();

      for (let i = copy.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[randomIndex];
        copy[randomIndex] = temp;
      }

      return copy;
    }

    function prepareChoiceSet(choiceSet) {
      if (!choiceSet || !choiceSet.choices) return choiceSet;

      return {
        ...choiceSet,
        choices: shuffleArrayCopy(choiceSet.choices).map(function (choice, index) {
          return {
            ...choice,
            internalChoiceId: choice.id || choice.internalChoiceId || choice.text || ("choice-" + index)
          };
        })
      };
    }

    // ===============================
    // PERFORMANCE REPORT SYSTEM
    // ===============================

    let decisionHistory = [];

    function resetDecisionHistory() {
      decisionHistory.length = 0;
    }

    function restoreDecisionHistory(savedDecisions) {
      decisionHistory.length = 0;
      if (!Array.isArray(savedDecisions)) return;
      savedDecisions.forEach(function (entry) {
        if (entry && typeof entry === "object") decisionHistory.push(entry);
      });
    }

    function getDecisionStageLabel(choice) {
      if (choice && choice.sideQuest) {
        const sideQuestStages = {
          linaMislabeledProducts:    "Request — Mislabeled Products (Ravenford)",
          bramPalletInspection:      "Request — Pallet Inspection (Ravenford)",
          rafiAngryCustomer:         "Request — Angry Customer (Ravenford)",
          daroOldRecords:            "Request — Old Warehouse Records (Ravenford)",
          seleneSuspiciousContainer: "Request — Suspicious Container (Port Azure)"
        };
        return sideQuestStages[choice.sideQuest.id] || "Request";
      }
      const step = getCurrentStep();
      if (!step) return "General";
      const titleMap = {
        "Festival Supply Panic":   "Stage 0 — Mission Start",
        "Product Research":        "Stage 0 — Product Research",
        "Rice Count":              "Stage 1 — Inventory Check",
        "Spice Problem":           "Stage 1 — Product Verification",
        "Picking List Error":      "Stage 2 — Order Picking",
        "Truck Capacity Problem":  "Stage 2 — Loading Plan",
        "Rival Challenge 1":       "Stage 2 — Loading Review",
        "Ravenford Completion":    "Stage 2 — Ravenford Report",
        "Road to Port Azure":      "Stage 3 — Route Access",
        "Missing Documents":       "Stage 4 — Document Verification",
        "Rival Challenge 2":       "Stage 4 — Container Check",
        "Damaged Goods":           "Stage 5 — Cargo Handling",
        "Route Decision":          "Stage 5 — Route Planning",
        "Port Azure Completion":   "Stage 6 — Final Port Report"
      };
      return titleMap[step.title] || step.title;
    }

    function getLogisticsConcept(choice) {
      if (choice && choice.sideQuest) {
        const sideQuestConcepts = {
          linaMislabeledProducts:    "Product labelling accuracy — matching shelf labels with product codes",
          bramPalletInspection:      "Pre-loading inspection — identifying unsafe cargo before dispatch",
          rafiAngryCustomer:         "Customer communication — providing accurate delivery information",
          daroOldRecords:            "Record keeping — understanding why system stock and physical stock differ",
          seleneSuspiciousContainer: "Container identification — exact code matching for customs compliance"
        };
        return sideQuestConcepts[choice.sideQuest.id] || "Supply chain decision-making";
      }
      const step = getCurrentStep();
      const conceptMap = {
        "Festival Supply Panic":   "Pre-operation planning — selecting the right logistics tool before beginning",
        "Product Research":        "Product knowledge — understanding goods and handling requirements before moving them",
        "Rice Count":              "Inventory verification — comparing physical stock against system records to find the real shortage",
        "Spice Problem":           "Product verification — using product codes over shelf labels to confirm item identity",
        "Picking List Error":      "Picking accuracy — ensuring the product itself matches the order, not just the quantity",
        "Truck Capacity Problem":  "Transportation planning — managing load capacity and delivery priority across multiple customers",
        "Rival Challenge 1":       "Error identification — recognising wrong-goods loading and capacity planning failures",
        "Ravenford Completion":    "Logistics reporting — documenting all resolved issues clearly to earn certification",
        "Road to Port Azure":      "Operational compliance — completing clearance before advancing in the supply chain",
        "Missing Documents":       "Documentation control — verifying cargo release forms before any shipment is released",
        "Rival Challenge 2":       "Container identification — matching exact codes to prevent wrong shipment release at the port",
        "Damaged Goods":           "Cargo protection — separating damaged stock from clean goods to preserve delivery quality",
        "Route Decision":          "Route risk assessment — balancing speed, safety, and cargo condition in the final delivery leg",
        "Port Azure Completion":   "Final delivery reporting — summarising the full supply chain outcome for certification"
      };
      return (step && conceptMap[step.title]) || "Supply chain management";
    }

    function describeScmEffect(changes) {
      if (!changes || typeof changes !== "object") return "No significant supply chain effect.";
      const parts = [];
      if (changes.stockVerified)                      parts.push("Inventory records confirmed against physical stock");
      if (changes.pickingListCorrected)               parts.push("Picking list corrected, preventing a wrong-goods delivery");
      if (changes.truckLoadedCorrectly === true)      parts.push("Load plan correctly built around truck capacity and delivery priority");
      if (changes.truckLoadedCorrectly === false)     parts.push("Load plan did not fully account for capacity or delivery priority");
      if (changes.documentsVerified)                  parts.push("Cargo release documents verified before the shipment moved");
      if (changes.correctContainerReleased === true)  parts.push("Correct container identified and cleared for release");
      if (changes.correctContainerReleased === false) parts.push("Wrong container selected, introducing a shipment release risk");
      if (changes.damagedGoodsSeparated === true)     parts.push("Damaged goods separated, protecting the condition of the remaining cargo");
      if (changes.damagedGoodsSeparated === false)    parts.push("Damaged goods not fully separated from sellable stock");
      if (changes.damagedGoodsMixed === true)         parts.push("Damaged goods mixed with sellable stock, reducing overall cargo condition");
      if (changes.wrongGoodsLoaded === true)          parts.push("Wrong goods entered the delivery flow, creating a downstream delivery risk");
      if (changes.correctRouteChosen === true)        parts.push("Optimal delivery route selected, preserving cargo condition and timing");
      if (changes.correctRouteChosen === false)       parts.push("Suboptimal delivery route chosen");
      if (typeof changes.cargoCondition === "number" && changes.cargoCondition < 0) {
        parts.push("Cargo condition reduced by " + Math.abs(changes.cargoCondition) + " percentage points");
      }
      if (parts.length === 0) {
        if (changes.scmScore > 0)       parts.push("Supply chain performance improved");
        else if (changes.scmScore < 0)  parts.push("Supply chain performance reduced");
        else return "No significant supply chain effect.";
      }
      return parts.join(". ") + ".";
    }

    function describeTimeEffect(timeChange) {
      if (!timeChange || timeChange === 0) return "No time effect.";
      if (timeChange > 0) return "+" + timeChange + " minutes recovered from the delivery window.";
      return Math.abs(timeChange) + " minutes lost from the delivery window.";
    }

    function describeReputationEffect(statChanges) {
      if (!statChanges || statChanges.Reputation === undefined || statChanges.Reputation === 0) return "No change.";
      return (statChanges.Reputation > 0 ? "+" : "") + statChanges.Reputation + ".";
    }

    function recordDecision(choice, wasCorrect) {
      if (!choice) return;
      const stage    = getDecisionStageLabel(choice);
      const concept  = getLogisticsConcept(choice);
      const isDeferred = !choice.statChanges && !choice.scmChanges && !choice.timeChange &&
                         !choice.failureStatChanges && !choice.sideQuest;

      const scmChanges  = wasCorrect ? (choice.scmChanges || {})
                                     : (choice.failureSCMChanges || choice.scmChanges || {});
      const timeChange  = wasCorrect ? (choice.timeChange || 0)
                                     : (choice.failureTimeChange !== undefined ? choice.failureTimeChange : -3);
      const statChanges = wasCorrect ? (choice.statChanges || {})
                                     : (choice.failureStatChanges || { Reputation: -1 });
      const resultLines = wasCorrect ? (choice.resultLines || [])
                                     : (choice.failureResultLines || []);

      const raw = resultLines.length > 0 ? resultLines[0] : "";
      const resultSummary = raw
        ? raw.replace(/^(Correct|Consequence|Success|Requirement failed):\s*/i, "")
        : (wasCorrect ? "Decision completed successfully." : "Requirement not met for this choice.");

      decisionHistory.push({
        stage:            stage,
        decision:         choice.text || "Decision made",
        concept:          concept,
        outcome:          isDeferred ? "Deferred" : (wasCorrect ? "Correct" : "Requirement not met"),
        result:           resultSummary,
        scmEffect:        isDeferred ? "No action taken at this stage." : describeScmEffect(scmChanges),
        timeEffect:       isDeferred ? "No time effect." : describeTimeEffect(timeChange),
        reputationEffect: isDeferred ? "No change." : describeReputationEffect(statChanges),
        isSideQuest:      Boolean(choice.sideQuest)
      });
    }

      function yn(v, goodWhenTrue) {
        const isGood = goodWhenTrue ? Boolean(v) : !Boolean(v);
        return "<span class=\"rv " + (isGood ? "good" : "bad") + "\">" + e(formatYesNo(v)) + "</span>";
      }
      function rv(v)  { return "<span class=\"rv\">" + e(v) + "</span>"; }

      // ── A. Final Result rows ────────────────────────────────────────────────
      const festivalRecord = getFestivalOutcomeRecord();
      const resultRowsHTML = [

      ].map(function (row) {

      // ── B. Player Stats ─────────────────────────────────────────────────────
      const statsHTML = ["Planning","Inventory","Warehouse","Transport","Negotiation","Reputation","Coins"]
        .map(function (s) {

        }).join("");

      // ── C. Decision History ─────────────────────────────────────────────────
      let decisionsHTML;
      if (!decisionHistory.length) {
        decisionsHTML = "<p class=\"empty\">No decisions were recorded for this run.</p>";
      } else {
        decisionsHTML = decisionHistory.map(function (entry, i) {
          const cls = entry.outcome === "Correct" ? "" :

                           entry.outcome === "Deferred" ? "deferred" : "wrong";
          return [
            "<div class=\"de" + cls + "\">",
              "<div class=\"dn\">Decision " + (i + 1) + " of " + decisionHistory.length +

              "<div class=\"dr\">",
                "<div><span class=\"drl\">Logistics Concept</span><div class=\"drv\">" + e(entry.concept) + "</div></div>",
                "<div><span class=\"drl\">Result</span><div class=\"drv\">" + e(entry.result) + "</div></div>",
                "<div><span class=\"drl\">Supply Chain Effect</span><div class=\"drv\">" + e(entry.scmEffect) + "</div></div>",
                "<div><span class=\"drl\">Time Effect</span><div class=\"drv\">" + e(entry.timeEffect) + "</div></div>",
                "<div><span class=\"drl\">Reputation Effect</span><div class=\"drv\">" + e(entry.reputationEffect) + "</div></div>",
              "</div>",
            "</div>"
          ].join("");
        }).join("");
      }

      // ── D. Mistake History ──────────────────────────────────────────────────
      let mistakesHTML;
      if (!questLogState.mistakes.length) {
        mistakesHTML = "<p class=\"good-note\">No major logistics mistakes recorded during this run.</p>";
      } else {
        mistakesHTML = "<ul class=\"ml\">" +
          questLogState.mistakes.map(function (m) { return "<li>" + e(m) + "</li>"; }).join("") +
          "</ul>";
      }

      // ── E. Clues Discovered ─────────────────────────────────────────────────
      const filteredClues = questLogState.clues.filter(function (c) { return c && c.trim(); });
      let cluesHTML;
      if (!filteredClues.length) {
        cluesHTML = "<p class=\"empty\">No clues were collected. Exploring more areas and interactive objects will reveal additional findings.</p>";
      } else {
        cluesHTML = "<ul class=\"cl\">" +
          filteredClues.map(function (c) { return "<li>" + e(c) + "</li>"; }).join("") +
          "</ul>";
      }
      const containerNote = (d && d.correctContainerCode && d.wrongContainerCode)
        ? "<p class=\"note\">Container " + e(d.correctContainerCode) + " was the correct shipment. Container " +
          e(d.wrongContainerCode) + " was the look-alike that needed to be rejected.</p>"
        : "";

      // ── F. Learning Summary ─────────────────────────────────────────────────
      const lessons = [
        "Inventory records must be verified against physical stock. A system count is a starting point, not a final answer.",
        "Product identity matters as much as quantity. Picking the right number of the wrong item is still a picking error.",
        "Picking accuracy prevents wrong deliveries. Always check the product code, not just the shelf label.",
        "Damaged goods must be separated from clean goods before loading. Mixing them puts the entire shipment at risk.",
        "Container documents must match the physical shipment exactly. A similar-looking number is not the same as the correct number.",
        "Time is a logistics resource. Delays caused by poor verification, wrong documents, or re-work reduce supply chain performance.",
        "Reaching the destination is not the same as successful logistics. The process must protect goods, documents, accuracy, and trust at every stage.",
        "Festival Grounds shows that final customers judge the whole supply chain, not just whether the truck arrived."
      ];
      const lessonsHTML = lessons.map(function (l, i) {
        return "<div class=\"le\"><span class=\"ln\">" + (i + 1) + ".</span>" + e(l) + "</div>";
      }).join("");

      // ── Assemble ────────────────────────────────────────────────────────────
      const css = [
        "*{box-sizing:border-box;margin:0;padding:0}",

        ".sc{background:#f6f4ef;border:1px solid #e0dbd0;padding:11px 14px;text-align:center}",
        ".sn{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:4px}",

        ".de.wrong{border-left-color:#8b1a1a;background:#fff8f8}",

        ".de.deferred{border-left-color:#bbb;background:#f4f4f0}",
        ".dn{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:3px}",
        ".ds{font-size:11px;color:#777;margin-bottom:4px}",
        ".dt{font-size:14px;font-weight:700;color:#1b2b3a;margin-bottom:10px}",
        ".dr{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:13px}",
        ".drl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:2px}",

        ".ob.correct{background:#e4f0e8;color:#246e38}",
        ".ob.wrong{background:#fce8e8;color:#8b1a1a}",
        ".ob.deferred{background:#eee;color:#777}",
        ".ml,.cl{padding-left:20px}",
        ".ml li{margin-bottom:6px;font-size:14px;color:#6b1a1a}",
        ".cl li{margin-bottom:6px;font-size:14px;line-height:1.45}",
        ".le{padding:9px 14px;margin-bottom:7px;background:#f2f8ef;border-left:3px solid #246e38;font-size:14px;line-height:1.55}",
        ".ln{font-weight:700;color:#246e38;margin-right:5px}",

        ".ft{padding:14px 38px;background:#f4f2ed;border-top:1px solid #e0dbd0;font-size:11px;color:#999;text-align:center}",

        "<div class=\"sec\"><div class=\"st\">A. Final Result</div><div class=\"rg\">" + resultRowsHTML + "</div></div>\n" +
        "<div class=\"sec\"><div class=\"st\">B. Player Stats</div><div class=\"sg\">" + statsHTML + "</div></div>\n" +

        "<div class=\"sec\"><div class=\"st\">C. Decision History (" + decisionHistory.length + " decisions recorded)</div>" +
          decisionsHTML + "</div>\n" +

          cluesHTML + containerNote + "</div>\n" +

        (function() {
          const fr = getFestivalOutcomeRecord();
          const festivalItems = [
            "Inspection Result: " + fr.inspectionResult,
            "Goods Accepted: " + fr.cargoAccepted,
            "Visible Consequence: " + fr.outcome,
            "Final Logistics Lesson: delivery success requires correct goods, clean cargo, matching documents, timing, and trust."
          ];
          const festivalHTML = "<ul class=\"cl\">" + festivalItems.map(function(i) { return "<li>" + e(i) + "</li>"; }).join("") + "</ul>";

    function showPerformanceReportFallback(html) {
      const popup = window.open("", "_blank");

      if (popup && popup.document) {
        popup.document.open();
        popup.document.write(html);
        popup.document.close();
        return;
      }

      const host = endScreen || document.body;
      let fallback = document.getElementById("performance-report-fallback");

      if (!fallback) {
        fallback = document.createElement("div");
        fallback.id = "performance-report-fallback";
        fallback.style.margin = "14px auto 0";
        fallback.style.maxWidth = "900px";
        fallback.style.border = "2px solid #e8dfb5";
        fallback.style.background = "rgba(17,24,39,0.96)";
        fallback.style.padding = "12px";
        fallback.style.color = "#f8fafc";
        fallback.style.fontFamily = "Courier New, monospace";
        host.appendChild(fallback);
      }

      fallback.innerHTML = "";

      const message = document.createElement("div");
      message.textContent = "Copy this report manually.";
      message.style.color = "#ffeb70";
      message.style.fontWeight = "bold";
      message.style.marginBottom = "8px";
      fallback.appendChild(message);

      const textarea = document.createElement("textarea");
      textarea.value = html;
      textarea.style.width = "100%";
      textarea.style.minHeight = "220px";
      textarea.style.fontFamily = "Courier New, monospace";
      textarea.style.fontSize = "12px";
      textarea.style.padding = "8px";
      textarea.style.color = "#111827";
      textarea.style.background = "#f8fafc";
      fallback.appendChild(textarea);
      textarea.focus();
      textarea.select();
    }

    function downloadPerformanceReport() {
      const html = generatePerformanceReportHTML();

      try {
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");

        a.href = url;
        a.download = "routebound_performance_report.html";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();

        setTimeout(function () {
          if (a.parentNode) {
            a.parentNode.removeChild(a);
          }
        }, 0);

        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);

        return true;
      } catch (error) {
        console.warn("Performance report download failed:", error);
        showPerformanceReportFallback(html);
        return false;
      }
    }

    window.downloadPerformanceReport = downloadPerformanceReport;


    // ===============================
    // RAVENFORD → PORT AZURE CARRY-OVER
    // ===============================

    let portCarryOverSceneShown = false;

    function resetPortCarryOver() {
      portCarryOverSceneShown = false;
    }

    // True when Ravenford had significant unresolved issues.
    function ravenfordHadMajorIssues() {
      return Boolean(
        scmPerformance.wrongGoodsLoaded ||
        scmPerformance.damagedGoodsMixed ||
        !scmPerformance.truckLoadedCorrectly ||
        scmPerformance.cargoCondition < 70 ||
        playerStats.Reputation <= 0
      );
    }

    // True when Ravenford was handled cleanly across the key checks.
    function ravenfordWasClean() {
      return Boolean(
        scmPerformance.stockVerified &&
        scmPerformance.pickingListCorrected &&
        scmPerformance.truckLoadedCorrectly &&

    function getContextAwareDialogue(target) {
      const step = getCurrentStep();
      if (!step) return null;
      const mapTable = NPC_CONTEXT_DIALOGUE[currentMap.id];

    function getFestivalOutcomeRecord() {
      const rank = getFinalRank();
      const wrongGoods = wrongGoodsWereDelivered();
      const damagedMixed = Boolean(scmPerformance.damagedGoodsMixed);
      const badCondition = scmPerformance.cargoCondition < 70;
      const late = Boolean(scmPerformance.deadlineFailed) || scmPerformance.timeLost >= 8;
      const wrongContainer = !scmPerformance.correctContainerReleased;

      if (rank === "Failed SCM Ending" || wrongGoods || (damagedMixed && scmPerformance.cargoCondition < 75) || wrongContainer || scmPerformance.cargoCondition < 50) {
        return {
          outcome: "Failed SCM Ending",
          cargoAccepted: "Rejected",
          vendorSatisfaction: "Low",
          inspectionResult: "Rejected or incomplete shipment; critical logistics failure reached the final customer."
        };
      }

      if (rank === "S Rank" || rank === "A Rank") {
        return {
          outcome: "Festival runs smoothly",
          cargoAccepted: "Full",
          vendorSatisfaction: "High",
          inspectionResult: "Goods, documents, condition, timing, and trust are acceptable."
        };
      }

      if (badCondition || late || scmPerformance.wrongGoodsLoaded || damagedMixed || playerStats.Reputation <= 1) {
        return {
          outcome: "Festival opens with complaints",
          cargoAccepted: "Partial",
          vendorSatisfaction: "Medium",
          inspectionResult: "Delivery succeeds, but inspection records delays, risk, or partial cargo concern."
        };
      }

      return {
        outcome: "Festival continues",
        cargoAccepted: "Full",
        vendorSatisfaction: "Medium",
        inspectionResult: "Shipment accepted, with minor process improvements recommended."
      };
    }

    function storeFestivalOutcome() {
      const record = getFestivalOutcomeRecord();
      festivalGrounds.outcome = record.outcome;
      festivalGrounds.cargoAccepted = record.cargoAccepted;
      festivalGrounds.vendorSatisfaction = record.vendorSatisfaction;
      festivalGrounds.inspectionResult = record.inspectionResult;
      return record;
    }

    function getFestivalInspectionLines() {
      const lines = [
        "Festival Organizer: The shipment has reached Festival Grounds. Bring it to the inspection table.",
        "Festival Organizer: We will check the goods, the cargo condition, the documents, and whether this delivery can be trusted."
      ];

      if (wrongGoodsWereDelivered()) {
        lines.push("Festival Organizer: These boxes do not match the festival order. We cannot accept the wrong product.");
        lines.push("Vendor Leader: This is not the spice order we requested. The stall cannot open with the wrong goods.");
      } else if (scmPerformance.wrongGoodsLoaded) {
        lines.push("Vendor Leader: The earlier wrong spice load was caught before final delivery, but it still delayed the festival setup.");
      }

      if (scmPerformance.damagedGoodsMixed) {
        lines.push("Festival Organizer: The oil leaked into the dry goods. These cannot be used safely.");
      } else if (scmPerformance.damagedGoodsSeparated) {
        lines.push("Festival Organizer: The damaged goods were kept away from the clean cargo. That kept the rest usable.");
      }

      if (scmPerformance.cargoCondition < 70) {
        lines.push("Vendor Leader: Some goods arrived in poor condition. We can only accept part of the shipment.");
      }

      if (scmPerformance.deadlineFailed || scmPerformance.timeLost >= 8) {
        lines.push("Vendor Leader: The delivery arrived too late. Vendors were already waiting.");
      }

      if (!scmPerformance.correctContainerReleased) {
        lines.push("Festival Organizer: This shipment document does not match the cargo. The delivery cannot be approved.");
      }

      if (!scmPerformance.documentsVerified) {
        lines.push("Festival Organizer: These papers were not checked cleanly. That makes the approval harder.");
      }

      if (!lines.some(function (line) { return line.indexOf("cannot accept") !== -1 || line.indexOf("cannot be approved") !== -1 || line.indexOf("poor condition") !== -1 || line.indexOf("too late") !== -1 || line.indexOf("leaked") !== -1; })) {
        lines.push("Festival Organizer: The goods match the order, the cargo is clean, and the delivery arrived in time.");
      }

      const record = storeFestivalOutcome();
      if (record.cargoAccepted === "Full") {
        lines.push("Vendor Leader: The stalls can open. Turn on the festival lights.");
        lines.push("Merchant Rafi: Thank you. The order arrived in a condition my vendors can actually use.");
      } else if (record.cargoAccepted === "Partial") {
        lines.push("Vendor Leader: Some stalls can open, but delays and cargo concerns will cause complaints.");
        lines.push("Festival Organizer: We can continue, but this delivery gave us more trouble than it should have.");
      } else {
        lines.push("Vendor Leader: The vendors cannot use this shipment as planned.");
        lines.push("Manager Mira: Reaching the destination is not the same as successful logistics.");
      }

      if (getFinalRank() === "S Rank" || getFinalRank() === "A Rank") {
        lines.push("Kai: I thought speed was everything. I was wrong. You managed the whole chain.");
      } else {
        lines.push("Kai: We got here, but the mistakes followed us all the way.");
      }

    function showChoiceResult(lines) {
      const portraitSpeaker = activeDialogueTarget && activeDialogueTarget.name && activeDialogueTarget.name !== "Choice Result"
        ? activeDialogueTarget.name
        : null;

      activeDialogueTarget = {
        name: portraitSpeaker || "Choice Result",

      dialogueIsChoiceResult = true;
