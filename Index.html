<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROUTEBOUND: The Warehouse Trial</title>
  <style>
    :root {
      --gb-dark: #111827;
      --gb-frame: #e8dfb5;
      --panel-bg: #111827;
      --panel-border: #e8dfb5;
      --panel-soft: #1f2937;
      --panel-text: #f8fafc;
      --panel-muted: #cbd5e1;
      --panel-accent: #ffeb70;
      --panel-good: #9be28f;
      --panel-bad: #ff7777;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 45%, #4b5567 0%, #242b3a 48%, #0f141d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Courier New", monospace;
      overflow: hidden;
      color: var(--panel-text);
    }

    #game-wrapper {
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 14px;
    }

    #gui-panel {
      order: 1;
      width: 380px;
      height: 480px;
      flex: 0 0 380px;
      border: 7px solid var(--gb-dark);
      outline: 4px solid var(--gb-frame);
      background: rgba(17, 24, 39, 0.98);
      box-shadow:
        0 0 0 8px #2b3344,
        0 20px 42px rgba(0, 0, 0, 0.45),
        inset 0 0 0 2px rgba(255,255,255,0.08);
      padding: 10px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--panel-accent) #1f2937;
    }

    canvas {
      order: 2;
      width: 640px;
      height: 480px;
      flex: 0 0 auto;
      border: 7px solid var(--gb-dark);
      outline: 4px solid var(--gb-frame);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #8fbc62;
      box-shadow:
        0 0 0 8px #2b3344,
        0 20px 42px rgba(0, 0, 0, 0.58),
        inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .gui-section {
      border: 2px solid var(--panel-border);
      background: rgba(31, 41, 55, 0.86);
      margin-bottom: 10px;
      padding: 9px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    }

    .gui-title {
      color: var(--panel-accent);
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gui-text,
    .objective-line {
      font-size: 12px;
      line-height: 1.35;
      color: var(--panel-text);
      white-space: normal;
    }

    .gui-muted {
      color: var(--panel-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .quest-row {
      display: block;
      padding: 4px 5px;
      margin: 3px 0;
      font-size: 11px;
      line-height: 1.3;
      background: rgba(255,255,255,0.035);
      border-left: 3px solid transparent;
    }

    .quest-row.current {
      border-left-color: var(--panel-accent);
      background: rgba(255,235,112,0.12);
      color: var(--panel-accent);
      font-weight: bold;
    }

    .quest-row.done {
      border-left-color: var(--panel-good);
      color: var(--panel-good);
    }

    .quest-log-section {
      border-top: 1px solid rgba(255,255,255,0.10);
      margin-top: 9px;
      padding-top: 8px;
    }

    .quest-log-heading {
      color: var(--panel-accent);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .quest-log-entry {
      display: block;
      padding: 4px 5px;
      margin: 3px 0;
      font-size: 11px;
      line-height: 1.32;
      background: rgba(255,255,255,0.035);
      border-left: 3px solid rgba(203, 213, 225, 0.35);
      color: var(--panel-text);
    }

    .quest-log-entry.clue { border-left-color: #4aa3ff; }
    .quest-log-entry.hint { border-left-color: var(--panel-accent); color: var(--panel-muted); }
    .quest-log-entry.mistake { border-left-color: var(--panel-bad); color: #ffd0d0; }
    .quest-log-entry.side { border-left-color: #9be28f; }
    .quest-log-entry.failed { border-left-color: var(--panel-bad); color: #ffd0d0; }
    .quest-log-entry.empty { color: var(--panel-muted); font-style: italic; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      font-size: 12px;
    }

    .stat-value {
      color: var(--panel-accent);
      font-weight: bold;
      text-align: right;
    }

    .cert-list { display: grid; gap: 5px; }

    .cert-card {
      border: 2px solid #7a4a23;
      background: #f8e7b0;
      color: #17202a;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: bold;
    }

    .cert-card.locked {
      border-color: #64748b;
      background: #334155;
      color: #cbd5e1;
      font-weight: normal;
    }

    .rank {
      color: var(--panel-accent);
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      margin: 7px 0;
    }

    .final-stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      padding: 3px 0;
      font-size: 12px;
    }


    #end-screen {
      display: none;
      width: 100vw;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 42%, #3f4a38 0%, #1f2b2f 45%, #10131a 100%);
    }

    body.end-state {
      display: block;
      width: 100vw;
      min-height: 100vh;
    }

    body.end-state #game-wrapper,
    body.end-state #gameCanvas,
    body.end-state #gui-panel,
    .gameplay-view-hidden {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    body.end-state #end-screen {
      display: flex !important;
      position: fixed;
      inset: 0;
      z-index: 100;
    }

    .end-card {
      width: min(980px, calc(100vw - 48px));
      max-height: calc(100vh - 48px);
      border: 8px solid var(--gb-dark);
      outline: 5px solid var(--gb-frame);
      background: rgba(17, 24, 39, 0.98);
      box-shadow:
        0 0 0 9px #2b3344,
        0 22px 46px rgba(0, 0, 0, 0.55),
        inset 0 0 0 2px rgba(255,255,255,0.08);
      padding: 18px;
      color: var(--panel-text);
      overflow: hidden;
    }

    .end-header {
      text-align: center;
      border: 3px solid var(--panel-border);
      background: #10131a;
      padding: 14px 12px 12px;
      margin-bottom: 14px;
    }

    .end-kicker {
      color: var(--panel-good);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .end-title {
      color: var(--panel-accent);
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .end-subtitle {
      color: var(--panel-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .end-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 14px;
      align-items: start;
    }

    .end-section {
      border: 2px solid var(--panel-border);
      background: rgba(31, 41, 55, 0.88);
      padding: 11px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    }

    .end-section-title {
      color: var(--panel-accent);
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .end-rank {
      color: var(--panel-accent);
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      margin: 2px 0 8px;
    }

    .end-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      padding: 5px 0;
      font-size: 13px;
    }

    .end-row strong {
      color: var(--panel-accent);
      text-align: right;
      white-space: nowrap;
    }

    .end-dialogue-line,
    .end-lesson {
      font-size: 13px;
      line-height: 1.38;
      margin: 0 0 7px;
    }

    .end-lesson {
      border-left: 3px solid var(--panel-good);
      background: rgba(255,255,255,0.035);
      padding: 6px 8px;
    }

    .end-controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--panel-muted);
      font-size: 12px;
      text-align: center;
    }

    .end-controls strong {
      color: var(--panel-accent);
    }

    .learning-card {
      width: min(860px, calc(100vw - 48px));
    }

    .learning-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    @media (max-width: 760px) {
      .end-grid,
      .learning-list {
        grid-template-columns: 1fr;
      }

      .end-card {
        overflow-y: auto;
      }
    }


    #sound-toggle {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 160;
      border: 2px solid rgba(232, 223, 181, 0.72);
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.86);
      color: #ffeb70;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.4px;
      padding: 8px 11px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    #sound-toggle:focus-visible {
      outline: 2px solid #9be28f;
      outline-offset: 3px;
    }

    #sound-toggle.sound-muted {
      color: #cbd5e1;
      border-color: rgba(203, 213, 225, 0.46);
      background: rgba(31, 41, 55, 0.82);
    }


    /* ===============================
       FULL-SCREEN INTRO PRESENTATION
       =============================== */

    body.intro-state,
    body.end-state {
      display: block;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
    }

    #intro-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      width: 100vw;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 18%, rgba(74, 163, 255, 0.22), transparent 28%),
        radial-gradient(circle at 76% 24%, rgba(255, 235, 112, 0.14), transparent 24%),
        linear-gradient(135deg, #060914 0%, #101827 48%, #08111a 100%);
      color: var(--panel-text);
    }

    body.intro-state #game-wrapper,
    body.intro-state #gameCanvas,
    body.intro-state #gui-panel,
    body.intro-state #end-screen {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    body.intro-state #intro-screen {
      display: flex !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    body.end-state #intro-screen {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .intro-bg-grid {
      position: absolute;
      inset: -2px;
      opacity: 0.26;
      background-image:
        linear-gradient(rgba(232, 223, 181, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 223, 181, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 76%);
    }

    .intro-card {
      position: relative;
      width: min(960px, calc(100vw - 56px));
      min-height: min(560px, calc(100vh - 56px));
      border: 1px solid rgba(232, 223, 181, 0.36);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(17, 24, 39, 0.94), rgba(8, 13, 24, 0.96));
      box-shadow:
        0 0 0 1px rgba(255, 235, 112, 0.16),
        0 0 34px rgba(74, 163, 255, 0.18),
        0 28px 80px rgba(0, 0, 0, 0.58),
        inset 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
      padding: clamp(30px, 5vw, 54px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .intro-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.06) 42%, transparent 58%);
      transform: translateX(-115%);
      animation: intro-sheen 5s ease-in-out infinite;
      pointer-events: none;
    }

    .intro-kicker {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(155, 226, 143, 0.35);
      border-radius: 999px;
      background: rgba(155, 226, 143, 0.08);
      color: #9be28f;
      font-size: clamp(12px, 1.2vw, 14px);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .intro-title {
      position: relative;
      margin: 0;
      color: #ffeb70;
      font-size: clamp(58px, 9vw, 108px);
      line-height: 0.9;
      letter-spacing: clamp(4px, 1vw, 12px);
      text-shadow:
        0 0 18px rgba(255, 235, 112, 0.42),
        0 0 44px rgba(255, 235, 112, 0.16);
      animation: title-pulse 2.8s ease-in-out infinite;
    }

    .intro-subtitle {
      position: relative;
      margin-top: 18px;
      color: #f8fafc;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .intro-tagline {
      position: relative;
      margin-top: 16px;
      color: #cbd5e1;
      font-size: clamp(14px, 1.8vw, 18px);
      letter-spacing: 1px;
    }

    .intro-action {
      position: relative;
      margin-top: 34px;
      padding: 13px 22px;
      border: 1px solid rgba(255, 235, 112, 0.45);
      border-radius: 14px;
      background: rgba(255, 235, 112, 0.09);
      color: #ffeb70;
      font-size: clamp(15px, 1.8vw, 18px);
      font-weight: bold;
      box-shadow: 0 0 18px rgba(255, 235, 112, 0.12);
      animation: action-blink 1.45s ease-in-out infinite;
    }

    .route-visual {
      position: relative;
      width: min(620px, 80vw);
      height: 92px;
      margin-top: 34px;
    }

    .route-line {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 44px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(74,163,255,0.25), rgba(255,235,112,0.95), rgba(155,226,143,0.55));
      box-shadow: 0 0 18px rgba(74,163,255,0.35);
      overflow: hidden;
    }

    .route-line::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 32%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      animation: route-scan 2.2s linear infinite;
    }

    .route-dot {
      position: absolute;
      top: 34px;
      width: 24px;
      height: 24px;
      border: 4px solid #ffeb70;
      border-radius: 50%;
      background: #101827;
      box-shadow: 0 0 18px rgba(255,235,112,0.45);
    }

    .route-dot:nth-child(2) { left: 5%; }
    .route-dot:nth-child(3) { left: 48%; border-color: #4aa3ff; box-shadow: 0 0 18px rgba(74,163,255,0.45); }
    .route-dot:nth-child(4) { right: 5%; border-color: #9be28f; box-shadow: 0 0 18px rgba(155,226,143,0.45); }

    .truck-icon {
      position: absolute;
      top: 18px;
      left: 3%;
      width: 72px;
      height: 38px;
      animation: truck-move 4.2s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255,235,112,0.28));
    }

    .truck-body {
      position: absolute;
      left: 0;
      top: 7px;
      width: 48px;
      height: 24px;
      border-radius: 5px 3px 3px 5px;
      background: #ffeb70;
    }

    .truck-cab {
      position: absolute;
      left: 46px;
      top: 12px;
      width: 22px;
      height: 19px;
      border-radius: 3px 7px 3px 2px;
      background: #4aa3ff;
    }

    .truck-wheel {
      position: absolute;
      bottom: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #050814;
      border: 2px solid #cbd5e1;
    }

    .truck-wheel.one { left: 10px; }
    .truck-wheel.two { left: 50px; }

    .cargo-float {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, rgba(255,235,112,0.9), rgba(177,126,38,0.9));
      box-shadow: 0 12px 22px rgba(0,0,0,0.22);
      animation: cargo-float 4s ease-in-out infinite;
    }

    .cargo-float.a { left: 9%; top: 13%; animation-delay: 0s; }
    .cargo-float.b { right: 12%; top: 17%; animation-delay: 0.8s; transform: scale(0.84); }
    .cargo-float.c { left: 16%; bottom: 12%; animation-delay: 1.5s; transform: scale(0.72); }
    .cargo-float.d { right: 18%; bottom: 14%; animation-delay: 2.1s; transform: scale(0.9); }

    .loading-title {
      position: relative;
      color: #f8fafc;
      font-size: clamp(26px, 4vw, 46px);
      line-height: 1.15;
      margin: 0 0 28px;
    }

    .loading-subtext {
      position: relative;
      color: #cbd5e1;
      font-size: clamp(13px, 1.5vw, 16px);
      margin-bottom: 24px;
    }

    .modern-loader {
      position: relative;
      width: min(660px, 78vw);
      height: 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,235,112,0.4);
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 24px rgba(74,163,255,0.12);
    }

    .modern-loader-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4aa3ff, #ffeb70, #9be28f);
      box-shadow: 0 0 18px rgba(255,235,112,0.5);
      transition: width 90ms linear;
    }

    .loading-metrics {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      color: #cbd5e1;
      font-size: clamp(12px, 1.4vw, 14px);
    }

    .metric-pill {
      padding: 7px 10px;
      border: 1px solid rgba(203,213,225,0.18);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
    }

    .briefing-card {
      align-items: stretch;
      text-align: left;
      width: min(900px, calc(100vw - 56px));
      min-height: auto;
    }

    .briefing-card .intro-kicker,
    .briefing-card .intro-action {
      align-self: center;
    }

    .briefing-title {
      position: relative;
      margin: 0 0 20px;
      text-align: center;
      color: #ffeb70;
      font-size: clamp(34px, 5.5vw, 62px);
      letter-spacing: 2px;
      text-shadow: 0 0 22px rgba(255,235,112,0.24);
    }

    .briefing-text {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      color: #f8fafc;
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.62;
    }

    .scan-panel {
      position: relative;
      width: min(620px, 80vw);
      height: 72px;
      margin: 0 auto 30px;
      border-radius: 18px;
      border: 1px solid rgba(74,163,255,0.28);
      background: rgba(74,163,255,0.055);
      overflow: hidden;
    }

    .scan-panel::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 90px;
      background: linear-gradient(90deg, transparent, rgba(155,226,143,0.35), transparent);
      animation: route-scan 1.8s linear infinite;
    }

    .container-stack {
      position: absolute;
      inset: 17px 22px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }

    .container-block {
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,235,112,0.78), rgba(74,163,255,0.58));
    }

    @keyframes intro-sheen {
      0%, 45% { transform: translateX(-115%); }
      70%, 100% { transform: translateX(115%); }
    }

    @keyframes title-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.22); }
    }

    @keyframes action-blink {
      0%, 100% { opacity: 0.78; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1px); }
    }

    @keyframes route-scan {
      from { transform: translateX(-120%); }
      to { transform: translateX(420%); }
    }

    @keyframes truck-move {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(min(470px, 61vw)); }
    }

    @keyframes cargo-float {
      0%, 100% { translate: 0 0; rotate: -3deg; }
      50% { translate: 0 -14px; rotate: 4deg; }
    }

    @media (max-width: 760px) {
      #intro-screen { padding: 16px; }
      .intro-card { width: calc(100vw - 32px); min-height: calc(100vh - 32px); border-radius: 20px; }
      .route-visual { width: 84vw; }
      .cargo-float { display: none; }

    function syncViewForGameState() {
      const introState = ["loading", "title", "briefing", "rankHistory", "newGameConfirm"].includes(gameState);
      const endingState = gameState === "finalScore" || gameState === "learningSummary";
      const gameplayHidden = introState || endingState;

      document.body.classList.toggle("intro-state", introState);
      document.body.classList.toggle("end-state", endingState);

      if (gameWrapper) {
        gameWrapper.hidden = gameplayHidden;
        gameWrapper.classList.toggle("gameplay-view-hidden", gameplayHidden);
        gameWrapper.style.display = gameplayHidden ? "none" : "flex";
      }

      if (canvas) {
        canvas.hidden = gameplayHidden;
        canvas.classList.toggle("gameplay-view-hidden", gameplayHidden);
        canvas.setAttribute("aria-hidden", gameplayHidden ? "true" : "false");
      }

      if (guiPanel) {
        guiPanel.hidden = gameplayHidden;
        guiPanel.classList.toggle("gameplay-view-hidden", gameplayHidden);
        guiPanel.setAttribute("aria-hidden", gameplayHidden ? "true" : "false");

        if (introState || endingState) {
          guiPanel.innerHTML = "";
        }
      }

      if (introScreen) {
        introScreen.hidden = !introState;
        introScreen.style.display = introState ? "flex" : "none";

        if (!introState) {
          introScreen.innerHTML = "";
        }
      }

      if (endScreen) {
        endScreen.hidden = !endingState;
        endScreen.style.display = endingState ? "flex" : "none";

        if (!endingState) {
          endScreen.innerHTML = "";
        }
      }

      if (gameplayHidden && ctx) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function setGameState(newState) {
      const previousState = gameState;
      gameState = newState;
      syncViewForGameState();

      if (!isEndGameState()) {
        renderedEndScreenKey = "";
      } else if (newState !== previousState && typeof renderEndScreen === "function") {
        renderEndScreen(true);
      }

      if (introScreen && ["loading", "title", "briefing", "rankHistory", "newGameConfirm"].includes(gameState)) {
        if (typeof renderIntroScreen === "function") {
          renderIntroScreen(performance.now());
        }
      }
    }

      getContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          return null;
        }

        try {
          if (!this.context) {
            this.context = new AudioContextClass();
          }

          if (!this.masterGain) {
            this.masterGain = this.context.createGain();
            this.masterGain.gain.value = this.muted ? 0 : this.masterVolume;
            this.masterGain.connect(this.context.destination);
          }

          if (!this.sfxGain) {
            this.sfxGain = this.context.createGain();
            this.sfxGain.gain.value = 1;
            this.sfxGain.connect(this.masterGain);
          }

          if (!this.musicGain) {
            this.musicGain = this.context.createGain();
            this.musicGain.gain.value = 1;
            this.musicGain.connect(this.masterGain);
          }

          return this.context;
        } catch (error) {
          console.warn("Audio context failed:", error);
          return null;
        }
      },

      initFromUserGesture() {
        const audio = this.getContext();
        if (!audio) return;

        try {
          if (audio.state === "suspended") {
            const resumeResult = audio.resume();
            if (resumeResult && typeof resumeResult.catch === "function") {
              resumeResult.catch(function () {
                // Sound should never block gameplay.
              });
            }
          }

          this.ready = true;
          updateSoundToggleButton();
          this.switchMusic(this.desiredMusic || getDesiredMusicTrack());
        } catch (error) {
          console.warn("Audio initialization failed:", error);
        }
      },

      setMuted(muted) {
        this.muted = Boolean(muted);
        const audio = this.getContext();

        if (audio && this.masterGain) {
          this.masterGain.gain.cancelScheduledValues(audio.currentTime);
          this.masterGain.gain.setTargetAtTime(
            this.muted ? 0 : this.masterVolume,
            audio.currentTime,
            0.03
          );
        }

        updateSoundToggleButton();

        if (!this.muted) {
          this.switchMusic(this.desiredMusic || getDesiredMusicTrack());
        }
      },

      toggleMute() {
        this.initFromUserGesture();
        this.setMuted(!this.muted);

        if (!this.muted) {
          this.playSfx("menuConfirm");

      noteToFrequency(noteName) {
        if (!noteName) return 0;

        const match = String(noteName).match(/^([A-G])(#|b)?(\d)$/);
        if (!match) return 0;

        const offsets = {
          C: -9,
          D: -7,
          E: -5,
          F: -4,
          G: -2,
          A: 0,
          B: 2
        };

        let semitone = offsets[match[1]];
        if (match[2] === "#") semitone += 1;
        if (match[2] === "b") semitone -= 1;

        const octave = Number(match[3]);
        const distanceFromA4 = semitone + (octave - 4) * 12;
        return 440 * Math.pow(2, distanceFromA4 / 12);
      },

      playTone(frequency, duration, type = "square", volume = 0.04, delay = 0, destination = null, slideToFrequency = null) {
        if (this.muted || !frequency) return;

        const audio = this.getContext();
        if (!audio) return;

        try {
          const oscillator = audio.createOscillator();
          const gain = audio.createGain();
          const startTime = audio.currentTime + delay;
          const endTime = startTime + duration;
          const safeVolume = Math.max(0.0001, volume);

          oscillator.type = type;
          oscillator.frequency.setValueAtTime(frequency, startTime);

          if (slideToFrequency) {
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, slideToFrequency), endTime);
          }

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(safeVolume, startTime + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, endTime);

          oscillator.connect(gain);
          gain.connect(destination || this.sfxGain || this.masterGain || audio.destination);

          oscillator.start(startTime);
          oscillator.stop(endTime + 0.035);
        } catch (error) {
          console.warn("Tone sound failed:", error);
        }
      },

      playMusicNote(noteName, startTime, duration, type, volume, trackGain) {
        if (!noteName || !trackGain || this.muted) return;

        const audio = this.getContext();
        if (!audio) return;

        const frequency = this.noteToFrequency(noteName);
        if (!frequency) return;

        try {
          const oscillator = audio.createOscillator();
          const gain = audio.createGain();
          const filter = audio.createBiquadFilter();

          oscillator.type = type || "square";
          oscillator.frequency.setValueAtTime(frequency, startTime);

          filter.type = "lowpass";
          filter.frequency.setValueAtTime(type === "triangle" ? 1800 : 1400, startTime);
          filter.Q.setValueAtTime(0.7, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), startTime + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          oscillator.connect(filter);
          filter.connect(gain);
          gain.connect(trackGain);

          oscillator.start(startTime);
          oscillator.stop(startTime + duration + 0.04);
        } catch (error) {
          console.warn("Music note failed:", error);
        }
      },

      playNoiseBurst(duration = 0.055, volume = 0.025, delay = 0) {
        if (this.muted) return;

        const audio = this.getContext();
        if (!audio) return;

        try {
          const sampleRate = audio.sampleRate;
          const bufferLength = Math.max(1, Math.floor(sampleRate * duration));
          const buffer = audio.createBuffer(1, bufferLength, sampleRate);
          const output = buffer.getChannelData(0);

          for (let i = 0; i < bufferLength; i++) {
            output[i] = (Math.random() * 2 - 1) * (1 - i / bufferLength);
          }

          const source = audio.createBufferSource();
          const filter = audio.createBiquadFilter();
          const gain = audio.createGain();
          const startTime = audio.currentTime + delay;

          filter.type = "bandpass";
          filter.frequency.setValueAtTime(880, startTime);
          filter.Q.setValueAtTime(6, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), startTime + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          source.buffer = buffer;
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.sfxGain || this.masterGain || audio.destination);
          source.start(startTime);
          source.stop(startTime + duration + 0.03);
        } catch (error) {
          console.warn("Noise sound failed:", error);
        }
      },

          } else if (soundName === "finalRank") {
            this.playTone(392, 0.10, "triangle", 0.034, 0);
            this.playTone(523, 0.10, "triangle", 0.034, 0.12);

            this.playTone(988, 0.18, "square", 0.022, 0.43);
          } else if (soundName === "finalFailure") {
            this.playTone(330, 0.12, "sawtooth", 0.030, 0, null, 220);
            this.playTone(196, 0.18, "sawtooth", 0.026, 0.15, null, 130);

          console.warn("Sound effect failed:", error);
        }
      },

      startMusic(trackName) {
        const track = this.tracks[trackName];
        const audio = this.getContext();

        if (!track || !audio || !this.ready) return;

        this.stopMusic(0.35);

        this.currentMusic = trackName;
        this.trackGeneration += 1;
        const generation = this.trackGeneration;

        const trackGain = audio.createGain();
        trackGain.gain.setValueAtTime(0.0001, audio.currentTime);
        trackGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, track.volume), audio.currentTime + 0.75);
        trackGain.connect(this.musicGain || this.masterGain || audio.destination);

        this.currentTrackGain = trackGain;
        this.stepIndex = 0;
        this.nextStepTime = audio.currentTime + 0.05;

        this.scheduleMusic(generation);
      },

      stopMusic(fadeSeconds = 0.45) {
        const audio = this.context;

        if (this.musicTimer) {
          clearTimeout(this.musicTimer);
          this.musicTimer = null;
        }

        if (audio && this.currentTrackGain) {
          const oldGain = this.currentTrackGain;
          try {
            oldGain.gain.cancelScheduledValues(audio.currentTime);
            oldGain.gain.setTargetAtTime(0.0001, audio.currentTime, Math.max(0.02, fadeSeconds / 3));
            setTimeout(function () {
              try { oldGain.disconnect(); } catch (error) {}
            }, Math.ceil((fadeSeconds + 0.8) * 1000));
          } catch (error) {
            console.warn("Music fade failed:", error);
          }
        }

        this.currentTrackGain = null;
        this.currentMusic = null;
      },

      switchMusic(trackName) {
        this.desiredMusic = trackName || null;

        if (!this.ready) {
          return;
        }

        if (!trackName) {
          this.stopMusic();
          return;
        }

        if (this.currentMusic === trackName) {
          return;
        }

        this.startMusic(trackName);
      },

      scheduleMusic(generation) {
        if (generation !== this.trackGeneration) return;

        const audio = this.getContext();
        const track = this.tracks[this.currentMusic];

        if (!audio || !track || !this.currentTrackGain || !this.ready) return;

        const secondsPerStep = (60 / track.tempo) / 2;
        const melodyLength = track.melody.length;

        while (this.nextStepTime < audio.currentTime + this.scheduleAheadTime) {
          const position = this.stepIndex % melodyLength;
          const stepTime = this.nextStepTime;
          const melodicNote = track.melody[position];
          const harmonyNote = track.harmony[position % track.harmony.length];
          const bassNote = track.bass[position % track.bass.length];

          if (melodicNote) {
            this.playMusicNote(melodicNote, stepTime, secondsPerStep * 0.72, track.wave, track.melodyVolume, this.currentTrackGain);
          }

          if (harmonyNote && position % 2 === 1) {
            this.playMusicNote(harmonyNote, stepTime + secondsPerStep * 0.05, secondsPerStep * 0.62, "triangle", track.harmonyVolume, this.currentTrackGain);
          }

          if (bassNote) {
            this.playMusicNote(bassNote, stepTime, secondsPerStep * 1.42, "triangle", track.bassVolume, this.currentTrackGain);
          }

          // Very soft tick on selected off-beats gives the music movement without becoming a drum loop.
          if (this.currentMusic === "gameplay" && position % 8 === 6) {
            this.playMusicNote("C5", stepTime, 0.035, "square", 0.004, this.currentTrackGain);
          }

          if (this.currentMusic === "port" && position % 8 === 4) {
            this.playMusicNote("A5", stepTime, 0.045, "triangle", 0.0045, this.currentTrackGain);
          }

          this.nextStepTime += secondsPerStep;
          this.stepIndex += 1;
        }

        const self = this;
        this.musicTimer = setTimeout(function () {
          self.scheduleMusic(generation);
        }, this.schedulerIntervalMs);
      }
    };

    function getDesiredMusicTrack() {
      if (gameState === "loading" || gameState === "title" || gameState === "briefing" || introSequence.active) {
        return "title";
      }

      if (gameState === "finalScore" || gameState === "learningSummary") {
        return getFinalRank() === "Failed SCM Ending" ? "endingFailure" : "endingSuccess";
      }

      if (gameState === "playing" || openingCutscene.active) {
        return currentMap.id === "portAzure" ? "port" : "gameplay";
      }

      return null;
    }

    function updateMusicForCurrentState() {
      audioManager.switchMusic(getDesiredMusicTrack());
    }

    function getAudioContext() {
      return audioManager.getContext();
    }

    function initializeAudioFromUserGesture() {
      audioManager.initFromUserGesture();
    }

    function updateSoundToggleButton() {
      if (!soundToggleButton) return;

      soundToggleButton.textContent = audioManager.muted ? "Sound: Off (V)" : "Sound: On (V)";
      soundToggleButton.setAttribute("aria-pressed", audioManager.muted ? "true" : "false");
      soundToggleButton.classList.toggle("sound-muted", audioManager.muted);
    }

    function setSoundMuted(muted) {
      audioManager.setMuted(muted);
    }

    function toggleSoundMute() {
      audioManager.toggleMute();
    }

    function playSound(soundName) {
      audioManager.playSfx(soundName);
    }

    function maybePlayLowTimeWarning() {
      const quest = getActiveQuest();
      const mapId = currentMap.id;

      if (!quest || lowTimeWarningPlayed[mapId]) return;

      if (quest.timeRemaining > 0 && quest.timeRemaining < 10) {
        lowTimeWarningPlayed[mapId] = true;
        playSound("lowTimeWarning");
      }
    }

    function choiceHasNegativeSCM(choice) {
      if (!choice || !choice.scmChanges) return false;
      const changes = choice.scmChanges;

      if ((changes.scmScore || 0) < 0) return true;
      if ((changes.cargoCondition || 0) < 0) return true;
      if (changes.wrongGoodsLoaded === true) return true;
      if (changes.damagedGoodsMixed === true) return true;
      if (changes.correctContainerReleased === false) return true;
      if (changes.documentsVerified === false && (changes.scmScore || 0) < 1) return true;
      if (changes.truckLoadedCorrectly === false && (changes.scmScore || 0) < 1) return true;
      if (changes.damagedGoodsSeparated === false && (changes.scmScore || 0) < 1) return true;

      return false;
    }

    function choiceHasPositiveSCM(choice) {
      if (!choice || !choice.scmChanges) return false;
      const changes = choice.scmChanges;

      return (
        (changes.scmScore || 0) > 0 ||
        changes.stockVerified === true ||
        changes.pickingListCorrected === true ||
        changes.truckLoadedCorrectly === true ||
        changes.documentsVerified === true ||
        changes.correctContainerReleased === true ||
        changes.damagedGoodsSeparated === true ||
        changes.correctRouteChosen === true
      );
    }

    function getDecisionSoundForChoice(choice) {
      if (choiceHasPenalty(choice) || choiceHasNegativeSCM(choice)) {
        return "wrongDecision";
      }

      if (choiceHasPositiveSCM(choice) || choice.advanceStep) {
        return "correctDecision";
      }

      return "menuConfirm";
    }

    function choiceHasPenalty(choice) {
      if (!choice) return false;

      if (choice.timeChange && choice.timeChange < 0) {
        return true;
      }

      if (!choice.statChanges) {
        return false;
      }

      for (const statName in choice.statChanges) {
        if (choice.statChanges[statName] < 0) {
          return true;
        }
      }

      return false;
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(array) {
      return array[randomInt(0, array.length - 1)];
    }

    function padContainerNumber(number) {
      return String(number).padStart(3, "0");
    }

    function makeContainerCode(number) {
      return "PA-" + padContainerNumber(number);
    }

    function generateSimilarWrongContainerCode(correctNumber) {
      const codeText = padContainerNumber(correctNumber);
      const tens = Number(codeText[1]);
      const ones = Number(codeText[2]);

      const candidates = [
        200 + ones * 10 + tens,
        correctNumber + 9,
        correctNumber - 9,
        correctNumber + 1,
        correctNumber - 1,
        correctNumber + 10,
        correctNumber - 10
      ].filter(function (candidate) {
        return candidate >= 201 && candidate <= 299 && candidate !== correctNumber;
      });

      return makeContainerCode(pickRandom(candidates));
    }

    function generateRunData() {
      let riceSystemCount;
      let riceShelfCount;
      let misplacedRiceCount;
      let riceActualAvailable;
      let riceShortage;

      // Build the stock puzzle from the answer backwards so it is always solvable.
      do {
        riceSystemCount = randomInt(18, 26);
        misplacedRiceCount = randomInt(3, 7);
        riceShortage = randomInt(2, 6);
        riceActualAvailable = riceSystemCount - riceShortage;
        riceShelfCount = riceActualAvailable - misplacedRiceCount;
      } while (riceShelfCount < 8 || riceShelfCount >= riceSystemCount || riceActualAvailable >= riceSystemCount);

      let truckCapacity;
      let rafiOrder;
      let nilaOrder;
      let festivalOrder;
      let totalBoxes;
      let rafiFirstTrip;
      let rafiRemaining;

      // Festival and Nila fit first; Rafi is split only after urgent goods are loaded.
      do {
        truckCapacity = randomInt(18, 24);
        festivalOrder = randomInt(4, 7);
        nilaOrder = randomInt(6, 10);
        rafiOrder = randomInt(14, 20);
        totalBoxes = rafiOrder + nilaOrder + festivalOrder;
        rafiFirstTrip = truckCapacity - festivalOrder - nilaOrder;
        rafiRemaining = rafiOrder - rafiFirstTrip;
      } while (
        totalBoxes <= truckCapacity ||
        rafiFirstTrip < 1 ||
        rafiRemaining < 1 ||
        festivalOrder + nilaOrder > truckCapacity
      );

      const cookingOilTotal = randomInt(5, 8);
      const damagedOilBoxes = randomInt(1, Math.min(3, cookingOilTotal - 1));
      const safeOilBoxes = cookingOilTotal - damagedOilBoxes;

      const correctContainerNumber = randomInt(201, 299);
      const correctContainerCode = makeContainerCode(correctContainerNumber);
      const wrongContainerCode = generateSimilarWrongContainerCode(correctContainerNumber);

      return {
        riceSystemCount,
        riceShelfCount,
        misplacedRiceCount,
        riceActualAvailable,
        riceShortage,
        truckCapacity,
        rafiOrder,
        nilaOrder,
        festivalOrder,
        totalBoxes,
        rafiFirstTrip,
        rafiRemaining,
        cookingOilTotal,
        damagedOilBoxes,
        safeOilBoxes,
        correctContainerCode,
        wrongContainerCode,
        wrongPickedItem: pickRandom(["Tea Powder", "Chili Powder", "Curry Mix", "Herb Pack"]),
        dryGoodsBoxes: 8,
        festivalSupplyBoxes: 4
      };
    }

    function getRunData() {
      if (!runData) {
        startNewRun();
      }

      return runData;
    }

    function formatRunDataItemLower(itemName) {
      return itemName.toLowerCase();
    }

    function applyRunDataToWorld() {
      if (!runData || typeof interactiveObjects === "undefined" || typeof npcs === "undefined") return;

      for (const object of interactiveObjects) {
        if (object.name === "Rice Shelf A-01") {
          object.defaultDialogue = [
            "Rice Shelf A-01: System says " + runData.riceSystemCount + " boxes. Actual shelf has " + runData.riceShelfCount + " boxes.",
            "Nearby misplaced boxes: " + runData.misplacedRiceCount + "."
          ];
        }

        if (object.name === "Spice Shelf B-04") {
          object.defaultDialogue = [
            "Spice Shelf B-04: The shelf label says Mixed Spices.",
            "The visible box code says " + runData.wrongPickedItem + "."
          ];
        }

        if (object.name === "Picking List Table") {
          object.defaultDialogue = [
            "Picking List Table: Order needs 10 rice, 5 Mixed Spices, and 3 cooking oil.",
            "Prepared goods are 10 rice, 5 " + runData.wrongPickedItem + ", and 3 cooking oil."
          ];
        }

        if (object.name === "Truck") {
          object.defaultDialogue = [
            "Truck: Capacity is " + runData.truckCapacity + " boxes.",
            "Orders total " + runData.totalBoxes + " boxes: Rafi Market " + runData.rafiOrder + ", Nila Grocery " + runData.nilaOrder + ", Festival Stall " + runData.festivalOrder + "."
          ];
        }

        if (object.name === "Cargo Release Desk") {
          object.defaultDialogue = [
            "Cargo Release Desk: The cargo release form is missing key confirmation.",
            "Two container numbers are listed nearby: " + runData.correctContainerCode + " and " + runData.wrongContainerCode + "."
          ];
        }

        if (object.dynamicRunDataKey === "correctContainer") {
          object.name = "Container " + runData.correctContainerCode;
          object.defaultDialogue = [
            "Container " + runData.correctContainerCode + ": The seal number matches the release document.",
            "This appears to be the correct container."
          ];
        }

        if (object.dynamicRunDataKey === "wrongContainer") {
          object.name = "Container " + runData.wrongContainerCode;
          object.defaultDialogue = [
            "Container " + runData.wrongContainerCode + ": The number looks similar, but it does not match the release document.",
            "This is the wrong container."
          ];
        }

        if (object.name === "Damaged Goods Pallet") {
          object.defaultDialogue = [
            "Damaged Goods Pallet: Shipment contains " + runData.cookingOilTotal + " cooking oil boxes, " + runData.dryGoodsBoxes + " dry goods boxes, and " + runData.festivalSupplyBoxes + " festival supply boxes.",
            "Problem: " + runData.damagedOilBoxes + " cooking oil boxes are damaged."
          ];
        }
      }

      for (const npc of npcs) {
        if (npc.mapId === "ravenford" && npc.name === "Merchant Rafi") {
          npc.defaultDialogue = [
            "Merchant Rafi: My market needs " + runData.rafiOrder + " boxes, but the festival route has other stops too.",
            "Merchant Rafi: If the road to Port Azure opens, new trade will begin."
          ];
        }

        if (npc.mapId === "portAzure" && npc.name === "Dock Worker Jae") {
          npc.defaultDialogue = [
            "Dock Worker Jae: " + runData.damagedOilBoxes + " cooking oil boxes came in damaged.",
            "Dock Worker Jae: Do not mix damaged goods with sellable goods."
          ];
        }
      }
    }

    function startNewRun() {
      runData = generateRunData();
      applyRunDataToWorld();

      if (DEBUG_RUN_DATA) {
        console.log("ROUTEBOUND runData", runData);
      }
    }


    // Tile types:
    // 0 = ground / grass
    // 1 = path
    // 2 = wall / building
    // 3 = tree
    // 4 = water
    // 5 = door
    // 6 = locked road barrier

    function fillRect(map, startX, startY, width, height, tileType) {
      for (let y = startY; y < startY + height; y++) {
        for (let x = startX; x < startX + width; x++) {
          if (map[y] && map[y][x] !== undefined) {
            map[y][x] = tileType;
          }
        }
      }
    }

    function createRavenfordMap() {
      const rows = 30;
      const cols = 40;
      const map = Array.from({ length: rows }, () => Array(cols).fill(0));

      // Tree border
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (y === 0 || y === rows - 1 || x === 0 || x === cols - 1) {
            map[y][x] = 3;
          }
        }
      }

      // Main roads
      for (const y of [2, 7, 12, 17, 22, 27]) {
        for (let x = 2; x <= 37; x++) map[y][x] = 1;
      }

      // Vertical connector roads
      for (let y = 2; y <= 27; y++) {
        map[y][2] = 1;
        map[y][37] = 1;
      }

      // Paths to work areas
      for (let x = 9; x <= 13; x++) map[6][x] = 1;
      for (let y = 5; y <= 7; y++) map[y][12] = 1;

      for (let x = 30; x <= 33; x++) map[11][x] = 1;
      for (let y = 10; y <= 12; y++) map[y][32] = 1;

      for (let x = 18; x <= 20; x++) map[16][x] = 1;
      for (let y = 15; y <= 17; y++) map[y][19] = 1;

      for (let x = 27; x <= 29; x++) map[21][x] = 1;
      for (let y = 20; y <= 22; y++) map[y][28] = 1;

      // Buildings
      fillRect(map, 9, 4, 6, 2, 2);
      map[5][12] = 5;

      fillRect(map, 29, 9, 5, 2, 2);
      map[10][32] = 5;

      fillRect(map, 16, 14, 6, 2, 2);
      map[15][19] = 5;

      fillRect(map, 26, 19, 5, 2, 2);
      map[20][28] = 5;

      // Water
      fillRect(map, 26, 4, 5, 3, 4);
      fillRect(map, 12, 9, 5, 3, 4);
      fillRect(map, 4, 19, 5, 3, 4);
      fillRect(map, 29, 14, 4, 3, 4);
      fillRect(map, 14, 24, 5, 2, 4);

      // Trees
      fillRect(map, 4, 4, 2, 2, 3);
      fillRect(map, 18, 4, 3, 2, 3);
      fillRect(map, 3, 9, 3, 2, 3);
      fillRect(map, 24, 9, 2, 2, 3);
      fillRect(map, 9, 14, 2, 2, 3);
      fillRect(map, 12, 19, 3, 2, 3);
      fillRect(map, 34, 19, 2, 2, 3);
      fillRect(map, 5, 24, 3, 2, 3);
      fillRect(map, 27, 24, 3, 2, 3);

      // Locked road to Port Azure.
      map[12][38] = 6;
      map[12][39] = 6;

      return map;
    }

    function createPortAzureMap() {
      const rows = 30;
      const cols = 40;
      const map = Array.from({ length: rows }, () => Array(cols).fill(0));

      // Water border and ocean side
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (y === 0 || y === rows - 1 || x === 0 || x === cols - 1 || y >= 19 || x >= 31) {
            map[y][x] = 4;
          }
        }
      }

      // Dry port land
      for (let y = 1; y < 19; y++) {
        for (let x = 1; x < 31; x++) map[y][x] = 0;
      }

      // Main roads and docks
      for (let x = 1; x <= 30; x++) map[12][x] = 1;
      for (let y = 3; y <= 18; y++) map[y][8] = 1;
      for (let y = 4; y <= 25; y++) map[y][20] = 1;
      for (let y = 5; y <= 25; y++) map[y][26] = 1;
      for (let x = 8; x <= 28; x++) map[25][x] = 1;

      // Return road to Ravenford
      map[12][0] = 1;
      map[12][1] = 1;
      map[12][2] = 1;

      // Final road to Festival Grounds
      map[12][30] = 1;
      map[12][31] = 1;
      map[12][32] = 1;
      map[12][33] = 1;

      // Port buildings
      fillRect(map, 5, 4, 6, 3, 2);
      map[7][8] = 5;

      fillRect(map, 17, 4, 6, 3, 2);
      map[7][20] = 5;

      fillRect(map, 24, 7, 5, 3, 2);
      map[10][26] = 5;

      // Container blocks
      fillRect(map, 11, 14, 4, 2, 2);
      fillRect(map, 15, 16, 4, 2, 2);

      // Decorative trees
      fillRect(map, 3, 3, 2, 2, 3);
      fillRect(map, 13, 4, 2, 2, 3);
      fillRect(map, 28, 13, 2, 2, 3);

      return map;
    }

    function createFestivalGroundsMap() {
      const rows = 18;
      const cols = 24;
      const map = Array.from({ length: rows }, () => Array(cols).fill(0));

      // Small focused final map: garden border, entrance, stalls, organizer table, delivery zone.
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (y === 0 || y === rows - 1 || x === 0 || x === cols - 1) map[y][x] = 3;
        }
      }

      // Entrance and central festival path.
      for (let x = 1; x <= 22; x++) map[14][x] = 1;
      for (let y = 2; y <= 14; y++) map[y][12] = 1;
      for (let x = 4; x <= 20; x++) map[7][x] = 1;
      for (let x = 7; x <= 17; x++) map[11][x] = 1;
      for (let y = 11; y <= 15; y++) map[y][6] = 1;
      for (let y = 11; y <= 15; y++) map[y][18] = 1;

      // Route back to Port Azure.
      map[14][0] = 1;
      map[14][1] = 1;

      // Stalls and inspection structures.
      fillRect(map, 4, 4, 4, 2, 2);
      fillRect(map, 16, 4, 4, 2, 2);
      fillRect(map, 4, 9, 4, 2, 2);
      fillRect(map, 16, 9, 4, 2, 2);
      fillRect(map, 10, 2, 5, 2, 2); // organizer table
      fillRect(map, 10, 12, 5, 2, 1); // final delivery area

      // Door-like openings at stall fronts.
      map[6][5] = 5;
      map[6][18] = 5;
      map[11][5] = 5;
      map[11][18] = 5;

      // Clear key NPC and delivery tiles.
      [
        [12,10], [7,13], [18,13], [12,15], [12,14], [12,11], [1,14], [2,14], [3,14]
      ].forEach(function (pos) { map[pos[1]][pos[0]] = 1; });

      // Flower/tree clusters around the small grounds.
      fillRect(map, 2, 2, 2, 2, 3);
      fillRect(map, 20, 2, 2, 2, 3);
      fillRect(map, 2, 15, 2, 1, 3);
      fillRect(map, 20, 15, 2, 1, 3);

      return map;
    }

    const maps = {
      ravenford: {
        id: "ravenford",
        name: "Ravenford Village",
        tiles: createRavenfordMap(),
        spawn: { x: 2, y: 2 },
        portExit: { x: 38, y: 12 },
        returnSpawn: { x: 37, y: 12 }
      },
      portAzure: {
        id: "portAzure",
        name: "Port Azure",
        tiles: createPortAzureMap(),
        spawnFromRavenford: { x: 2, y: 12 },
        ravenfordExit: { x: 1, y: 12 },
        festivalExit: { x: 32, y: 12 },
        returnSpawnFromFestival: { x: 29, y: 12 }
      },
      festivalGrounds: {
        id: "festivalGrounds",
        name: "Festival Grounds",
        tiles: createFestivalGroundsMap(),
        spawnFromPort: { x: 2, y: 14 },
        portAzureExit: { x: 1, y: 14 },
        finalDeliveryZone: { x: 12, y: 14 }
      }
    };

    let currentMap = maps.ravenford;
    let gameMap = currentMap.tiles;

    function getMapWidth() {
      return gameMap[0].length * TILE_SIZE;
    }

    function getMapHeight() {
      return gameMap.length * TILE_SIZE;
    }

    // ===============================
    // PLAYER AND CAMERA
    // ===============================

    const camera = { x: 0, y: 0 };

    const player = {
      x: TILE_SIZE * maps.ravenford.spawn.x,
      y: TILE_SIZE * maps.ravenford.spawn.y,
      targetX: TILE_SIZE * maps.ravenford.spawn.x,
      targetY: TILE_SIZE * maps.ravenford.spawn.y,
      size: 28,
      speed: 4,
      moving: false,
      facing: "down",
      color: "#2f5eff"
    };

    function updateCamera() {
      camera.x = player.x + TILE_SIZE / 2 - canvas.width / 2;
      camera.y = player.y + TILE_SIZE / 2 - canvas.height / 2;

      camera.x = Math.max(0, Math.min(camera.x, getMapWidth() - canvas.width));
      camera.y = Math.max(0, Math.min(camera.y, getMapHeight() - canvas.height));
    }

    function switchMap(mapId, spawnTileX, spawnTileY) {
      currentMap = maps[mapId];
      gameMap = currentMap.tiles;

      player.x = spawnTileX * TILE_SIZE;
      player.y = spawnTileY * TILE_SIZE;
      player.targetX = player.x;
      player.targetY = player.y;
      player.moving = false;

      closeDialogue();
      updateCamera();

      if (gameState === "playing" && mapId === "portAzure") {
        saveGame({ showMessage: true });
        if (!portCarryOverSceneShown) {
          portCarryOverSceneShown = true;
          applyPortAzureCarryOverEffects();
          showPortAzureArrivalScene();
          saveGame({ showMessage: false });
        }
      }

      if (gameState === "playing" && mapId === "festivalGrounds") {
        saveGame({ showMessage: true });
        if (festivalGrounds.unlocked && !festivalGrounds.inspectionCompleted) {
          startFestivalInspectionSequence();
        }
      }
    }

    function checkMapTransition() {
      if (gameState !== "playing" || player.moving || activeDialogueTarget || activeChoices) return;

      const tileX = getPlayerTileX();
      const tileY = getPlayerTileY();

      if (
        currentMap.id === "ravenford" &&
        ravenford.portRoadUnlocked &&
        tileX >= maps.ravenford.portExit.x &&
        tileY === maps.ravenford.portExit.y
      ) {
        switchMap("portAzure", maps.portAzure.spawnFromRavenford.x, maps.portAzure.spawnFromRavenford.y);
        return;
      }

      if (
        currentMap.id === "portAzure" &&
        tileX <= maps.portAzure.ravenfordExit.x &&
        tileY === maps.portAzure.ravenfordExit.y
      ) {
        switchMap("ravenford", maps.ravenford.returnSpawn.x, maps.ravenford.returnSpawn.y);
        return;
      }

      if (
        currentMap.id === "portAzure" &&
        festivalGrounds.unlocked &&
        tileX >= maps.portAzure.festivalExit.x &&
        tileY === maps.portAzure.festivalExit.y
      ) {
        showSaveMessage("Final Destination Unlocked: Festival Grounds");
        switchMap("festivalGrounds", maps.festivalGrounds.spawnFromPort.x, maps.festivalGrounds.spawnFromPort.y);
        return;
      }

      if (
        currentMap.id === "festivalGrounds" &&
        festivalGrounds.inspectionCompleted &&
        tileX <= maps.festivalGrounds.portAzureExit.x &&
        tileY === maps.festivalGrounds.portAzureExit.y
      ) {
        switchMap("portAzure", maps.portAzure.returnSpawnFromFestival.x, maps.portAzure.returnSpawnFromFestival.y);
      }
    }


    // ===============================
    // INTRO SEQUENCE
    // ===============================

    const introSequence = {
      active: true,
      phase: "loading",
      loadingStartedAt: performance.now(),
      phaseStartedAt: performance.now(),
      loadingDuration: 2600
    };

    function setIntroPhase(phase) {
      introSequence.phase = phase;
      introSequence.phaseStartedAt = performance.now();
      setGameState(phase);
    }

    function finishIntroSequence() {
      if (resetOnNextStart) {
        resetGameProgress();
        resetOnNextStart = false;
      } else if (!runData) {
        startNewRun();
      }

      introSequence.active = false;

      // The new title/briefing flow is now the beginning sequence.
      // Start the player directly at Stage 1 in Ravenford Village.
      openingCutscene.active = false;
      openingCutscene.index = openingCutscene.lines.length;

      switchMap("ravenford", maps.ravenford.spawn.x, maps.ravenford.spawn.y);
      setGameState("playing");
      saveGame({ showMessage: false });

      // Clear held keys so the player does not move immediately after pressing Enter.
      for (const key in keys) {
        keys[key] = false;
      }
    }

    function updateIntroSequence(now) {
      if (!introSequence.active) return;

      if (introSequence.phase === "loading") {
        const elapsed = now - introSequence.loadingStartedAt;

        if (elapsed >= introSequence.loadingDuration) {
          setIntroPhase("title");
        }
      }
    }

    function advanceIntroSequence() {
      if (!introSequence.active) return;

      if (introSequence.phase === "loading") {
        return;
      }

      if (introSequence.phase === "title") {
        confirmTitleMenuSelection();
        return;
      }

      if (introSequence.phase === "newGameConfirm") {
        confirmNewGameSelection();
        return;
      }

      if (introSequence.phase === "rankHistory") {
        return;
      }

      if (introSequence.phase === "briefing") {
        playSound("menuConfirm");
        finishIntroSequence();
      }
    }


    // ===============================
    // OPENING CUTSCENE
    // ===============================

    const openingCutscene = {
      active: true,
      index: 0,
      lines: [
        {
          speaker: "Narrator",
          text: "A tired bus rolls into Ravenford Village just as the festival rush begins."
        },
        {
          speaker: "Narrator",
          text: "You step off the bus with your trainee badge and a small notebook."
        },
        {
          speaker: "Kai",
          text: "So you are the new trainee? I am Kai. Try to keep up."
        },
        {
          speaker: "Kai",
          text: "I am your rival here. If there is a mistake to catch, I will catch it first."
        },
        {

        },

        },
        {
          speaker: "Manager Mira",

        }
      ]
    };

    function finishOpeningCutscene() {
      openingCutscene.active = false;
      openingCutscene.index = openingCutscene.lines.length;

      // Clear input so held keys do not trigger movement immediately after the cutscene.
      for (const key in keys) {
        keys[key] = false;

    function advanceOpeningCutscene() {
      if (!openingCutscene.active) return;

      playSound("interaction");
      openingCutscene.index++;

      if (openingCutscene.index >= openingCutscene.lines.length) {
        finishOpeningCutscene();

    // ===============================
    // STATS, ITEMS, AND RIVAL STATE
    // ===============================

    const playerStats = {
      Planning: 0,
      Inventory: 0,
      Warehouse: 0,
      Transport: 0,
      Negotiation: 0,
      Reputation: 0,
      Coins: 0
    };

    // Hidden Supply Chain Management performance state.
    // These values are intentionally not shown during normal play.
    // They appear only on the final ending screen.
    const scmPerformance = {
      scmScore: 0,
      cargoCondition: 100,
      timeLost: 0,
      deadlineFailed: false,
      rushedShipment: false,
      wrongGoodsLoaded: false,
      damagedGoodsMixed: false,
      stockVerified: false,

      truckLoadedCorrectly: false,

    };

    const playerItems = [];
    let statsMenuOpen = false;

    const rivalState = {
      ravenfordKaiDefeated: false,
      portAzureKaiDefeated: false
    };

    // Stage 0 product-research tracking. Hidden like the SCM system; it shapes
    // choice framing and a small preparation bonus, but is never required.
    const researchState = {
      productManualRead: false,
      orderSheetRead: false,
      safetyNoticeRead: false,
      cargoReportRead: false,
      preparationRewarded: false
    };

    const RESEARCH_FLAG_BY_OBJECT = {
      "Product Handling Manual": "productManualRead",
      "Customer Order Sheet": "orderSheetRead",
      "Warehouse Safety Notice": "safetyNoticeRead",
      "Cargo Condition Report": "cargoReportRead"
    };

    // RPG-style quest log state. It gives broad guidance without exposing the
    // hidden logistics answer sequence or internal SCM scoring variables.
    const DEFAULT_OPTIONAL_HINTS = [
      "A fast delivery is useless if the goods are wrong.",
      "Check the product identity before loading.",
      "The biggest order is not always the most urgent.",
      "Damaged goods should not be mixed with clean goods.",
      "Similar container numbers can cause wrong release."
    ];

    const questLogState = {
      completedObjectives: [],

    const SIDE_QUEST_DEFINITIONS = {
      linaMislabeledProducts: { title: "Lina — Mislabeled Products", shortTitle: "Mislabeled Products", npc: "Lina", mapId: "ravenford", location: "Ravenford warehouse / inventory area" },
      bramPalletInspection: { title: "Bram — Pallet Inspection", shortTitle: "Pallet Inspection", npc: "Bram", mapId: "ravenford", location: "Truck yard" },
      rafiAngryCustomer: { title: "Merchant Rafi — Angry Customer", shortTitle: "Angry Customer", npc: "Merchant Rafi", mapId: "ravenford", location: "Market area" },
      seleneSuspiciousContainer: { title: "Officer Selene — Suspicious Container", shortTitle: "Suspicious Container", npc: "Officer Selene", mapId: "portAzure", location: "Port Azure customs / dock area" },

    const sideQuests = createDefaultSideQuestState();

    function createDefaultSideQuestState() {
      const state = {};
      Object.keys(SIDE_QUEST_DEFINITIONS).forEach(function (questId) {
        state[questId] = { started: false, completed: false, failed: false, rewardClaimed: false };
      });
      return state;
    }

    function resetSideQuests() {
      const freshState = createDefaultSideQuestState();
      Object.keys(freshState).forEach(function (questId) {
        sideQuests[questId].started = false;
        sideQuests[questId].completed = false;
        sideQuests[questId].failed = false;
        sideQuests[questId].rewardClaimed = false;
      });
    }

    function restoreSideQuests(savedSideQuests) {
      resetSideQuests();
      if (!savedSideQuests || typeof savedSideQuests !== "object") return;

      Object.keys(SIDE_QUEST_DEFINITIONS).forEach(function (questId) {
        const savedQuest = savedSideQuests[questId];
        if (!savedQuest || typeof savedQuest !== "object") return;
        sideQuests[questId].started = Boolean(savedQuest.started);
        sideQuests[questId].completed = Boolean(savedQuest.completed);
        sideQuests[questId].failed = Boolean(savedQuest.failed);
        sideQuests[questId].rewardClaimed = Boolean(savedQuest.rewardClaimed || savedQuest.completed || savedQuest.failed);
      });
    }

    function getSideQuestState(questId) {
      return sideQuests[questId] || null;
    }

    function getCompletedSideQuestCount() {
      return Object.keys(sideQuests).filter(function (questId) {
        return sideQuests[questId].completed;
      }).length;
    }

    function markSideQuestStarted(questId) {
      const quest = getSideQuestState(questId);
      if (!quest || quest.completed || quest.failed) return false;
      quest.started = true;
      return true;
    }

    function completeSideQuest(questId) {
      const quest = getSideQuestState(questId);
      if (!quest || quest.rewardClaimed) return false;
      quest.started = true;
      quest.completed = true;
      quest.failed = false;
      quest.rewardClaimed = true;
      const definition = SIDE_QUEST_DEFINITIONS[questId];
      if (definition) addCompletedObjective("Request resolved: " + definition.shortTitle);
      return true;
    }

    function failSideQuest(questId, mistakeText) {
      const quest = getSideQuestState(questId);
      if (!quest || quest.completed || quest.failed) return false;
      quest.started = true;
      quest.failed = true;
      quest.completed = false;
      quest.rewardClaimed = true;
      if (mistakeText) addMistake(mistakeText);
      return true;
    }

    function applySideQuestOutcome(choice) {
      if (!choice || !choice.sideQuest) return [];
      const outcome = choice.sideQuest;
      const quest = getSideQuestState(outcome.id);
      if (!quest) return [];
      if (quest.rewardClaimed) return ["That matter has already been settled."];

      markSideQuestStarted(outcome.id);
      if (outcome.result === "complete") completeSideQuest(outcome.id);
      if (outcome.result === "fail") failSideQuest(outcome.id, outcome.mistake);
      if (Array.isArray(outcome.clues)) outcome.clues.forEach(addClue);
      if (Array.isArray(outcome.hints)) outcome.hints.forEach(addHint);
      return [];
    }

    function getSideQuestEntriesByStatus(statusName) {
      return Object.keys(SIDE_QUEST_DEFINITIONS)
        .filter(function (questId) {
          const quest = sideQuests[questId];
          if (!quest) return false;
          if (statusName === "available") return !quest.completed && !quest.failed;
          if (statusName === "completed") return quest.completed;
          if (statusName === "failed") return quest.failed;
          return false;
        })
        .map(function (questId) {
          const definition = SIDE_QUEST_DEFINITIONS[questId];
          if (statusName === "available") {
            const prefix = sideQuests[questId].started ? "In progress" : "Open";
            return prefix + ": " + definition.title + " — " + definition.location;
          }
          return definition.title;
        });
    }

    function addUniqueQuestLogEntry(list, text) {
      const cleanedText = String(text || "").trim();
      if (!cleanedText || !Array.isArray(list)) return false;
      if (list.includes(cleanedText)) return false;
      list.push(cleanedText);
      return true;
    }

    function addCompletedObjective(text) {
      return addUniqueQuestLogEntry(questLogState.completedObjectives, text);
    }

    function addClue(text) {
      return addUniqueQuestLogEntry(questLogState.clues, text);
    }

    function addHint(text) {
      return addUniqueQuestLogEntry(questLogState.hints, text);
    }

    function addMistake(text) {
      return addUniqueQuestLogEntry(questLogState.mistakes, text);
    }

    function resetQuestLogState() {
      questLogState.completedObjectives.length = 0;
      questLogState.clues.length = 0;
      questLogState.hints.length = 0;
      questLogState.mistakes.length = 0;
      DEFAULT_OPTIONAL_HINTS.forEach(addHint);
    }

    function restoreQuestLogState(savedQuestLogState) {
      resetQuestLogState();

      if (!savedQuestLogState || typeof savedQuestLogState !== "object") {
        rebuildQuestLogFromProgress();
        return;
      }

      questLogState.completedObjectives.length = 0;
      questLogState.clues.length = 0;
      questLogState.hints.length = 0;
      questLogState.mistakes.length = 0;

      ["completedObjectives", "clues", "hints", "mistakes"].forEach(function (sectionName) {
        const savedSection = savedQuestLogState[sectionName];
        if (!Array.isArray(savedSection)) return;

        savedSection.forEach(function (entry) {
          addUniqueQuestLogEntry(questLogState[sectionName], entry);
        });
      });

      DEFAULT_OPTIONAL_HINTS.forEach(addHint);
    }

    function renderQuestLog() {
      renderGuiPanel();
    }

    function recordResearchQuestLog(objectName) {
      if (objectName === "Product Handling Manual") {
        addClue("Product codes are more reliable than shelf labels.");
        addClue("Damaged oil can affect dry goods.");
        addHint("Read the handling rules before moving cargo.");
      }

      if (objectName === "Customer Order Sheet") {
        addClue("Festival goods are urgent.");
        addHint("Urgency matters, but accuracy still comes first.");
      }

      if (objectName === "Warehouse Safety Notice") {
        addClue("Damaged goods should be separated from clean goods.");
        addHint("Keep leaking cargo away from dry goods.");
      }

      if (objectName === "Cargo Condition Report") {
        addClue("Final cargo condition affects the delivery rating.");
        addHint("Protecting cargo quality is part of the route decision.");
      }

      if (getResearchReadCount() >= 2) {
        addCompletedObjective("Product research reviewed");
      }
    }

    function recordObjectDiscovery(objectName) {
      if (objectName === "Rice Shelf A-01") {
        addClue("System stock may not match physical stock.");
        addHint("Count real stock before reporting a shortage.");
      }

      if (objectName === "Spice Shelf B-04") {
        addClue("Shelf labels can be wrong.");
        addClue("Product codes are more reliable than shelf labels.");
      }

      if (objectName === "Picking List Table") {
        addClue("Correct quantity does not help if the product identity is wrong.");
      }

      if (objectName === "Truck") {
        addClue("The truck cannot carry all orders in one trip.");
        addHint("Loading decisions should consider capacity and urgency together.");
      }

      if (objectName === "Cargo Release Desk" || objectName === "Container A" || objectName === "Container B") {
        addClue("Container numbers must match the release form.");
        addHint("Similar container numbers can cause wrong release.");
      }

      if (objectName === "Damaged Goods Pallet") {
        addClue("Damaged oil can affect dry goods.");
        addHint("Damaged goods should not be mixed with clean goods.");

        addHint("The fastest route is not always the safest route.");

    function recordQuestStepCompletion(targetName, choice) {
      const step = getCurrentStep();
      const stepTitle = step ? step.title : "";

      if (targetName === "Manager Mira" && stepTitle === "Product Research" && choice && choice.advanceStep) {
        addCompletedObjective("Product research reviewed");
      }

        addCompletedObjective("Rice stock counted");
      }

      if (targetName === "Spice Shelf B-04" && stepTitle === "Spice Problem") {
        addCompletedObjective("Inventory records checked");
      }

      if (targetName === "Picking List Table" && stepTitle === "Picking List Error") {
        addCompletedObjective("Picking list inspected");
      }

      if (targetName === "Truck" && stepTitle === "Truck Capacity Problem") {
        addCompletedObjective("Truck loading plan completed");
      }

      if (targetName === "Kai" && stepTitle === "Rival Challenge 1") {
        addCompletedObjective("Rival loading mistake reviewed");
      }

      if (targetName === "Cargo Release Desk" && stepTitle === "Missing Documents") {
        addCompletedObjective("Cargo documents verified");
      }

      if (targetName === "Kai" && stepTitle === "Rival Challenge 2") {
        addCompletedObjective("Container release challenge reviewed");
      }

      if (targetName === "Damaged Goods Pallet" && stepTitle === "Damaged Goods") {
        addCompletedObjective("Damaged goods inspected");
      }

      if (targetName === "Route Planning Board" && stepTitle === "Route Decision") {
        addCompletedObjective("Final route selected");

        addCompletedObjective("Final port report submitted");

    function recordQuestLogForChoice(choice, requirementFailed) {
      if (!choice) return;

      const targetName = activeDialogueTarget && activeDialogueTarget.name ? activeDialogueTarget.name : "";
      const changes = requirementFailed ? (choice.failureSCMChanges || {}) : (choice.scmChanges || {});

      recordQuestStepCompletion(targetName, choice);

      if (requirementFailed && choice.requirement) {
        addMistake("Attempted a specialist option without enough " + choice.requirement.stat + " experience.");
      }

      if (changes.stockVerified === true) {
        addClue("Physical stock and system stock must be compared.");
      }

      if (changes.pickingListCorrected === true) {
        addClue("Picking lists must match the requested product identity.");
      }

      if (changes.truckLoadedCorrectly === true) {
        addClue("Truck capacity limits the loading plan.");
      }

      if (changes.documentsVerified === true || changes.correctContainerReleased === true) {
        addClue("Container numbers must match the release form.");
      }

      if (changes.damagedGoodsSeparated === true) {
        addClue("Damaged goods should be separated from clean goods.");
      }

      if (changes.correctRouteChosen === true) {
        addClue("A route decision must balance time, risk, and cargo condition.");
      }

      if (changes.wrongGoodsLoaded === true) {
        if (targetName === "Spice Shelf B-04") {
          addMistake("Trusted shelf label without checking product code.");
        } else if (targetName === "Picking List Table") {
          addMistake("Approved a wrong picking list.");
        } else {
          addMistake("Loaded goods before verification.");
        }
      }

      if (changes.truckLoadedCorrectly === false && (changes.scmScore || 0) < 1) {
        addMistake("Loaded the truck without a reliable capacity plan.");
      }

      if (changes.documentsVerified === false && (changes.scmScore || 0) < 1) {
        addMistake("Approved cargo without proper document verification.");
      }

      if (changes.correctContainerReleased === false) {
        addMistake("Selected the wrong container document.");
      }

      if (changes.damagedGoodsMixed === true) {
        addMistake("Mixed damaged goods with clean goods.");
      }

      if (changes.damagedGoodsSeparated === false && (changes.scmScore || 0) < 1) {
        addMistake("Handled damaged goods without proper separation.");
      }

      if (changes.correctRouteChosen === false && targetName === "Route Planning Board") {
        addMistake("Selected a route with avoidable delivery risk.");
      }

      if ((choice.timeChange || 0) <= -10) {
        addMistake("Missed delivery time window.");
      }
    }

    function syncQuestLogMistakesWithSCM() {
      if (wrongGoodsWereDelivered()) {
        addMistake("Wrong goods reached the delivery flow.");
      } else if (scmPerformance.wrongGoodsLoaded) {
        addMistake("Loaded goods before verification.");
      }

      if (scmPerformance.damagedGoodsMixed) {
        addMistake("Mixed damaged goods with clean goods.");

      if (!scmPerformance.correctContainerReleased) {
        addMistake("Selected the wrong container document.");

      if (scmPerformance.deadlineFailed) {
        addMistake("Missed delivery time window.");
      }

    function getStorageSafe() {

        const testKey = "routebound_storage_test";
        storage.setItem(testKey, "1");

    function clonePlainObject(source) {
      return JSON.parse(JSON.stringify(source || {}));
    }

    function copyPlainObject(target, source) {
      if (!target || !source) return;
      Object.keys(target).forEach(function (key) {
        if (Object.prototype.hasOwnProperty.call(source, key)) {
          target[key] = source[key];
        }
      });
    }

    function showSaveMessage(message) {
      const text = message || "Game Saved";
      let toast = document.getElementById("save-toast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "save-toast";
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");
        document.body.appendChild(toast);
      }

      toast.textContent = text;
      toast.classList.add("visible");

      if (saveToastTimer) {
        clearTimeout(saveToastTimer);
      }

      saveToastTimer = setTimeout(function () {
        toast.classList.remove("visible");
      }, 1050);
    }

    function getNPCSaveState() {
      const now = performance.now ? performance.now() : Date.now();
      return npcs.map(function (npc) {
        return {
          mapId: npc.mapId,
          name: npc.name,
          tileX: npc.tileX,
          tileY: npc.tileY,
          pixelX: npc.pixelX,
          pixelY: npc.pixelY,
          targetTileX: npc.targetTileX,
          targetTileY: npc.targetTileY,
          targetPixelX: npc.targetPixelX,
          targetPixelY: npc.targetPixelY,
          homeTileX: npc.homeTileX,
          homeTileY: npc.homeTileY,
          moving: Boolean(npc.moving),
          facing: npc.facing || "down",
          patrolDirection: npc.patrolDirection || 1,
          pauseRemaining: Math.max(0, (npc.pauseUntil || now) - now),
          walkSpeed: npc.walkSpeed || 1.25,
          idleSeed: npc.idleSeed || 0,
          lastIdleTurnAt: npc.lastIdleTurnAt || now
        };
      });
    }

    function restoreNPCSaveState(savedNPCs) {
      initializeNPCMovementState();
      if (!Array.isArray(savedNPCs)) return;

      const now = performance.now ? performance.now() : Date.now();
      savedNPCs.forEach(function (savedNPC) {
        const npc = npcs.find(function (candidate) {
          return candidate.mapId === savedNPC.mapId && candidate.name === savedNPC.name;
        });

        if (!npc) return;

        [
          "tileX", "tileY", "pixelX", "pixelY", "targetTileX", "targetTileY",
          "targetPixelX", "targetPixelY", "homeTileX", "homeTileY", "walkSpeed", "idleSeed"
        ].forEach(function (key) {
          if (Number.isFinite(savedNPC[key])) npc[key] = savedNPC[key];
        });

        npc.moving = Boolean(savedNPC.moving);
        npc.facing = savedNPC.facing || npc.facing || "down";
        npc.patrolDirection = Number.isFinite(savedNPC.patrolDirection) ? savedNPC.patrolDirection : 1;
        npc.pauseUntil = now + Math.max(0, Number(savedNPC.pauseRemaining) || 0);
        npc.lastIdleTurnAt = now;
      });
    }
